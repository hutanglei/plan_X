---
name: 审计意见法
key: audit_opinion
category: 造假识别
alias:
- 非标审计意见
- 审计报告意见类型
- 非标意见识别法
definition: 一眼看出财报猫腻的最简单办法——看审计报告意见类型：审计不敢出具标准无保留意见的财报，多多少少都存在造假问题；但标准无保留意见也不等于真，它只是"CPA自己未发现财务造假现象"。
formula: 方法论：读财报第一步看审计意见类型（无保留意见、带解释性说明的无保留意见、保留意见、无法表示意见、否定意见，后四种均属非标准审计意见；从审计师的保证程度看，由高到低也是这个顺序），非标即拉响造假警报；因无保留意见也可能有假（康美、恒大前车之鉴），须再叠加8项特征交叉验证（足额缴税、现金充足、应收占比低、长期资产无大级别变动、人员与业务匹配、经营现金流超利润、资本性支出少、关联交易不多）；进一步应将审计延伸至现金流量与上下游银行账户的核查——"将现金查个底朝天，就一定能够发现财务造假"。
majinghao_view: |
  只要是审计不敢出具标准无保留意见的财报，多多少少都存在造假的问题，只不过程度不同；审计不敢给标准无保留意见，说明那属于用钱和用人脉都摆不平的造假。
  但无保留意见不等于真：其真实含义只是"CPA自己未发现财务造假现象"，无数事实已证明不少出标准无保留意见的财报也是假的——普华永道连续十四年为恒大出具无保留意见，爆雷前三个月还在背书，康美出事前多年都是无保留意见；但也有一点可以肯定：只要是审计给出了标准无保留意见，至少说明通过合理运用财务技术进行调节，大多数上市公司的财报数据是基本可信的。
  A股审计意见全景（2021年报，4803家）：标准无保留意见4544家（占比95%），非标248家（带强调事项段的无保留意见106家、保留意见98家、无法表示意见43家、否定意见1家），另有11家未在法定期限内披露年报——非标占比虽仅约5%，但每一份非标都是造假警报，看意见筛雷的性价比极高。
  根子在于审计不具独立性：CPA审计是收费的一门生意、审计报告是商品，上市公司是甲方、事务所是乙方；事务所唯一能发挥的监督作用是"用脚投票"——辞职跑路，意思是这账太假了，这钱不挣了。
  审计还有权限天花板：事务所没有权限对审计对象的供应商、客户（上下游）的银行账户进行核查，一般只能实施上下游访谈程序——效果很差，供应商一般都会配合撒谎；只要拥有对上下游银行账户的审计权限，从银行流水入手很容易揭穿伪装，这正是监管机构主导的政府审计能够查出问题的原因。仅靠监管机构管不过来做假账的利益冲动，靠会计师事务所发现财务造假就是一个笑话，应引进民间做空机构形成市场化监督。
thresholds:
  healthy: 标准无保留意见，且具备无造假公司的8项特征：每年足额缴税几无拖欠、账上现金充足不差钱、应收项目占比较低、存货/在建工程/固定资产/无形资产/商誉无大级别变动、人员扩张与业务增长匹配、每年经营性现金流超过利润、资本性支出较少、关联交易不多。
  watch: 带解释性说明的无保留意见（如持续经营重大不确定）——"财报没有大问题，不过有些事情的责任得有人背着，程序已经到位，CPA本人我可以大胆收钱了"；标准无保留意见但审计费畸高且连年续聘；年报"没交卷"（未在法定期限内披露）。
  danger: 保留意见、无法表示意见、否定意见——均属非标，可怀疑财报数据真实性；出具无法表示意见或否定意见的财报，基本难以从中获取公司经营与盈利能力的可靠信息，信息披露极有可能存在重大虚假记载。
fraud_signals:
- 通俗翻译（保留意见）："CPA表示，大家要注意了，部分内容是假的"。
- 通俗翻译（无法表示意见）："钱我还是要收，但本人拒绝与拙劣的骗子合作，等着你这个骗子更换会计师事务所吧"——公司随后的动作往往是更换会计师（慧辰股份预算340万拟新聘）。
- 通俗翻译（否定意见）："天下人都知道你是诈骗犯"。
- 无保留意见的反向风险：不能说出具了标准无保留意见的财报就是真的，只是审计未发现造假；康美出事前多年无保留意见、奇信股份8年造假期间天职国际均出无保留意见。
- 上市公司对抗非标意见：不认可审计结论、怪罪审计机构"审计结论错误"、申请复核——易尚展示、文化长城两案复核均被驳回、维持退市。
- 审计师辞任是强信号：事务所在发现兜不住窟窿时选择"逃跑"，等于宣告"这账太TM假了，这钱我不挣了"。
- “没交卷”信号：未在法定期限内披露年报，绝大多数称审计工作受疫情影响无法推进（吉药控股称财务数据被封在长春市办公楼电脑中）——年报"难产"本身是与非标同级的风险信号。
- 独董/高管"不保真"声明：年报被出具否定意见的公司，往往还伴随独立董事、高管对年报发表"不保真"声明（*ST圣莱：1名独董和2位高管）——管理层自己都不敢担保。
- 审计权限天花板：事务所无权核查上下游银行账户，只能做访谈——这套审计程序多半失败，供应商一般都配合撒谎；查造假的关键是查资金流水而非查报表勾稽，将审计延伸至对下游客户银行账户的核查，就一定能够发现问题。
- 做空机制缺位：上市公司高管做假账的利益冲动全世界都一样，仅靠监管机构不可能管过来；A股应尽快引进民间做空机构（浑水、香橼类），做空力量在追求自身利益的同时形成对上市公司的强力监督。
- 审计深层的制度缺陷：上市公司管理层由被审计人变成审计委托人，决定事务所的聘用、续聘、收费，完全成了事务所的"衣食父母"，事务所往往迁就上市公司甚至与其共谋财务造假。
cases:
- company: 慧辰股份
  article: '262095772'
  point: 2022年报被普华永道出具无法表示意见（子公司北京信唐收入应收账款存疑、A客户印章不一致、商誉减值无法评估），董事会"尊重其独立判断但并不认可"，随即预算340万元拟聘新会计师。
- company: 中国恒大
  article: '284145845'
  point: 普华永道连续14年为恒大出具无保留意见，超2万亿债务爆雷前三个月还在背书，每年拿走4000万+审计费；恒大2019、2020年虚增收入5641亿直接打脸，普华永道后被罚没4.41亿元、暂停执业6个月并撤销广州分所。
- company: 易尚展示
  article: '256312591'
  point: 2021、2022连续两年年报被出具无法表示意见，触及终止上市情形；公司怪罪审计机构"审计结论错误"申请复核，深交所上诉复核委员会维持退市决定。
- company: 文化长城
  article: '256312591'
  point: 2022年报被出具无法表示意见且期末净资产为负，退市；公司发公告长文指责年审机构"未按会计准则开展工作"，复核仍维持终止上市，退市终局。
- company: 奇信股份
  article: '285811028'
  point: 长达8年的财务造假期间，审计机构天职国际每年均出具无保留意见——印证"无保留意见≠真实"。
- company: 紫鑫药业
  article: '253832258'
  point: 2010年年报和2011年中报均由北京中准会计师事务所审计并出具无保留意见，称"财报真实反映业绩和财务状况"，后被揭大规模造假、复制银广夏骗局。
- company: "*ST圣莱"
  article: '219309791'
  point: 2021年A股4803家上市公司中唯一被出具否定意见的公司（002473.SZ），在经历改聘审计机构、推迟年报披露后仍收获否定意见，触及《股票上市规则》第9.3.11条第一款第（三）项终止上市情形、"保壳失败"；内部控制审计报告同样被出具否定意见，另有1名独董和2位高管对年报发表"不保真"声明。
- company: 瑞华会计师事务所
  article: 134313760
  point: 前任天职国际对航天通信2016年报出具非标意见后不到4个月即被更换；瑞华接手后对2017、2018年报均出具标准无保留意见“一路绿灯”，为造假“保驾护航”。
- company: 正中珠江会计师事务所
  article: 126920125
  point: 与康美合作19年，2012-2017年康美多次陷“造假”疑云仍均出具标准无保留意见；马靖昊建议至少罚没这6年间几千万审计费并追责签字注会和事务所。
- company: "*ST毅达"
  article: 125514392
  point: 前任管理层失联，营业执照、公章及会计凭证、财务账簿等财务会计资料下落不明，导致无法按期披露2018年年报和2019年一季报。
quotes:
- 只要是审计不敢出具标准无保留意见的财报，多多少少都存在造假的问题，只不过造假的程度不同罢了
- 审计不敢给出标准无保留意见的财报，那肯定属于用钱和用人脉都摆不平的造假，股民一定要知道这一点
- 通俗地讲，“无保留意见”的真实含义为：“CPA自己未发现财务造假现象
- 通俗地讲，“保留意见”的真实含义为：“CPA表示，大家要注意了，部分内容是假的
- 通俗地讲，“无法表示意见”的真实含义为：“钱我还是要收，但本人拒绝与拙劣的骗子合作，等着你这个骗子更换会计师事务所吧
- 通俗地讲，“否定意见”的真实含义为：“钱本人收了，但我没办法，天下人都知道你是诈骗犯，我不敢不事后举报啊，千万别怪我不地道，我们审计可从来没有在事前主动举报过
- 无数的事实已经证明了不少出具了标准无保留意见的财报也是假的
- 目前CPA审计并不是真正的审计，因为它根本就不具有独立性。CPA审计是收费的一门生意，其所提供的审计报告是一种商品
- 上市公司是它的客户，审计业务是它的一笔生意，上市公司是甲方，会计师事务所是乙方，到底谁该听谁的，一看就明白
- 会计师事务所唯一能够发挥所谓的监督作用也是间接的监督作用，就是“用脚投票”－－辞职跑路，代表的意思为这账太TM假了，这钱我不挣了
- 无数事实已表明，CPA与其客户之间的利益相关性越高，其独立性越差，执业质量就越受到影响。说句难听的话，目前的有偿审计模式是一件人人都知道的皇帝的新衣，但就是没人愿意说破
- 通俗地讲，“带有解释性说明的无保留意见”的真实含义为：“财报没有大问题，不过有些事情的责任得有人背着，程序已经到位，CPA本人我可以大胆收钱了
- 但有一点是可以肯定的，只要是审计给出了标准无保留意见，那么至少说明通过合理运用财务技术进行调节，大多数上市公司的财报数据是基本可信的
- 除了标准无保留意见外，其他任何意见的财报数据都可以怀疑其真实性，多多少少都存在造假情况
- 上市公司高管做假账的利益冲动，全世界都一样，仅靠监管机构不可能管过来，靠会计师事务所发现财务造假就是一个笑话
- 事务所一般只能通过实施对上下游访谈的审计程序，这样一套流程下来，要发现资金运作的陷阱，往往效果很差。事实证明这些审计程序多半都失败了，供应商一般都会配合撒谎
- 将审计延伸至对下游客户的银行账户的核查，就一定能够发现问题
- 如果仅仅为了遏制财务造假，其实，只需审计其现金流量即可，将现金查个底朝天，就一定能够发现财务造假
- 主要原因是上市公司和审计机构是聘请与被聘请的生意关系，在这种情况下，审计机构必然丧失了独立性。他们对上市公司出具非标意见绝大部分是在问题已经暴露、再也无法下掩盖的情况下出具的，如果此时还不出具，就会面临监管层的处罚和舆论的谴责，都是被逼的。
- 无法表示意见：钱我还是要收，但本人拒绝与拙劣的骗子合作，等着你这个骗子更换会计师事务所吧；
- 非标审计报告拿一句通俗的话来说就是，‘外界压力太大了，我们实在无法再与你们这些拙劣的骗子合作了’。
- 在判断上市公司年报是否造假的时候，如果审计师给出负面意见、前一年财务亏损、相对于同行业而言，比较高的其他应收款占流动资产比例、销售毛利率、预付款项占流动资产比例等，那么，就要引起警惕了，这些上市公司年报造假的可能性高。
