name: 洗大澡
key: big_bath
category: 造假识别
alias: [巨额冲销, 一次亏个够, 资产减值洗大澡, 巨额减值出清]
definition: 把未来期间的费用挪到本年来确认，往巨额亏损的方向操纵——把可能在以后期间发生的损失提前确认，"让我一次亏个够"，为以后年度轻装盈利铺路；又称巨额冲销，是高管人员利用公司重组、经营困难、自然灾害、会计制度和准则发生变化，或人员、股东、会计师事务所变更的契机，通过计提资产减值准备和确认或有损失等形式，对资产负债表进行"清洗"和"消毒"，从而释放风险、减轻负担，为以后业绩提升预留空间或平滑利润。
formula: ''
majinghao_view: |
  洗大澡是利润操纵的一种，只是方向相反：不是虚增利润，而是往巨额亏损方向操纵。
  它经常发生在经理层更换的时候，或者公司本期已经亏损、干脆一次亏个够的时候；契机清单还包括公司重组、经营困难、自然灾害、会计制度和准则变化，以及人员、股东、会计师事务所变更。
  目的有两点：一是将亏损的责任推给前任；二是为未来盈利腾出空间、做低来年基数以"扭亏为盈"；亏损年度多计提减值还可减少以后年度的折旧摊销费用、为处置资产时的"减值转出盈利"作储备。
  洗大澡还是掩盖财务造假的工具：虚增利润形成的资产虚胖（藏在资产中的费用），可以通过巨额资产减值"一洗了之"——资产减值准则客观上为虚增资产开了方便之门；通过洗大澡将财务风险一次性出清、将各类坏账一并计提，可减少因连续三年亏损面临退市的风险。
  存货是洗大澡的重灾区：农牧业存货难以盘点、难以计价，既是虚增利润的安放处，又是消化套取采购资金的场所——存货越滚越大、与同行差异越来越明显后，企业必然想通过一次性计提存货跌价准备将虚假存货清洗干净，"扇贝跑了、小猪饿死了"就是这类怪事。
  商誉版本：商誉不摊销、只做减值测试（减值计提后不可转回），本质上是在鼓励"洗大澡"——年景不好亏损时对商誉来个巨额冲销，为未来期间盈利留足空间；商誉减值操作主观性较大，容易成为上市公司玩弄财务伎俩的背锅侠；高估值、高业绩承诺催化的商誉是"不良资产"，业绩承诺期一过利润下滑即爆雷减值。
thresholds:
  healthy: 资产减值损失极小、业绩波动平稳，经营稳健的概率较高；一个正常经营的企业，业绩一般不会出现"一年小赚、一年大亏"的波动规律。
  watch: 亏损年度资产减值猛增、业绩好转年度减值猛降甚至转回；一年小赚、一年大亏交替进行；商誉相对净资产过大，犹如头上悬着一把达摩克利斯之剑。
  danger: 当期净资产收益率大幅下跌、以后期间大幅反弹；连续2年亏损摘牌压力下的一次性巨亏（A股连续2年亏损*ST、第3年亏损暂停交易，公司有动机痛痛快快洗一次大澡）；业绩预告与年报"变脸"式巨亏、光天化日之下的"裸洗"。
fraud_signals:
  - 时机信号：经理层更换、公司本期已亏损、连续亏损面临*ST/暂停上市时，最容易出现洗大澡；公司重组、经营困难、自然灾害、会计制度和准则变化、人员/股东/会计师事务所变更也是常见契机，手段以计提资产减值准备和确认或有损失为主。
  - 手段偏好：企业多喜欢用折旧、摊销、计提准备之类手段；可洗的科目不限于应收账款，更多通过固定资产、长期股权投资、存货、商誉等实现。
  - 存货洗大澡双机制：一是将虚增的利润藏匿在存货中（农牧业存货审计难以盘点、难以审证，是最佳安放处）；二是将套取的采购资金通过增加"存货"而消化（很难发现，一旦发现往往是刑事案件，套取就变成盗取）——随着时间越来越长，存货规模会越来越"大"、与同行或自己过去的差异越来越明显，存货异常的财务信号就会凸现，企业必然想通过一次性计提存货跌价准备将虚假存货清洗干净，于是出现"扇贝跑了、小猪饿死了"这样的怪事。
  - 管理费用异动：管理费用增幅大于营业收入增幅，要高度注意是不是"洗大澡"了。
  - 巨额减值之问：只要是巨额计提，就要问一问"这些资产到底存在不存在？！"——巨额存货减值可能是在掩盖子虚乌有的存货（预付账款被转移体外后硬凑成存货）。
  - 数学把戏：-4000万-5000万=-9000万；洗大澡后变成-10000万+1000万=-9000万（或-12000万+3000万=-9000万）——亏损还是那些亏损，只是年份不是那些年份了，等式怎么变化就看管理层预留的盈利空间大小。
  - 减值转出制造盈利：原价1000万的固定资产（已提折旧200万）以600万出售本亏200万；若以前年度提取减值准备600万，就"盈"了400万——会计有时就是数字游戏。
  - 商誉版本：商誉不摊销、只做减值测试，本质上是在鼓励"洗大澡"——年景不好亏损时对商誉来个巨额冲销，为未来期间盈利留足空间；商誉减值计提后不可恢复。
  - 商誉减值的背锅侠属性：商誉减值的操作主观性较大，容易成为某些上市公司玩弄财务伎俩的背锅侠；并购业绩承诺机制推高对价——被并购方作出脱离实际的高业绩承诺，三年内完不成承诺商誉爆雷减值，为达承诺进行盈余管理甚至造假、承诺期后利润一路下滑最终同样商誉爆雷。
  - 再融资配合信号：某些上市公司平时将亏损藏得严严实实、虚增利润，并装模作样地发放股利，目的就是要符合增发条件、再融资圈钱；亏损终究藏不住，就集中在一个会计年度释放，"让我一次亏个够"，洗完后又开始了隐藏亏损虚增利润的循环。
  - 识别要领：任何不正常的巨额资产减值损失，都应查一查是否存在职务犯罪；对于异常的、大额的资产减值，都要警惕其背后财务造假的可能性。
cases:
  - company: 某乳业上市公司（2008年三聚氰胺事件，文中未点名）
    article: 250422582
    point: 上半年日子不错，下半年因三聚氰胺计提减值近3个亿，知道无力回天干脆洗大澡，该年度巨亏18个亿。
  - company: ST安彩
    article: 250422582
    point: 2009年净利润-10.76亿元，其中资产减值损失洗大澡5.56亿元；2010年净利润3260.95万元，其中还转回上年资产减值1008万元——为2010年盈利作准备。
  - company: 广州浪奇
    article: 249441699
    point: 为消化被实控人转移到体外的预付账款，2018、2019两年虚增存货合计20.38亿元，后谎称存货丢失，最终通过"洗大澡"对无法平掉的存货集中减值出清。
  - company: 獐子岛
    article: 249441699
    point: 造假利润藏进海产品存货（本该进利润表的成本计入存货），需要清空假存货时发个公告"扇贝又跑了"，虚增利润通过存货减值（非常损失）完成闭环，还可归为天灾。
  - company: 某上市公司（2012-2014年利润1873万、-2.83亿、1911万，文中未点名）
    article: 250422582
    point: 一年小赚一两千万、一年巨亏数亿元交替，且2012-2014年经营活动现金流量净额连续为负，典型的"洗大澡"技法做出来的报表。
  - company: ST金刚
    article: 167938617
    point: 2016-2018年净利润1.38亿、2.31亿、0.96亿；2020年1月预告2019年盈利6743.8万-9634万元，同年4月年报却巨亏51.97亿元（同比减少5493.97%），其中涉讼预计负债21.76亿、疫情影响钻石可变现净值存货跌价约10亿、应收款坏账减值10.30亿、固定资产及在建工程补充减值约8亿——"在光天化日之下裸洗"，2020年4月7日被证监会立案调查；上市9年累计利润不过10亿出头，"一夜亏回解放前"。
  - company: 嘉凯城
    article: 148557901
    point: 将收购明星时代影院产生的近3.5亿元商誉计提2.6亿元减值准备；减值测试显示对该影院未来现金流现值估计不足1亿元、除商誉外账面价值仅1190万元，而商誉高达3.49亿元——为账面价值的近30倍、超过现金流折现价值的3.5倍。
  - company: "*ST巴士"
    article: 147150160
    point: 2017、2018年连续两年亏损20.33亿元、6.4亿元，2019年剥离巴士科技后靠冲回前期因未决诉讼计提的“预计负债”扭亏，实现归属净利润5.2亿元而营业收入仅2127.4万元——净利润远超营业收入约5个亿，正是前两年“洗大澡”巨亏年度尽可能多计提预计负债、以后年度再冲回的结果（2020年一季度没了预计负债可冲，立刻由盈转亏）。
quotes:
  - "所谓“洗大澡”，一句话，就是把未来期间的费用挪到本年来确认"
  - "让我一次亏个够\"，来达成洗净财报的目的，以掩盖之前的财务造假等问题，洗完后，又开始了隐藏亏损虚增利润的循环"
  - "亏损基本上还是那些亏损，但年份就不是那些年份了"
  - "有的时候，会计就是数字游戏"
  - "资产是财富，有时却是负担，比如由于利润造假而形成的资产虚胖,这些虚胖实际上是隐藏在资产中的费用，处理不当，随时会引爆出财务丑闻，聪明的CFO一般会采用\"洗大澡\"方式，一洗了之"
  - "只要是巨额计提，就要问一问，这些资产到底存在不存在"
  - "反正利润造假后虚增的资产可以通过“资产减值准则”合法地洗掉，何乐而不为呢"
  - "谨慎性原则实际上是纵容企业管理层在缺乏原始凭证的情况下调节资产和利润数据，其结果必然是“合规造假”现象泛滥，经济监管被架空"
  - "资产有“水分”，利润就一定有“水分"
  - "看到这个业绩天翻地覆的“变脸”，你是不是要惊掉下巴！可以说，ST金刚“洗大澡”洗得太出格了，等于在光天化日之下裸洗，天下股民以及证监会，啥都看见了"
  - "我一直说利润不是东西，因为在现代会计制度下面，通过关联交易等手段，企业要做多少利润就可以做出多少利润，通过“洗大澡”等手段，企业要做多少亏损就可以做出多少亏损"
  - "经常通过做账方式调节利润以规避戴帽风险的企业，财务报表上也一定能够看得出来，比如那些一年小赚，一年大亏交替进行的企业，基本就是通过“洗大澡”方式做出来的。一个正常经营的企业，业绩一般不会出现这样的波动规律"
  - "假的终归是假的，随着时间越来越长，存货规模会越来越“大”，就会使得存货跟同行或者自己过去的差异越来越明显，存货异常的财务信号就会凸现出来"
  - "某些上市公司平时将亏损藏得严严实实，虚增利润，并装模装样地发放股利，目的就是要符合增发条件，再融资圈钱。但是亏损终究藏不住，于是就集中在一个会计年度释放"
  - "如果公允价值准则是魔术的话，那么对商誉的会计处理简直就是巫术"
  - "上市公司的商誉已成为套取资金的黑洞，比利用“在建工程”、“固定资产”等科目套取资金更为疯狂"
  - "我对商誉一直是不信任的，警惕的，商誉对比企业净资产过大的企业，犹如头上悬着一把达摩克利斯之剑，你不知道它什么时候掉下来"
  - "净利润远远超出营业收入约5个亿，是不是有点逆天了"
  - "只要公司有官司在身就有扭亏为盈的办法，在“大洗澡”巨亏年度可以想尽办法计提所谓的“预计负债”，以后年度想冲回多少，就大约计提多少（当然也少不了一些阴阳合同配合）"
