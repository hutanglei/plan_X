name: 现金循环周期（营运资金周转）
key: cash_cycle
category: 现金流质量
alias: [现金循环周期, 净运营资本天数, 营运资金周转天数, 现金周转期]
definition: 从支付原材料货款开始到最终收回本公司货款为止的时间过程——"如果说流动资金是一家公司的血液，那么现金循环周期则显示了血液流动的状态"，它决定一家企业资金的使用效率，最重要的是速度；过程为现金流出购买原材料，现金变为原材料及库存停留在企业内部，再变为销售的应收账款以及最终回款又变回现金。
formula: >-
  现金循环周期=存货周转天数+应收账款周转天数−应付账款周转天数。
  其中：存货周转天数=365÷[主营业务成本÷((存货期初余额+存货期末余额)/2)]；
  应收账款周转天数=365÷[销售收入÷((应收账款期初余额+应收账款期末余额)/2)]；
  应付账款周转天数=365÷[主营业务成本净额÷((应付账款期初余额+应付账款期末余额)/2)]。
  关联概念：营业周期=存货周转天数+应收账款周转天数，现金循环周期=营业周期−应付账款周转天数；两者区别在于开始时点不同——营业周期始于存货取得，现金循环周期始于现金流出（付款日），付款日和收款日之间的这段时间就是现金循环周期。
  占用上下游资金能力：综合口径=[(应付票据+应付账款+预收账款)−(应收票据+应收账款+预付账款)]÷营业收入，简化口径=(应付票据+应付账款+预收账款)÷营业收入；细分指标——应付款比率=平均应付款（应付票据+应付账款）余额÷营业成本（看占用上游资金状况），预收款比率=平均预收款余额÷营业收入（看占用下游资金状况）。
  营运资金需求量=上年度销售收入×(1−上年度销售利润率)×(1+预计销售收入年增长率)÷营运资金周转次数，其中营运资金周转次数=360÷(存货周转天数+应收账款周转天数−应付账款周转天数+预付账款周转天数−预收账款周转天数)（含预付、预收的扩展口径，同仁堂案例用法）。
  营运资金=流动资产−流动负债，现金循环周期的变化直接影响所需营运资金的数额；其过程与马克思货币资本循环G-W…P…W'-G'一致，起点和终点都是货币形式的资本，生产的目的或动机是赚钱。
majinghao_view: |
  存货周转期和应收账款周转期越短、应付账款周转期越长，即现金循环周期越短，所需营运资金越少；周期为负数的企业"一般很牛逼"——资金周转充满活力、库存很低甚至零库存，有息负债少、无息负债（预收账款、应付账款）多，达到了用供应商的资金做自己生意的境界，践行"用别人的钱赚钱"的盈利模式。
  周期短或为负的企业往往营运资金为负、流动比率数据很烂、资产负债率很高，如果你认为这家企业快要倒闭了，只能说明你是死读书的书呆子——它可能是一家超牛逼的公司，在用别人的钱做自己的生意。
  反之周期越长，所需营运资金越大，往往预示存货、应收账款上占用资金太多，预收账款、应付账款太少，营运资金管理非常失败——自己的钱被别人用来做生意了；营运资金占用高说明企业产品竞争力不够。
  他借海尔"零营运资本管理"说明管理资产负债表的重要意义：减少应收款的时间、加快库存周转期、延长应付款的时间，在收入和费用没有变化的情况下加速流动资金周转、提高变现能力，用钱来赚钱。
  企业的竞争优势主要体现在两个方面：一是比同行企业更能赚钱的高质量利润（同行中的"印钞机"）；二是对产业链上下游资金的占用——大量应付账款、预收账款（合同负债），只有小量甚至为0的预付账款、应收账款。
  无息负债（预收账款、应付票据和应付账款）主要是经营活动中自动形成的负债，通俗点就是通过欠产业链上下游的钱做自己的生意；有息负债成本一般至少6%、无息负债成本是0——总资产收益率回落低于6%时有息负债就是累赘，无息负债的公司在0%—6%区间照样毫无负担。产业链强势企业的资产负债率高并不可怕甚至是好事（"无息负债/总资产"数额大），没有利息吞噬利润的后顾之忧，可运用更高财务杠杆，按杜邦公式享有更高净资产收益率与更高估值。
thresholds:
  healthy: 现金循环周期为负数或很短——理论上说周期是零最好，不需要用自己的钱（至少流动资金）就可以赚钱；企业在不存在营运资金缺口的情况下，营运资金越小越好，为负数更好
  watch: 周期拉长（如存货周转天数明显回升）预示营运资金管理失败、周转动能在边际放缓；现金循环周期越长，需要的短期贷款越多，周期越短越不需要短期周转贷款（长期项目贷款与现金循环周期无关）；有息负债成本一般至少6%——总资产收益率回落低于6%时有息负债就是累赘，而靠占用上下游（无息负债）周转的公司在0%—6%区间毫无负担
  danger: 毛利率高的企业（理应对上下游有话语权）现金循环周期明显长于同行——基本上可以证明这家公司的毛利率不靠谱；应收账款、存货增速长期明显大于营收增速，可能虚增收入或虚增利润
fraud_signals:
  - 毛利率高的企业通常对上下游有话语权、现金循环周期应比同行短，如果明显长于同行，基本上可以证明其毛利率不靠谱——用周期反证毛利率造假
  - 应付账款巨大、现金循环周期为负的企业，要看应付账款的具体情况：产业链强势地位造成的是好事；如果是财务困难导致不守信用而累积起来的应付账款，就是坏事
  - 存货周转天数暴增（备货从"安全垫"异化为"风险敞口"）叠加预付款项激增，营运资本吞噬经营现金流，利润的应计成分放大
  - 现金循环周期为负但企业却需要不停贷款——要区分贷款性质：短期贷款与现金循环周期相关，长期项目贷款与现金循环周期无关
  - 占用上下游资金的比值是双刃剑：比值越大，对上下游话语权越强、占用资金越多，但也可能表明货币资金紧张、严重失信、拖欠货款；比值越小，产品可能是大路货、竞争力弱，但也可能是货币资金宽裕、商业道德高尚（货款两清）或应收账款管理不力——须排除恶意拖欠供应商货款的情况再下结论
  - 预收账款造假识别（四条）：①忽高忽低——拉长历史周期看预收账款与营业收入的比例应该是稳定的，大幅波动则造假可能性大；②与其他财务指标背离——毛利率、现金循环周期、存货周转率、应收账款周转率、主营业务收入增速、销售费用率等7个指标变动趋势应一致或至少稳定，严重背离要高度警惕（尤其预收账款增速要与毛利率、存货周转率、应收账款周转率同向）；③预收账款、存货双高——推迟确认收入可能性较大；④预收账款长期挂账——作为流动负债一般账龄在1年以内，若1年以上账龄占比很高则造假概率大
cases:
  - company: 恒生电子
    article: "173963206"
    point: 现金循环周期为−522.1天——表现出非常强的供应链话语权，经营中不仅不需要花自己的钱，还把上下游的钱拿来做短期投资（高交易性金融资产余额），用钱赚钱
  - company: 同仁堂
    article: "175571961"
    point: 营运资金需求量测算示例——2019年存货周转天数311.73天、应收账款周转天数54.25天、应付账款周转天数138.35天、预付账款周转天数13.18天、预收账款周转天数10.33天，营运资金周转次数=360÷230.48=1.56次；假设2020年营业收入增速5%，营运资金需求量=132.8×(1−11.76%)×(1+5%)÷1.56≈78.87亿元
  - company: 海光信息
    article: "406258402"
    point: 2025年现金循环周期（存货351天+应收79天−应付55天）约375天，较2023年的186天翻倍——"上游预付快付、下游赊销慢收"，为整条产业链提供免费融资，映射议价能力的结构性缺失；其验证指标为周期能否压回300天以内
  - company: 戴尔电脑
    article: "252456283"
    point: 财报公布的现金循环周期是负数——库存时间为零，而应付款时间远长于应收款时间，做生意不仅不需要钱，现金周转快到可以从中盈利的程度
  - company: 京东
    article: "252456283"
    point: 现金循环周期大部分时间都是负数——靠占用供应商资金做空手套白狼式的经营
  - company: 老干妈
    article: "252456283"
    point: 现金循环周期长期为负——凭强大品牌对下游经销商坚持"先款后货"竟无应收账款，对上游供应商"先货后款"以应付账款无偿占用供应商资金
  - company: 海尔
    article: "274472982"
    point: 张瑞敏称海尔的营运资金周转天数达到-10天，负得越多越好；行业里差的达到正三十天，需要很多营运资金才能周转，可能要到银行借贷
  - company: 超市（大卖场业态）
    article: "252456283"
    point: 现金循环周期一般为负（比如负25天）——依赖卖场资源在与供应商谈判中形成压倒性优势，靠占用供应商无息资金做生意，销售额越大手中现金越多
  - company: 泽璟制药
    article: "274472982"
    point: 2021年度向特定对象发行A股股票补充营运资金——业务规模扩大带来营运资金需求上升时，以股权融资补充营运资金可降低财务风险，属例外情形
quotes:
  - "如果说流动资金是一家公司的血液，那么现金循环周期则显示了血液流动的状态"
  - "现金循环周期＝存货周转天数＋应收账款周转天数－应付账款周转天数，它决定一家企业资金的使用效率。在这个过程中，最重要的是速度"
  - "理论上说，现金循环周期是零最好，这样就不需要用自己的钱，至少是流动资金就可以赚钱了"
  - "现金循环周期为负数的企业一般很牛逼，其资金周转充满活力，库存很低，甚至零库存"
  - "因为这家企业可能是一家超牛逼的公司，它在用别人的钱做自己的生意"
  - "如果它现金循环周期明显长，就基本上可以证明这家公司的毛利率不靠谱"
  - "企业在不存在营运资金缺口的情况下，营运资金越小越好，为负数更好"
  - "现金循环周期就是营业周期扣除应付账款周转天数之后的数额。现金循环周期＝营业周期－应付账款周转天数"
  - "我多欠别人的钱（大家抢着给我供原材料，我可以晚点给供应商货款，应付账款多一点），让经销商早点打钱订购产品（记为预收账款，越多越好），直接收现金不接受赊账防止有人欠账（少一点应收账款），尽可能少提前给别人钱（少一点预付账款"
  - "如果真有企业这么做到了，那么其现金循环周期一般为负数，体现了在产业链中的决定性的优势地位，完全可以依靠占用上下游资金来维持自身的运营周转"
  - "有一家名叫恒生电子的公司，它的现金循环周期为负522.1天，表现出了非常强的供应链话语权。这样，恒生电子在经营中不仅不需要花自己的钱，还把上下游的钱拿来做短期投资，用钱赚钱"
  - "无息负债主要是经营活动中自动形成的负债，说通俗点，无息负债主要就是通过欠产业链上下游的钱，做自己的生意"
  - "有息负债的成本，一般情况至少是6%。而无息负债的成本是0。因此，当公司的总资产收益率回落低于6%的时候，有息负债就是累赘"
  - "这是做生意，不是做慈善，因此，靠的是在产业链中的地位"
  - "分析一家企业占用上下游资金的能力，可用简化公式：占用上下游资金的能力＝(应付票据+应付账款+预收账款)/营业收入"
  - "该指标比值越大，表明企业对上下游话语权强，占用上下游企业的资金相对越多，企业的竞争力越强"
  - "预收账款是一个时点数，公司可以在资产负债表日与相关方合谋，请对方临时打入一笔款项作为预收账款处理，造成资产负债表日预收账款大幅上升的假象"
  - "如果某个年度预收账款偏低，则该公司可能提前确认收入"
source_articles: [274472982, 252456283, 406258402, 173963206, 175571961, 147045110]
