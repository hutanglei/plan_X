name: 净现比（净利润现金含量）
key: cash_to_profit
category: 现金流质量
alias: [净现比, 净利润现金含量, 净利润现金流比率, 现金利润比]
definition: 经营活动产生的现金流量净额除以归母净利润——企业每实现一元净利润实际流入多少现金；经营现金流量净额是经营成果"落袋为安"的那部分，可称之为企业的"现金利润"，反映最"真实"的盈利能力。
formula: >-
  净现比=经营活动产生的现金流量净额÷归母净利润×100%（分子用经营活动现金流量净额，分母用归母净利润）。
  马氏定律口径：从较长周期（10年）看，经营活动现金流量净额÷净利润应该大于1，看十年累计值而非单年。
  十年总和口径：十年经营活动现金流量净额总和÷十年净利润总和（片仔癀案例用法——十年总和净现比仅0.38）。
  关联口径：净利润的含金量=经营活动产生的现金流量净额+取得投资收益收到的现金−财务费用（+处置长期资产溢余现金），含金量指数=净利润的含金量÷净利润。
majinghao_view: |
  净现比是衡量一个企业"真实"盈利能力的核心指标，经营性现金流量净额是企业盈利的很好补充指标，比净利润指标还要重要——以收付实现制为基础编制的现金流量表，可以称为"利润的测谎仪"。
  资金回笼越高效的企业，净现比越接近1；考虑增值税以及预收账款等因素，净现比会出现大于1的情况，此类企业盈利质量很健康。净现比大于100%的公司，产品或服务往往供不应求、在行业内有较高地位，对上下游有强议价能力（对上游先货后款，对下游先款后货）。
  他2019年10月7日提出"马氏定律"：真实的利润应当伴随真实的现金流，虚增利润往往伴随虚增资产，而虚增的资产无法产生相应的现金流，从而导致净现比偏低——所以用十年区间的净现比可以判定利润造假。
  强调较长周期（10年）观察，短期数据可能受偶然因素影响；重资产行业因大量投资固定资产或存货，净现比可能长期低于1，不直接等同于造假，要结合行业综合判断。
  片仔癀式诊断次序：净现比长期偏低时，先排除净利润端大额"纸面"利润（投资收益等未收现项目），再用收现比定位收取端（收现比长期大于1则收取端无大问题），最后查支付端的存货与应付账款——"存货增速低的年份，净现比就高，存货增速高的年份，净现比较低"；若存货系原材料战略储备且周转天数未恶化，低净现比是经营模式问题而非造假。
thresholds:
  healthy: 净现比大于1为优秀（"大于1，利润全是真金白银"）；行业规律口径——净现比大于1.33时属于表现优秀，最低不能小于0.5，以十年为周期净利润和经营活动现金流量净额应大致相当；近五年净现比平均值一般至少＞80%，当然越大越好；十年区间来看应该大于1
  watch: 净现比70%以上合格，0.7到1之间为正常；较长周期（10年）净现比低于0.7，利润造假可能性很大，需警惕；一般情况下经营活动现金流增速要和利润增速大致相当、至少增速方向应当相同——连续两年净利正增长而经营现金流负增长（如片仔癀2018年净利+44.63% vs 现金流−9.55%、2019年净利+22.88% vs 现金流−243.62%）要深究背离原因
  danger: 净现比低于0.5可以判断其利润造假；十年累计净现比小于0.5的基本落在造假命中区；净利润为正、经营现金流为负（净现比为负数）最危险；经营性现金流量净额连续三年为负数——根本没有"造血"能力，选股时要放弃
fraud_signals:
  - 马氏定律的机理：虚增利润往往伴随着虚增资产（如应收账款、存货），这些虚增资产难以转化为真实现金流，导致净现比偏低
  - 净现比远小于1时，观察存货、在建工程、预付账款等科目——若大幅增加，说明虚增的利润可能放到这些科目里了
  - 净利润持续高于经营活动产生的现金流量净额，属于典型"纸面富贵"，经营活动在流失现金，公司只能依赖外部筹资补缺口，最终必然遭遇资金链断裂的厄运
  - 净利润的含金量指数低于30%，说明盈利质量很差，甚至根本不是什么盈利，而是利润造假
  - 对"境界三"以上的资金闭环体外循环造假，单年净现比可能失灵（"人家真的回款了嘛"），要看十年累计净现比，并回到常识：交易对手什么来头、注册资本多少、有没有干活的能力
  - 识别口诀："利润表繁花似锦，资产负债表虚胖臃肿，经营现金流常年失血，三者互相打架，必是财务造假"
  - 经营活动现金流量净额突然转负或大幅恶化时，检查"支付其他与经营活动有关的现金"里是否藏有大额定期存款（受限货币资金）——定期存款不作为现金及现金等价物列示会冲减经营现金流，属核算口径问题而非经营恶化（片仔癀2019年剔除24.71亿元定期存款影响后经营现金流净额9.67亿元、同比+58%，与净利润增速方向一致）；但剔除后净现比仍只有0.7，利润含金量低的问题并未摆脱
  - 净现比处于极低水平（如某上市公司2021年度净现比=经营现金流量净额1.352亿元÷净利润7.193亿元=0.188）——净利润中的非现金含量多半是虚增的应收账款、预付账款、在建工程以及无形资产，"这些东西跟利润一毛钱的关系都没有"
  - 现金流量表并非造不了假——通过开出银行承兑汇票支付、洗出资金进行体外循环等方式可以"搞定"现金流量表（虚增销售收入会牵扯应收账款和体外现金循环，需补合同、补成本单据、补现金流凭证以瞒过审计与监管），但"真实的现金是造不了假的"，当公司没有现金流支撑时，所有的财务造假问题都会暴露无遗
cases:
  - company: 寒武纪
    article: "404266285"
    point: 2026年中报净利润23.11亿、经营现金流净额仅3.11亿，净现比0.13，"账面上每赚1块钱，口袋里只进来1毛3"；但销售收现74.52亿、回款不差，出血点在采购端玩命囤货——"不是造假信号，而是一个'豪赌备货'的信号"
  - company: 海光信息
    article: "406258402"
    point: 净现比轨迹2021年182.81%→2022年-5.38%→2023年64.42%→2024年50.60%→2025年82.40%→2026H1 -23.77%，六年无一年触及100%印证线，账面利润始终未被现金完全验证；应收账款四年增长13.8倍远超营收5.2倍
  - company: 片仔癀
    article: "150168739"
    point: 2019年净利润同比+22.88%而经营活动现金流量净额同比−243.62%，2018年亦背离（净利+44.63% vs 现金流−9.55%）；十年经营活动现金流净额总和22.49亿元对净利润总和59.37亿元，十年总和净现比仅0.38；2019年现金流转负主因24.71亿元定期存款不作为现金等价物列示（受限货币资金18.46亿元计入"支付其他与经营活动有关的现金"），剔除后净额9.67亿元、同比+58%，但净现比0.7仍远小于1；根因是麝香、牛黄、蛇胆等原材料战略储备推高存货（2019年末存货20.91亿元中原材料13.22亿元、占63%）叠加对上游话语权不强（应付账款增速低于存货增速、无法抵消购货现金支出），所幸存货周转天数2014—2019年逐年下降、未恶化——净现比低是经营模式所致而非造假
  - company: 京东
    article: "255978540"
    point: 连续亏损十几年，正是由于大多数年份里经营性现金流量净额（"现金利润"）为正数，让投资者没有失去信心——经营现金流比利润更能反映真实盈利能力
  - company: 贵州茅台
    article: "255978540"
    point: 经营性现金流量净额常年高于净利润，正是还未实现销售收入的预收账款计入经营性现金流入的原因，净现比持续大于1
quotes:
  - "从较长周期来看（10年），经营活动现金流量净额/净利润（净现比）应该大于1。如果净现比低于0.7，则存在利润造假的可能性；如果低于0.5，则可以判断其利润造假"
  - "净现比是衡量一个企业“真实”盈利能力的核心指标"
  - "如果净现比远小于1，则说明公司经营现金流出比较大，此时可观察存货、在建工程、预付账款等科目，若这些科目大幅增加则说明虚增的利润可能放入到这些科目里了"
  - "商业的本质是实实在在的现金流，有什么样的原因可以长达数年收不到钱呢"
  - "如果一家企业的经营性现金流量净额连续三年为负数的，说明这家企业根本没有“造血”能力，选股时，要放弃"
  - "以收付实现制为基础编制的现金流量表，可以称为“利润的测谎仪"
  - "利润是观点，现金流才是事实"
  - "根据行业规律，净现比大于1.33时属于表现优秀，最低不能小于0.5"
  - "一般情况下，经营活动现金流增速要和利润增速大致相当，至少增速方向应当相同"
  - "片仔癀十年来每实现1元净利润，实际仅收到了0.38元现金，这个水平是非常低的，说明片仔癀的利润含金量非常低"
  - "总之，存货增速低的年份，净现比就高，存货增速高的年份，净现比较低"
  - "定期存款作为一项投资活动，应该放在投资活动现金流中核算更为恰当"
  - "现金流决定企业命运，如果把企业比作人，那么现金流就是血液，没有利润可以活，但是没有现金只有死"
  - "虽然现金流量表的数字也可以造假，但真实的现金是造不了假的。因此，当公司没有现金流支撑时，所有的财务造假问题都会暴露无遗"
