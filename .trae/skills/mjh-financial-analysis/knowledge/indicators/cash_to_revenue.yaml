name: 收现比（营业收入现金含量）
key: cash_to_revenue
category: 现金流质量
alias: [收现比, 营业收入现金含量, 营收含金量, 销售收现比]
definition: 销售商品和提供劳务收到的现金对营业收入的比率——在剔除应收账款带来的风险的情况下，从现金流入的角度反映销售收入的实际情况，检测营业收入里有多少是真金白银、多少是白条。
formula: >-
  营业收入现金含量=[销售商品、提供劳务收到的现金÷(1+增值税税率)]÷营业收入。
  注意口径：现金流量表中的"销售商品、提供劳务收到的现金"包含增值税，因此要除以(1+增值税税率)还原后再与营业收入对比；该指标大于1，说明营收收现比率高、营收含金量高。
  直接口径（含税粗比）：收现比=销售商品、提供劳务收到的现金÷营业收入，通常＞1才为优质企业。
  配套指标：应收账款÷营业收入，该比值越高说明收入含金量越低，但只适用于同行业之中做对比，不同行业差别很大。
majinghao_view: |
  收现比如果＞1，说明不仅当期收入全部收到现金，而且还收回以前期间的应收账款，盈利质量较好；如果小于1，说明当期有部分收入没有收现，盈利质量出现问题。
  账上利润越来越高、经营性现金流量净额却越来越差、应收账款越堆越高，坏账损失风险就越来越大，要是没有外部融资，很可能出现资金链断裂、企业破产——产品和服务不能带来现金流，外部融资也只是饮鸩止渴，关键是造血能力。
  他把收现比、净现比、分红融资比比作给企业"化验血液"的三项检测；并借海尔的话强调"没有现金流支持的利润就不算利润，没有利润支持的销售额就不算销售额"，单纯追求销售收入增长而带来巨额应收账款简直就是疯狂。
  收现比还是现金流病灶的定位指标：净现比低但收现比长期大于1，说明问题不在销售收取端而在支付端（存货、应付账款）；收现比跌破1时则要拆解归因——看应收票据与预收款项（合同负债）的此消彼长，判断对下游话语权是减弱还是渠道结构调整所致。
thresholds:
  healthy: 收现比＞1（通常＞1才为优质企业）；优质企业标准为销售商品、提供劳务收到的现金≥营业收入
  watch: 收现比长期小于1就要打问号；正常情况下销售商品提供劳务收到的现金应大于营业收入（含收回以前年度应收账款和预收账款）；历史上长期大于1的公司首次跌破1是重要预警（贵州茅台2020年一季度收现比0.9，为近年来首次小于1，上一次要追溯到2014年前后白酒行业危机时）
  danger: 收现比长期低于0.8，要么被拖欠大量货款，要么可能存在财务造假，都意味着很大的风险；收现比不能低于0.8，十年区间来看应该大于1；如某上市公司2021年度收现比约为0.775——实现一元收入实际收到0.775元现金，销售回款的质量较差
fraud_signals:
  - 应收账款增速高于营业收入的增速，同时存货余额居高不下——可能公司人为通过"应收账款"科目虚构营业收入
  - 应收账款、存货的增长速度在较长时期内明显大于营业收入的增长速度——应收账款的增长可能是通过虚构业务或关联方交易虚增收入；存货的高速增长可能源于少结转成本从而虚增利润
  - 假销售的典型手法：找一个托，做一笔"借：应收账款，贷：营业收入、应交税费-销项税额"的分录，要多少利润有多少利润，"空留下应收账款孤独地守望着，象个寡妇，最终坏账处理拉倒"
  - 应收账款连年超过营业收入的上市公司要高度关注——经营效率低、产品回款速度慢、缺少稀缺性和竞争性，靠宽松赊销政策拿客户信用风险博取利润
  - 产品获市场认可后应收账款占营业收入比例会降到20%以下（最好低于15%）；应收项目占营收比重低于10%，意味着超过90%是一手交货一手收钱
  - 对"境界三"以上的资金闭环体外循环造假，单年收现比可能失灵（钱真的以"销售回款"名义流回来了），要回到常识核查交易对手来头
  - 收现比跌破1要拆解归因：应收票据大幅增长与预收款项（合同负债）大幅下降共同作用导致收现比小于1——两者都指向对下游客户话语权减弱；但要区分主动让利（如疫情下减缓经销商预收货款收取、以银行承兑汇票给账期，长远有利于经销体系健康）与被动恶化（直销占比提高、经销商数量减少也会拉低预收款项），"销售情况是否真的恶化，还有待进一步观察"
  - 应收账款暴增直接拉低收现比：片仔癀2015年应收账款同比大增89.58%，当年收现比降至1.05，为十年最低
  - 收现比是定位现金流病灶的分流指标：净现比低但收现比长期大于1（片仔癀近十年收现比均大于1，每销售1元产品实际收到1元以上现金）——问题不在销售收取端而在支付端（存货、应付账款）
  - 应收票据背书导致收现比"失真"：会计制度规定应收票据不属于现金或现金等价物，将应收票据背书用于支付采购款不存在真实的现金收支、不能视同计入现金流入和流出；若企业货款结算大量采用票据、又以背书转让形式支付采购货款，将导致"销售商品、提供劳务收到的现金"小于营业收入，同时"购买商品、接受劳务支付的现金"小于营业成本——分析现金流量表时要注意这个问题，否则极可能把一家好企业误判为烂企业甚至造假企业
cases:
  - company: 贵州茅台
    article: "151914740"
    point: 2020年一季度销售商品、提供劳务收到的现金218.66亿元、同比−3.92%，收现比0.9，为近年来首次小于1（上一次为2014年前后白酒行业危机时）；原因一是应收票据大幅增长（2019年末14.63亿元、同比+159.52%；2020年一季度13.45亿元、同比+158.69%），二是预收款项（调整后合同负债77.09亿元）较2019年度的137.4亿元大幅减少（环比−43.89%、同比−32.29%）——预收减少与应收票据增加共同压低收现比，指向对下游话语权减弱；但可能是主动作为（减缓经销商预收款收取、以银行承兑汇票给账期）及直销占比提高（2019年直销渠道收入同比+65.65%、削减酱香系列酒经销商）所致——"得出'贵州茅台卖不动'的结论需要谨慎，但是可以考虑作为一个观察的方向"
  - company: 片仔癀
    article: "150168739"
    point: 近十年收现比均大于1（每销售1元产品实际收到1元以上现金），销售收取端不存在大问题——净现比低的病灶在支付端（存货增加+对上游话语权不强）；2015年应收账款同比大增89.58%导致收现比降至1.05，为十年最低
  - company: 海光信息
    article: "406258402"
    point: 2026H1收现比降至约95.5%，同期合同负债从30.91亿元骤降99.4%至1935.82万元——客户不再预付，收入从"求着买"变成"赊着卖"，收入的议价基础与确定性已经逆转
  - company: 寒武纪
    article: "404266285"
    point: 2026H1销售收现74.52亿元、同比增长85%，收现比不差，证明净现比0.13的症结在采购端囤货吞噬现金，而非收入确认造假
  - company: 以茅五洋沪为代表的白酒上市公司
    article: "267414411"
    point: 财务费用连续多年为负数，表明盈利能力强、净利润含金量高、现金流好，有钱存放在银行赚取利息
  - company: 海螺水泥
    article: "146020294"
    point: 2015-2019年收现比分别为1.27、1.24、1.23、1.28、1.25，即实现一元收入实际可收到约1.25元现金；同期净现比分别为1.30、1.47、1.06、1.18、1.19均大于1——销售商品提供劳务收到的现金/营收约等于1.13即属优秀，同行华新水泥为1.15，海螺不愧为水泥行业老大哥。
  - company: 汤臣倍健
    article: "144814522"
    point: 本期收现比1.16（一元收入实际收到现金1.16元），2016-2018年分别为1.17、1.14、1.17，各年均维持较高水平——按行业规律收现比大于1.13即属优秀，公司销售回款质量不错。
