name: 货币资金真实性（存贷双高）
key: cash_vs_debt
category: 偿债能力
alias: [存贷双高, 大存大贷, 有息负债现金覆盖率, 货币资金]
definition: 检验账上的"钱"是不是真钱、是不是自己的钱：一个财务稳健的公司，其货币资金应该能够覆盖有息负债；账上趴着巨额货币资金同时还要高额借款（存贷双高）本身违背基本财务逻辑——这家公司的钱，要么不是真的，要么不是自己的，要么已经还不上了。
formula: >-
  有息负债现金覆盖率＝货币资金÷有息负债（有息负债＝短期借款＋一年内到期的非流动负债＋长期借款＋应付债券＋长期应付款），该比率越小偿债风险越大；分子可放宽至"货币资金＋以公允价值计量且其变动计入当期损益的金融资产"。这是个刚性标准，可以和历史比较，但无须和同行比较。
  更严格口径：（准货币资金－限制性存款）÷有息负债总额＞1，其中准货币资金＝货币资金＋交易性金融资产＋结构性存款——受限金额对当期偿债没有实质意义。
  配套检验：货币资金收益率＝利息收入÷货币资金平均余额；融资成本＝利息费用÷有息负债平均余额。
majinghao_view: |
  货币资金是点得清楚的、完全可以通过银行函证核实的资产，但有些上市公司胆大包天敢在最可靠的资产上造假——现金数额可以造假，钱造不了假：康美、康得新、东旭光电账上常年显示百亿规模现金，却兑付不了几亿或十几亿到期债券，一点钞就露馅。
  造假者偏爱直接虚增货币资金的机理：虚增收入配虚增货币资金"直接对应、看起来更合理"——配应收账款则金额必须大幅增加、容易引起叽叽喳喳，配预付账款/存货/在建工程/固定资产则要先套出资金再以"购买"方式回流、太麻烦；所以宁愿伪造变造大额定期存单，只要搞定或成功骗过审计师就大功告成。
  爆雷前的三张面孔："存贷双高"、控股股东高比例质押、财务费用高企——单独出现一个尚可解释，三个同时出现就要高度警惕。
  判断货币资金真伪的关键是用利息收入倒推：货币资金的利息收入大致应对得上市场利率水平（年化1.5%—2%左右），账上常年趴着百亿现金而利息收入少得可怜，这笔"钱"的真实性就要打个大大的问号。
  指标是信号而不是定罪书：个别企业因集团架构、行业特性出现存贷双高也属正常——洽洽食品54.82亿货币资金与8.90亿短期借款并存，经拆解属季节性采购、资金分层管理与理财利差的合理财务策略而非造假，不能见信号就一刀切。
thresholds:
  healthy: 有息负债现金覆盖率大于1（对于资产负债率大于40%的公司，要看覆盖率是否大于1，大于就不存在偿债风险）；货币资金利息收入年化大致对得上市场利率1.5%—2%左右
  watch: 货币资金对短期债务的覆盖倍数骤降（神华从16.9倍骤降到1.5倍）；存贷双高但能用季节性、集团架构、利差策略解释
  danger: 存贷双高（账上大量货币资金同时借高息贷款）；货币资金收益率过低（康美徘徊0.8%附近、远低于七天通知存款利率）而融资成本高企（康美5%以上）；账上有钱却发生债务违约、发不出分红
fraud_signals:
  - 货币资金三大陷阱：一是虚增现金（方式简单粗暴，账面直接虚构，伪造变造大额定期存单）；二是隐瞒资金受限（现金是真实的但已作质押、无法自由支配）；三是"露个脸"资金（被安排在资产负债表日前汇入公司，编完表后就汇出消失）
  - “完美”现金流也要打问号：无银行借款、货币资金高企、经营现金净流量甚至比净利润还高——若富余现金流不是建立在预收账款大幅增加的基础上，而是应付账款大幅增加造成的，就要怀疑故意推迟支付应付款、人为让经营活动现金净流量变得"好看"，这是不可能持续的
  - 虚增货币资金的转移路径：通过伪造账户银行付款凭证、虚构付款行为，将虚构的货币资金转移至在建工程、最终虚增固定资产——转固后折旧年限较长、每期折旧费用少，对利润的影响远小于虚增收入造成的利润虚增（"假账真做"同理：销售收款和资金支付是真实的，资金最终流向体外公司，如万福生科）
  - 康美式造假特征全景：存贷双高＋控股股东质押率很高＋上市以来大肆增发融资＋对比净利润的经营性现金流质量不佳＋存货高企、存货周转率远低于同行——造假被查后甚至有"这些货币资金实际上是存货"的说法（货币资金不能计提减值，存货可以）
  - 货币资金收益率过低且无合理解释——货币资金大概率被占用或被造假；融资成本过高且无合理解释——同样大概率被占用或被造假（康美以5%以上融资成本借款347亿元而货币资金收益率仅0.8%左右）
  - 财务报表无甚漏洞却爆发现金流危机，且库存飙升、疯狂借贷、大股东大比例质押——基本上可以坐实财务造假
  - 坐拥巨额货币资金却仍欠着大笔货款不向供应商结款——令人生疑，得分析货币资金是不是造假了、是不是受限了
  - 留意先大额现金分红（说明现金多）再巨额融资（说明缺现金）的情况
  - 银行函证是审计识别货币资金舞弊的重中之重——从源头上向银行发询证函，获取存款等现金等价物证据
cases:
  - company: 康美药业
    article: "279440320"
    point: 伪造银行存单方式虚增货币资金（300多亿"说没就没了"），存贷双高（存款很大、有息负债也高）、控股股东质押率很高——子虚乌有的货币资金就是用来消化虚增的利润
  - company: 康得新
    article: "287386846"
    point: 100多亿货币资金虚增，2019年1月因无法兑付20.8亿元债券违约才被质疑暴露；账上约150亿元货币资金却兑付不了15亿元到期债券
  - company: 辅仁药业
    article: "287386846"
    point: 账上18亿货币资金却发不出几千万的分红（约6000多万元分红款）
  - company: 东旭光电
    article: "403374459"
    point: 账上逾180亿元货币资金，却让30亿元债券违约——钱在账上、债在门口、就是还不上
  - company: 巴安水务
    article: "264816590"
    point: 各类有息负债合计20.67亿元而货币资金仅6.57亿元，有息负债现金覆盖率仅31.8%——债务规模高、存在较大财务风险
  - company: 洽洽食品
    article: "331604926"
    point: 货币资金54.82亿＋交易性金融资产5.15亿与短期借款8.90亿并存，经深度解构属季节性采购、资金分层管理和理财利差的合理财务策略、非大股东占用或造假——反向案例：存贷并存不等于造假
  - company: 中国神华
    article: "408983763"
    point: 货币资金对短期债务的覆盖倍数从16.9倍骤降到1.5倍——以前掏的是历史存款，现在掏的是股权融资和借新还旧进来的新钱
  - company: 伊利股份
    article: "402982575"
    point: 超过380亿元资金锁定在长期大额存单里吃利差、短期借款膨胀至590.51亿元，"存贷双高、借新还旧"——借来的现金分红，本质上是在用债权人的钱给股东发福利
  - company: 万福生科
    article: "172530328"
    point: 马靖昊点名的"假账真做"典型——销售收款和资金支付是真实的，资金最终流向了体外公司
  - company: 片仔癀
    article: "144814823"
    point: 正面案例：2019年三季报货币资金41.82亿元、占流动资产60%、占总资产50%（公司资产一半都是现金），短期借款7.95亿元、无长期借款，财务费用-1384万元（利息收入大于利息支出），流动比率4.01、速动比率2.94、现金比率2.4——货币资金远超有息负债、偿债能力很强；但账上40多亿现金而投资活动现金流出不到4000万元，需关注资金使用效率与机会成本问题。
  - company: 舍得酒业
    article: "145358283"
    point: 2019年三季报账上13.82亿元货币资金却保有8.36亿元短期借款（同比+51.40%），存贷双高令人存疑——白酒企业盈利能力强、有息负债一般较少（水井坊、山西汾酒、五粮液有息负债均为0），怀疑资金被天洋控股集团占用或被限制用途。
  - company: 海螺水泥
    article: "146020294"
    point: 正面案例：2019年货币资金549.77亿元＋交易性金融资产167.83亿元、两者合计占总资产40.14%，有息负债率仅5.77%、资产负债率由2015年的30.13%持续降至20.39%，货币资金足以覆盖全部债务——现金比率由2015年的0.71持续增长到2019年的2.00。
quotes:
  - "现金数额可以造假，但钱可造不了假！前有康美药业，后有康得新，还有最新受到质疑的东旭光电。这三家公司共同的特点是：表面上财大气粗，账户上常年显示有百亿规模现金，可几亿或者十几亿到期的债券却对付不了"
  - "试问：康美药业为什么要用5%以上的融资成本借款347亿元，而收益率却只有0.8%左右，事出反常必有妖，康美药业那些子虚乌有的“货币资金”其实就是用来消化虚增的利润"
  - "一个稳健的、值得信任的公司，其货币资金应该能够覆盖有息负债"
  - "目前上市公司财报中的货币资金有三大陷阱，一是虚增现金，方式简单粗暴，直接在账面上虚构现金。二是隐瞒资金受限，也就是账面上的现金确实是真实的，但这些现金已经作了质押，无法自由支配。三是“露个脸”资金，这些资金被安排在资产负债表日前汇入公司“露个脸”，在编完表后，这些资金就汇出消失了，账上还是没有多少资金"
  - "钱在账上、债在门口、就是还不上——事出反常必有妖，这个“妖”多半就是资金被挪用、被掏空，或者从来就没有存在过"
  - "据我多年观察，财务危机爆雷的上市公司，往往在爆雷前很长时间就呈现出三个共性特征：“存贷双高”、控股股东高比例质押、财务费用高企。这三个信号单独出现一个，尚可解释；三个同时出现，就要高度警惕了"
  - "当然，指标是信号而不是定罪书，个别企业因集团架构、行业特性出现存贷双高也属正常"
  - "货币资金是点得清楚的，也是完全可以通过银行函证进行核实的。但是，有些上市公司确实胆大包天，人家就是敢于在钱上造假"
  - "虚增收入，还不如直接通过伪造、变造大额定期存单等方式，进行虚增货币资金。这样，只要搞定或成功骗过会计师事务所的审计师，就大功告成了"
  - "如果一家公司在坐拥巨额货币资金的同时，却仍然欠着大笔货款而不向供应商结款，这令人生疑，得分析下这些货币资金是不是造假了，是不是受限了"
  - "银行函证，对于审计识别货币资金舞弊行为至关重要。上市公司如果要财务造假，最常见的是在收入上造假，而这很有可能带来现金流造假，出现银行存款余额虚假记载的现象。因此，从源头上寻找证据，向银行发询证函，获取存款等现金等价物的证据，是审计的重中之重"
  - "虚增货币资金，虽然看起来比较容易露出破绽，但相对于其他会计科目，操作起来要容易多了"
  - "营业收入虚增，货币资金也随之虚增，直接对应，看起来更“合理”"
  - "普通企业是费用、成本最低化，怎么降低税负怎么做，它只会隐藏收入，决不会虚增收入；它只会虚增成本费用，决不会虚增利润"
