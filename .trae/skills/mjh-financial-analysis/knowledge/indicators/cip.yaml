name: 在建工程
key: cip
category: 资产质量
alias: [CIP, 延迟转固]
definition: 造假最好用的科目——由于处于在建状态、工程量较大、难以精准计量且事后审计不容易查证，对它的确认有可能随心所欲，更容易成为"垃圾桶"，什么都往里面装。
formula: 在建工程/总资产（与同行对比，远高于同行即危险）；结合投资活动现金流"购建固定资产、无形资产和其他长期资产所支付的现金"项目判断大额资本开支是否符合常识；转固判断标准是"达到预定可使用状态"（与竣工决算办没办完无关，未办决算应按估计价值暂估入账、照提折旧）。
majinghao_view: |
  在建工程和固定资产是当前上市公司财务造假的重灾区、最好用的科目：建厂房、买设备价格往往很高且难以定价，套取资金最安全的手法就是故意抬高价格，把高出来的那部分资金转移出去，一部分用于贪污，另一部分通过购买自身产品以做大利润的方式回流公司。
  在流动资产上做假会很累，时刻得想着弥补窟窿；在长期资产上做假，只要做假的当年蒙过去了，以后基本就没问题了——通过折旧、减值自然而然将"资产黑洞"化解于无形。
  延迟转固是典型的"费用资产化"：本该进损益的折旧和利息，披着"资产"的外衣继续躺在资产负债表上，虚增的资产就是穿着资产外衣的费用。
  在建工程是藏污纳垢的地方：在建工程或固定资产究竟值多少钱基本上说不清，迟迟不转为固定资产就可以少提折旧——关注在建工程转固的时间，可能是公司业绩爆发的前夜，也可能是噩梦的开始。
thresholds:
  healthy: 工程项目达到预定可使用状态即应转为固定资产并计提折旧；在建工程、固定资产与订单情况、产能情况相匹配。
  watch: 最近1-2年在建工程数字突然变大，同时利润表中的收入、利润数据也在逐步增加；在建工程、固定资产与订单、产能情况不匹配。
  danger: 在建工程/总资产远高于同行；在建工程连续多年保持很高数额而且不转化为固定资产；在建工程金额很大、净利润却很小（延迟转固冲动最强，一转固一折旧利润可能由盈转亏）；巨额固定资产及在建工程没有拿去抵押（上市公司一般都有融资冲动，资产可能是虚构的、经不起评估审计）。
fraud_signals:
  - 推迟在建工程转为固定资产：推迟计提折旧，减少当期费用、虚增当期利润；"没办决算"从来不是理由，只是借口。
  - 已停工的在建工程继续财务费用资本化：非正常中断连续超过3个月应暂停借款费用资本化，继续资本化就是少计费用虚增利润。
  - 通过在建工程套取资金：资金流出体外，再通过第三方以购买公司产品的方式流回，美化当期利润；或通过真实的工程承包公司签订价格较高的"阴阳合同"转移资金，一为掏空上市公司，二为配合虚构收入。
  - 把在建工程当"大杂烩"：将费用化支出任意资本化，八竿子打不着关系的成本费用也往"在建工程"里塞。
  - 虚增在建工程投资额形成"注水资产"（如投资10亿的项目实际只值1个亿），转固后通过折旧慢慢消化，用虚构或吹嘘"最新人工智能化技术"的在建工程让审计师查不清真实成本。
  - 资金转出路径识别：通过采购、预付款项、自建项目等名义将资金转移至体外，再借销售回款名义转回，导致存货、预付款项、在建工程、固定资产等科目金额同比大幅增加。
  - 在建工程余额猛增且超过固定资产余额：需密切关注转固时间——既可能是业绩爆发前夜，也可能是借在建工程的采购将资金转出、最终通过体外循环虚构利润，或将应予当期费用化的支出包装成在建工程成本，一方面虚增在建工程、另一方面虚增利润。
  - 固定资产周转天数逐年上升且远高于同行：如尔康制药净利润三年翻了近4倍，固定资产竟和营收为其6-8倍的恒瑞医药很接近，固定资产周转天数每年都在上升，2017年5月被爆出财务造假。
  - 造假利润靠折旧慢慢"消化"：虚构的收入、利润藏匿于在建工程，转固后按20年折旧，理论上每年多增加的折旧成本也就是造假利润的1/20，不会对业绩产生很大影响，造假者赌的就是蒙过当年就万事大吉。
cases:
  - company: 奇信股份
    article: "285811028"
    point: 2012-2019年连续8年财务造假（签订虚假或放大金额的工程合同、少计成本等，8年虚增利润逾26亿），从在建工程中洗出的资金回流企业时增加经营现金流量，同时形成巨大的"资产黑洞"。
  - company: 康美药业
    article: "277804390"
    point: 2018年财报分别调增固定资产11.89亿元、在建工程4.01亿元、投资性房地产20.15亿元，合计调增资产总额36.05亿元，虚增在建工程费用形成"注水资产"。
  - company: 天齐锂业
    article: "343158777"
    point: 马靖昊曾提前半年撰文提示"高额债务泰山压顶，在建工程迷雾重重的天齐锂业"，后该公司125亿贷款无法偿还。
  - company: 抚顺特钢
    article: "343158777"
    point: 通过虚增存货、减少生产成本、将部分虚增存货转入在建工程和固定资产等方式，累计虚增利润19.02亿元。
  - company: 鱼跃医疗
    article: "148790587"
    point: 2016年期末在建工程仅0.6亿元，不到三年2019年三季报猛增至7.96亿元、已超过固定资产余额6.75亿元，需密切关注在建工程转固的时间——既可能推迟转固少提折旧虚增利润，也可能借在建工程将资金转出体外循环虚构利润。
  - company: 尔康制药
    article: "231901798"
    point: 2013年净利润只有1.92亿元，2016年就变成7.5亿元、三年翻了近4倍，固定资产周转天数每年都在上升且远比同行医药公司高，固定资产竟和营收为其6-8倍的恒瑞医药很接近，2017年5月被爆出财务造假。
  - company: 万福生科
    article: "216258356"
    point: 一条龙造假教科书级的典范，其造假最天才之处在于教会了大家，要把现金流送到体外循环最好的方式是在建工程及相关的预付账款科目里。
  - company: 同仁堂
    article: "144814837"
    point: 本期在建工程15.80亿元、固定资产余额21.22亿元，在建工程为固定资产的74.45%且几乎没有新增（2018年三季度15.34亿元）；据2019年中报，中药加工基地、大兴、唐山中药提取和液体制剂等主要在建项目完工进度均已超95%，判断存在故意减少投入、推迟完工避免转固以减少折旧计提、美化利润的嫌疑，也进一步印证整体发展趋势放缓。
quotes:
  - "在建工程的妙处在于由于是在建状态，对它的确认有可能随心所欲而且不容易查证。某些上市公司会选择“在建工程”这个项目，将一些说不清楚流向的钱或者根本子虚乌有的钱一股脑地扔给在建工程，反正查证起来很困难。因此，在建工程更容易成为“垃圾桶”，什么都往里面装"
  - "在建工程和固定资产是当前上市公司财务造假的重灾区，如果一家公司在建工程、固定资产跟订单情况、产能情况不匹配，很可能就会有问题"
  - "机器早就转起来了，产品都卖了好几茬了——可账上，它还能叫“在建工程”吗"
  - "奇信股份的财务造假就是充分利用了该科目。它从在建工程中洗出的资金在回流企业时，增加经营活动的现金流量的同时，也形成了一个巨大的“资产黑洞"
  - "企业如果在流动资产上做假，会很累，时刻得想着如何去弥补以前的窟窿！如果一开始就在长期资产上做假，只要做假的当年蒙过去了，以后基本就没问题了"
  - "出来混，迟早要还的。折旧会迟到，但不会缺席"
  - "马靖昊：虽然相对于银行存款和存货，固定资产和在建工程等也是实打实的资产，看得见、摸得着，投入资金巨大，不过，却很难说得清，也就是说这个在建工程或者固定资产究竟值多少钱是基本上说不清的，自然就成了藏污纳垢的地方"
  - "鱼跃医疗2016年期末在建工程仅0.6亿元，不到三年功夫，2019年三季报在建工程余额猛增为7.96亿，而该公司固定资产余额为6.75亿，在建工程总额已经超过固定资产，需要密切关注在建工程转固的时间"
  - "案例：尔康制药2013年的净利润只有1.92亿，2016年就变成了7.5亿。三年翻了近4倍，同时，固定资产周转天数每年都在上升，而且远比同行医药公司高。另外，它的固定资产居然和恒瑞医药很接近，而恒瑞医药的营收是该公司营收的6-8倍。2017年5月，该公司被爆出财务造假"
  - "万福生科属于一条龙造假教科书级的典范。其造假最天才之处在于，教会了大家要把现金流送到体外循环最好的方式是在建工程及相关的预付账款科目里"
  - "可将其转化大致表达为：应收账款→银行存款→预付账款（其他应收款、存货）→在建工程（无形资产、长期股权投资）→固定资产"
  - "一般而言，在建工程和营收没有比例关系，企业将虚构的收入、利润藏匿在其中很难洞察，但总归有一天需要转到固定资产，众所周知，固定资产需要定期折旧，比如折旧年限为20年，理论上，每年多增加的折旧成本也就是造假利润的1/20，不会对公司业绩产生很大的影响"
