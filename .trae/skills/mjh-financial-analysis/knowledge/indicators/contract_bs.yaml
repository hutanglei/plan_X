name: 合同资产与合同负债（预收账款）
key: contract_bs
category: 资产质量
alias: [合同资产, 合同负债, 预收账款, 预收款项, 两头吃]
definition: 东西还没有卖，钱就到了自己兜里，这是预收账款（合同负债）；合同资产是企业已向客户转让商品、收款权还取决于时间流逝之外其他因素的对价权利——应收的款项不是干等着就能收，还需要干别的才可以收。
formula: 无统一计算公式。分析口径：合同资产确认不以款项收取为前提的是合同负债；合同负债确认不以款项收取为前提（可作"借：应收账款及应收票据，贷：合同负债"分录，预收账款不能）。竞争优势判别：（应付票据+应付账款+预收款项+合同负债）/（应收票据+应收账款+应收款项融资+合同资产+预付款项）大于1，说明公司可无偿占用供应商和经销商资金、具有"两头吃"的能力。真正资产负债率＝（负债总额－预收账款－合同负债）/（资产总额－商誉（如有）－长期待摊费用－递延所得税资产）。
majinghao_view: |
  合同资产与合同负债是新收入准则下对应收账款、预收账款的进一步增补：合同资产从应收账款兜里单独拎出来（从资产质量上讲，合同资产弱于应收账款）；合同负债大规模覆盖预收款项（很多上市公司把预收款项100%抢过来），合同负债不但在合同成立后核算已收对价，还能核算未实际到账但已拥有收取权利的预收款。
  区分预收账款与合同负债一句话：有没有签订合同——签了合同的属于合同负债，钱已到账但没签合同或与合同义务无关的属于预收账款。
  预收账款/合同负债是产业链强势的信号：它不需要用现金去偿还、只需要发出产品就行，是收入的前世今生；预收账款高多半是产品畅销、具有较强的竞争力，这类企业有息负债往往很少甚至为0、偿债压力其实很小；计算资产负债率时应从负债方剔除预收账款（合同负债）。
thresholds:
  healthy: （应付票据+应付账款+预收款项+合同负债）/（应收票据+应收账款+预付款项）大于1，公司具有"两头吃"的能力、行业地位高；资产负债率高但剔除预收账款/合同负债后远低于同行，是极其优秀的企业（大量无息占用下游客户资金）。
  watch: 合同负债/预收账款随收入增长同步扩大（下游愿意提前打款，议价能力还在）。
  danger: 资产负债率高企同时有息负债率同样高（资产负债率与资产有息负债率背离程度低），财务结构充满危机。
fraud_signals:
  - 合同资产质量弱于应收账款：其收款权取决于时间流逝之外的其他条件（如需交付B商品后才有权收A商品款），分析资产质量时要打折扣；合同资产激增提示回款条件恶化或收入确认激进。
  - 报表含税口径：财报里的应收账款和合同资产，数额都包含增值税在内，一笔合同资产或应收账款同时产生一笔主营业务收入和一笔应交税款。
  - 无息与有息负债要分清：合同负债、预收账款、应付账款等多半为经营性无息负债，可能是企业处于产业链优势地位所致；若企业资产负债率远高于同行但剔除预收账款后远低于同行，不是偿债风险而是竞争力强的表现。
  - 预收账款异常解读：预收账款是流动负债，但通常不需要以现金偿付、只需发出产品，某企业预收账款（合同负债）6200万元与1200万元短期借款相比鹤立鸡群，实际不存在偿债能力弱的问题。
  - 预收账款造假的四种方式：确认条件宽松（只要一笔银行流水、不需要实际货物流动即可确认，造假成本低）；属于时点数易操纵（资产负债表日与相关方合谋临时打入款项，制造预收账款大幅上升的假象）；通过预收账款推迟/提前确认收入（货款已收、货物已发却不按准则确认收入，挂账待收入不好的年份再释放，表现为预收账款、存货双高）；通过预收账款填塞销售渠道（要求下游经销商提前打款购货）。
  - 识别预收账款造假四法：拉长历史周期看预收账款与营业收入的比例是否忽高忽低、大幅波动；预收账款增速要与毛利率、存货周转率、应收账款周转率等指标的变动趋势交叉验证，严重背离即高度警惕；预收账款、存货双高提示推迟确认收入；预收账款中1年以上账龄占比很高则造假概率大。
  - 买方市场企业拥有大量预收账款大概率是假的：只有卖方市场企业与特种行业才会有大量预收账款。
  - 同一合同下的合同资产与合同负债未按净额列报、或错误地抵销应收账款与合同负债：证监会年报监管点名问题，总额列示会同时虚增资产和负债规模。
  - 适用新收入准则的预收款仍挂预收账款或递延收益科目：如玩家已充值未消耗的游戏币金额错误计入递延收益、未将因销售商品而预收的款项确认为合同负债，属于未恰当区分与确认预收款项。
  - 合同负债含税挂账：合同负债不应包括已收或应收的对价中包含的增值税部分，该部分增值税金额应作为待转销项税额列报，含税确认会虚增负债。
cases:
  - company: 万科
    article: "274157744"
    point: 年销售收入过6000亿的顶级房企预收账款才区区几个亿，因为预收房款放在合同负债科目，2018年底余额已超过5000亿元，预收账款科目仅含住宅销售以外业务的预收款。
  - company: 药明康德
    article: "274157744"
    point: 2018年初应收账款兜里23.80亿元中3.85亿元（约16.18%）单独拎出放进合同资产；预收款项兜里6.04亿元全部放进合同负债，预收款项科目自2018年起闲置为0。
  - company: 华北制药
    article: "274157744"
    point: 2018年初应收账款兜里余额12.00亿元，按新准则合同资产定义比对，没有一毛钱符合确认条件，合同资产余额为0元，直到2020年一直未确认任何合同资产。
  - company: 机器人
    article: "274157744"
    point: 2020年中报存货中有19亿变成合同资产——将原存货中建造合同形成的已完工未结算资产重分类至合同资产（基建类企业"已完工未结算"从存货改放合同资产）。
  - company: 中国神华
    article: "408983763"
    point: 2026年中报合同负债暴增95%至85亿，下游愿意提前打款，议价能力还在——在资产变重的同时释放的积极信号。
  - company: 格力电器
    article: "250652838"
    point: 负债率保持70%以上、大大超过电器行业40%~60%的合理水平，但大部分负债属于无息负债（占用上下游资金），是用别人的钱做自己的生意。
  - company: 中航电测
    article: "148975062"
    point: 2013年以来预收账款持续保持较高增速、毛利率持续提升，预收账款占营业收入比例均在10%以上，但收入增速始终在11%上下波动、远比预收账款增幅小，预收账款对收入基本不具备预测意义，可能存在造假的情况。
  - company: 中远海科
    article: "148975062"
    point: 2015年以来预收账款增速持续保持高速增长（均超50%）且占营业收入比例均在35%以上，但收入增速不温不火（2017、2018年仅5.69%、6.88%），存货增速与预收账款基本同步，存货周转天数从2015年的73.78天升至2019年的373.82天，可能存在通过预收账款和存货进行收入操纵。
  - company: 千山药机
    article: "264341180"
    point: 截止2019年3月31日资产负债率与资产有息负债率分别达到了176%和114%，意味着公司资不抵债、无以为继，当年4月25日后暂停上市，2020年9月16日被深圳证券交易所摘牌、正式告别A股。
  - company: 贵州茅台
    article: "168288365"
    point: 预收账款已成了茅台营收的"蓄水池"——大家都想早点拿到货，拚着命地往茅台酒厂打钱，预收账款金额会比较大，是反映企业未来销售趋势的重要指标。
