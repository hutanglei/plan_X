  - "存货周转天数逐期大幅攀升，2015年为73.78天，2019年则高达373.82天"
  - "一方面是预收账款持续高增长、毛利率持续提升，另一方面收入增速却平平淡淡，这种情况确实比较少见。因此，预收账款可能存在造假的情况"
