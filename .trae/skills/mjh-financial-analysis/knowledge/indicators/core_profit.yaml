name: 核心利润
key: core_profit
category: 盈利能力
alias: [经营利润, 核心利润率, 主营利润]
definition: 企业通过主营业务活动获得的、扣除一系列必要开支后的净收益——强调一个公司正常经营、正常核算下所产生的正常利润，是企业最主要、最稳定、最可持续的利润，是企业盈利能力的晴雨表。
formula: 核心利润=毛利-四费-税金及附加，展开为：核心利润=营业收入-营业成本-销售费用-管理费用-研发费用-财务费用（财务费用为负值即利息收入高于利息支出时不减）-税金及附加（《核心利润：企业盈利能力的晴雨表》口径）；更早口径为"三费"版：核心利润=营业收入-营业成本-营业税金及附加-销售费用-管理费用-财务费用=毛利-三费总和-营业税金及附加（《利润！！！》）。他强调不能直接拿营业利润-公允价值变动-投资收益来计算核心利润，因为营业利润包含项目较多，而毛利、三费和税金及附加是每个企业都有的。
majinghao_view: |
  核心利润揭示企业主营业务的基本盈利能力，是衡量企业可持续发展潜力的关键标尺；营业利润则用来反映主业经营和投资的综合获利能力——核心利润更专注主业，是评价企业核心业务竞争力的直接指标。
  健康企业的核心利润与营业利润之比应大于80%，说明利润大头来自主营业务而非偶然性的投资收益或营业外收入，成本控制、费用管理良好；核心利润高占比是企业稳健运营、可持续发展的基石，面对市场波动有足够缓冲空间。
  分析利润构成非常重要：要区分哪些利润是经常性的、哪些是偶然所得，可持续的利润是评价公司价值的基石；营业外收入再多，即使能让上市公司起死回生、扭亏为盈，也无法遮盖企业此时经营不善的事实。
thresholds:
  healthy: 核心利润/营业利润＞80%，利润结构才健康、企业才能可持续发展；核心利润率持续保持高位，意味着稳固的市场地位、高效的运营效率和良好的成本控制
  watch: 关注核心利润的变化趋势以判断企业未来成长的潜力和风险；关注公允价值变动收益、投资收益与营业利润之间是否呈互补性变化——当营业利润不佳时这两项往往较好、营业利润改善后又变得稀松平常，报表阅读者有充分理由对营业利润低迷时的公允价值变动收益、投资收益增长保持警惕
  danger: 核心利润占比低，利润主要靠投资收益、公允价值变动收益、资产减值损失转回及营业外收入净额撑起来；非经常性损益非常大的企业主营业务发展不健康、不务正业、主业后续发展堪忧
fraud_signals:
  - 利润额中大约有多少最终能转化为现金流？不能转化为现金流的利润所形成的"资产"（应收账款、存货、预付账款、在建工程、固定资产等几乎所有的资产项目）是不是以后会通过资产减值来化解——在较多情况下，资产减值损失就是以前年度不能转化为现金流的利润造成的
  - 公允价值变动收益与投资收益"补位"信号：营业利润低迷时这两项逆势增长，警惕其真实性——公允价值变动收益是炒股、炒楼没卖出的浮盈账面盈利，不稳定且非专业所长；卖掉长期股权投资或金融资产的投资收益不可持续
  - 营业收入真实性反推：经营利润（核心利润）的可持续性主要取决于营业收入、营业成本的真实性，营业收入应与企业的规模（流动资产、固定资产等）具有正向关系
  - 税收印证法：税交得越多说明企业经营得好，进一步印证盈利的真实性、造假风险反而小——农业板块是财务造假高发区，因为很多享受税收优惠、造假成本很低
  - 报表盈利但实际亏损的保壳手法：主业不盈利，通过非经常性收益等财务技巧使报表净利润为正以逃避ST特别处理——识别方法是看扣除非经常性损益后的经常性净利润是否真正扭亏
  - 虚增利润必虚增资产消化：利润表中记录了虚增的利润，必然要在资产负债表中通过虚增资产来消化——应收账款、存货、预付账款、在建工程、固定资产等都可能是载体，未呈现为现金的"利润"基本上不可能变现
  - 扣非净利润增长率分档检验（优质档）：投资者可取用企业最近三至五年的扣非净利润增长率判断企业的成长状况和发展能力——连续达到30%左右的增长水平，说明企业处于上升期，业务正在高速发展，获利丰厚，成长性优秀，具有投资价值；连续达到20%左右，说明企业业务稳定发展，能维持这个增速的企业也不失为一家好企业
  - 扣非净利润增长率分档检验（乏力档）：连续在10%以下，说明企业业务增长乏力；连续为0或者负，则说明其业务已经陷入困境——以扣非口径持续检验核心利润的成长质量，防止用非经常性收益美化增长曲线
cases:
  - company: 农业板块上市公司
    article: "274682382"
    point: 农业板块是财务造假高发区——很多公司享受税收优惠政策，造假成本很低，利润的真实性缺少税收的印证
quotes:
  - "核心利润强调一个公司正常经营、正常核算下所产生的正常利润"
  - "一般而言，一个健康的企业，其核心利润与营业利润的比例应当大于80"
  - "核心利润的高占比，是企业稳健运营、可持续发展的基石"
  - "如果说“核心利润”主要用来反映一家公司主业的盈利能力；那么“营业利润”就是用来反映一家公司主业经营和投资的综合获利能力"
  - "营业外收入本质上与企业的可持续发展没有丝毫关系，营业外收入再多，即使能够让上市公司起死回生、扭亏为盈，也无法遮盖企业此时经营不善的事实"
  - "在分析上市公司利润表时，脑壳里一定要问这样的一个问题，即它的利润额中大约有多少最终能转化为现金流，不能转化为现金流的利润所形成的“资产”是不是以后会通过资产减值来化解"
  - "利润分析的要点是公司获得的利润是不是由主营业务产生，是不是可持续性而非偶发，可持续的利润是评价公司价值的基石"
  - "经营利润是企业最基本的经营活动的成果，也是企业在一定时期内获得的利润中最主要、最稳定、最可持续的利润"
  - "扣非净利润也就是企业可持续的利润。一般来说，扣非净利润多，企业的经营效益就好；扣非净利润少，企业的经营效益就差"
  - "如果一家企业的扣非净利润增长率连续达到30%左右的增长水平，说明企业处于上升期，业务正在高速发展，获利丰厚，成长性优秀，具有投资价值"
  - "如果一家企业的扣非净利润增长率连续达到20%左右，说明企业业务稳定发展，能维持这个增速的企业也不失为一家好企业"
  - "如果一家企业的扣非净利润增长率连续在10%以下的，说明企业业务增长乏力"
  - "如果一家企业的扣非净利润增长率连续为0或者负，则说明其业务已经陷入困境"
