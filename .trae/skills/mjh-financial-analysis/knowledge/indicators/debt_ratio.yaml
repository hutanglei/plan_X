name: 资产负债率
key: debt_ratio
category: 偿债能力
alias: [负债率, 负债比重, 有形净值债务率]
definition: 总资产中有多少比例是靠负债形成的，是衡量企业财务状况的关键指标——但马靖昊认为它会"骗人"：必须拆开看无息负债和有息负债，欠产业链上下游的钱做自己的生意（预收账款、应付账款）是本事，要付利息的银行借款、债券才是真正的担子。
formula: >-
  一般口径：资产负债率＝负债÷总资产×100%。
  马靖昊修正口径（"真正的资产负债率"）：资产负债率＝（负债总额－预收账款）÷（资产总额－商誉（如有）－长期待摊费用－递延所得税资产），后来又把负债方扣除项补充为"预收账款、合同负债"——资产方剔除商誉、长期待摊费用、递延所得税资产等无任何变现能力的资本化"费用"，负债方剔除不需要用现金去偿还、只需要发出产品就OK的预收性质款项。分解式中的"总资产"也应调整为同一剔除后口径；或者两个口径都计算、然后进行对比，可能更能发现一些问题。
  分解式：负债÷总资产＝有息负债÷总资产（资产有息负债率）＋无息负债÷总资产（资产无息负债率）。
  有形净值债务率＝[负债总额÷（股东权益－无形资产净值）]×100%——在可用于偿还债务的净资产中扣除无形资产（计量缺乏可靠基础、不可能作为偿还债务的资源），指标越大财务风险越大、长期偿债能力越弱。
majinghao_view: |
  资产负债率不能单独用来衡量企业的债务风险，要结合资产有息负债率，还要综合考虑盈利能力和发展能力，尤其是赚取现金的能力——"同样是买房，同样是20％首付，资产负债率都是80％，一个低保户和一个白领的偿债风险能一样吗？"
  产业链强势企业的资产负债率高并不可怕甚至是好事：多半是无息负债占比大，能通过应付账款、预收账款占用上下游资金，用别人的钱做自己的生意；现金循环周转短甚至为负的企业资产负债率常超90%，照样活得很爽。
  资产负债率与资产有息负债率背离程度越大，财务风险越小、财务结构越健康；高资产负债率同时伴随高资产有息负债率（背离程度低），财务结构就充满危机。
  不能机械地认为负债率低就好、高就坏：负债率低可能是行业增长放缓下的收缩战略；预收账款很多的企业剔除预收后负债率远低于同行，反而是极其优秀的企业。
  有息负债与无息负债对利润的影响完全不同：前者通过财务费用减少利润，后者不直接减少利润——所以企业在降低负债率时应当重点减少有息负债、而不是无息负债，这对利润增长或扭亏为盈具有重大意义。
thresholds:
  healthy: 无统一绝对值标准、行业差异大（如电器行业负债率40%~60%算合理水平）；关键看与资产有息负债率的背离程度——背离越大越健康，资产有息负债率为0最优秀（靠无偿占用供应商和客户资金满足营运需要，账上还趴着巨额现金）
  watch: 有息负债超过总资产的六成，企业算比较激进，承受宏观环境、行业变化的能力较弱，遇到宏观或行业突变陷入困境的可能性较大
  danger: 高资产负债率＋高资产有息负债率双高（背离程度低），财务结构充满危机；千山药机资产负债率176%、资产有息负债率114%，资不抵债、暂停上市直至摘牌
fraud_signals:
  - 公允价值破坏资产负债率的客观真实性：经济高涨时公允价值计量的资产显著增值、降低资产负债率，刺激投融资加速增长直至失衡爆裂；危机阶段资产价格下跌又提升资产负债率，反过来加快资产下跌
  - 选股时可将资产有息负债率高的上市公司排除掉——要支付的利息费用超过净利润的公司"都烂得很"
  - 留意先大额现金分红（说明现金多）再巨额融资（说明缺现金）的情况
  - 分析是否存在表外负债：或有负债、刻意隐瞒的负债、ABS、永续债等创新融资方式相关负债
cases:
  - company: 格力电器
    article: "250652838"
    point: 负债率保持70%以上、大大超过电器行业40%~60%的合理水平，但金融负债很少、大部分是无息负债（占用上下游资金）——用别人的钱做自己的生意，高负债率并不可怕
  - company: 朗姿股份
    article: "250652838"
    point: 资产负债率只有8.11%，却是行业不景气、业绩增长不佳下采取收缩战略的结果——负债率低不一定是好事
  - company: 千山药机
    article: "250652838"
    point: 截至2019年3月31日资产负债率与资产有息负债率分别达176%和114%，资不抵债，当年4月暂停上市、2020年9月16日被深交所摘牌
  - company: 中国神华
    article: "408983763"
    point: 资产负债率从年初31.1%（重述口径）抬到40.27%——并购把资产从6,200亿做到9,200亿的同时，把财务容错空间做小了
quotes:
  - "如果一家企业在产业链中处于强势地位，其资产负债率高并不可怕，甚至是好事，因为多半是“无息负债/总资产”的数额较大，这说明该企业能够通过“应付账款”、“预收账款”占用上下游的资金"
  - "如果一家的资产负债率远远高于同行，粗看起来，这是一家偿债压力比较大的企业。但如果剔除掉预收账款后，它的资产负债率却远远低于同行，这其实是一家极其优秀的企业"
  - "衡量一个企业的债务风险不能单看资产负债率，而是要综合考虑它的盈利能力和发展能力，尤其是赚取现金的能力。打个比喻，同样是买房，同样是20％首付，资产负债率都是80％，一个低保户和一个白领的偿债风险能一样吗"
  - "不能盲目地将资产负债率高一概归为坏事情，比如格力电器近年来的负债率都保持在70%以上，这已大大超过了电器行业负债率40%~60%的合理水平。但该公司的金融负债其实很少，公司大部分负债属于无息负债，也即属于占用上下游环节资金，其实是用别人的钱，做自己的生意"
  - "做账不可发散，但财务分析一定要发散，甚至要放飞思维"
  - "在财务分析的运用中，可以说，资产有息负债率比资产负债率更管用"
  - "一般情况下，资产负债率、资产有息负债率两者背离程度越大，企业的财务风险越小，其财务结构越健康稳健"
  - "现金循环周转短，甚至为负数的企业，其资产负债率往往会很高的，常常超过90%，我们能够由此判断此类企业的偿债能力出现问题了吗？财务分析是不能这么机械的，不然，就要犯下常识性错误。此类企业往往在行业中处于强势地位，可以占用上、下游资金做生意，其实活得很爽"
  - "财务分析真没有固定的套路，你想怎么分析就怎么分析，就想怎么比就怎么比，只要能够发现问题就OK"
