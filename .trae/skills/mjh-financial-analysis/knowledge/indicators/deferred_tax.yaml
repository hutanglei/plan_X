---
name: 递延所得税
key: deferred_tax
category: 资产质量
alias:
- 递延所得税资产
- 递延所得税负债
- 资产负债表债务法
- 所得税费用
- 应付税款法
definition: 递延所得税资产和递延所得税负债好比“应交税费-应交所得税”的替身——税务说可以少交30万，就用递延所得税负债充当替身从应交税费中抵减；税务说要多交30万，就用递延所得税资产充当替身让应交税费增加，不管多交少交，会计上的所得税费用都是100万。
formula: 所得税费用＝应交所得税＋递延所得税负债－递延所得税资产；“所得税费用”小于“应交税费-应交所得税”就是递延所得税资产，“所得税费用”大于“应交税费-应交所得税”就是递延所得税负债。准则完整公式链（早期文新增）：应交所得税＝应纳税所得额×税率；应纳税所得额＝税前会计利润±纳税调整增加（减少）额；所得税费用＝当期应交所得税＋递延所得税；递延所得税＝当期递延所得税负债的增加＋当期递延所得税资产的减少－当期递延所得税负债的减少－当期递延所得税资产的增加。替身分录示例：应交税费为100万元、税务说可少交30万元——借：所得税费用100，贷：应交税费－应交所得税70、递延所得税负债30；税务说要多交30万元——借：所得税费用100、递延所得税资产30，贷：应交税费－应交所得税130——不管多交少交，会计上的所得税费用都是100万元；出现的递延所得税费用就是所谓的递延所得税资产，出现的递延所得税收益就是所谓的递延所得税负债。分析偿债能力时：资产负债率＝负债总额/（资产总额－长期待摊费用－递延所得税资产），递延所得税资产无任何变现能力，应从资产方剔除。
majinghao_view: |
  递延所得税是会计人与税法“叫劲”的产物：税务管“应交税费”科目（权大），会计坚持自己计算的“所得税费用”，两边差额只好由递延所得税“兄弟”替补平衡——资产负债表债务法表现出会计人的纠结，交税时不敢不听税务的，做账时坚决不同意将所得税费用调整得与应交税费一致。
  他旗帜鲜明地批判递延所得税是“披着资产外衣”的生造概念：在纳税影响会计法下记载的递延所得税资产、递延所得税负债都是查无实据的预期信息，缺乏法律事实、缺乏原始凭证——“递延所得税资产”不是资产，“递延所得税负债”不是负债，“递延所得税费用”不是费用，一旦列入会计报表，势必影响会计报表的公信力。
  他倡导税务处理上采用应付税款法（所得税费用与应交税费完全一致），不提倡资产负债表债务法；递延所得税负债余额相当于占用税务局的钱（短期减少现金流流出、相当于一笔融资），递延所得税资产余额相当于向税局多交了税（资金被占用），但这些都是人为虚幻出来的。
  早期文对“人为虚幻”的两点展开：现实中税务局不会让你占用它的钱；现实中向税务局多交了税就多交了，以后的抵扣只是人为计算出来的——真是自己将自己整复杂了。给两个科目的注脚：递延所得税资产——好人终有好报吗？就怕你等不到那一天；递延所得税负债——出来混的，迟早要还的。
thresholds:
  healthy: 原文未给出量化标准；其分析建议为：递延所得税资产在总资产中占比极小、无需特殊处理，资产负债率分析剔除后变化不大。
  watch: 亏损企业确认大额递延所得税资产（依赖“预期有足额应纳税所得额可弥补亏损并经税局认可”这一预期判断）。
  danger: 递延所得税资产导致净利润大于利润总额（所得税费用为负数）；递延所得税资产余额巨大但无变现能力，虚增了可偿债资产。
fraud_signals:
- 净利润大于利润总额的异象：企业亏损时，若预期有足额应纳税所得额可弥补亏损并经税局认可，可确认递延所得税资产并减少所得税费用，所得税费用可能为负数，净利润自然大于利润总额——利润数字被“预期”撑大。
- 预期信息无凭据：递延所得税资产、负债是生造出来的预期概念，查无实据、缺乏法律事实和原始凭证，为管理层主观判断预留了空间。
- 偿债能力虚增：递延所得税资产无任何变现能力，计算资产负债率时不剔除会低估真实负债水平；他给出的真口径为资产负债率＝（负债总额－预收账款）/（资产总额－商誉（如有）－长期待摊费用－递延所得税资产）。
cases:
- company: 理邦仪器
  article: '144742796'
  point: 2015-2018年所得税费用连续为负（-12.27万、-147.7万、-62.51万、-86.72万），但同期利润总额均为正——主因是研发费用加计扣除（2018年研发投入1.8亿元，按75%加计扣除1.34亿元后，税法意义上利润总额8535万元转为亏损）；需警惕借"做大研发费用"套取加计扣除，既少交税、又增加净利润，还掩盖主业盈利能力不强（毛利率低于行业平均、净利率8.68%远低于同行，研发人员占比31.13%远超同行却无对应产出）
- company: 五粮液
  article: 26101386
  point: 2013年中报“递延所得税资产-应付职工薪酬”5.85亿元，按25%税率倒推累计多计提约23.4亿元职工薪酬，构成未来可释放23.4亿元净利润的“利润储备”（《将利润埋在负债里》案例）。
quotes:
- 所谓“递延所得税资产”和“递延所得税负债”好比“应交税费-应交所得税”的替身
- 所得税费用”小于“应交税费--应交所得税”就是递延所得税资产，“所得税费用”大于“应交税费--应交所得税”就是递延所得税负债
- 在纳税影响会计法下所记载的递延所得税资产、递延所得税负债都是查无实据的预期信息，缺乏法律事实，缺乏原始凭证。“递延所得税资产”不是资产，“递延所得税负债”不是负债，“递延所得税费用”不是费用，它们一旦列入会计报表，势必影响会计报表的公信力
- 正是由于有递延所得税资产项目，净利润有时会出现大于利润总额的情况
- 企业递延所得税负债项目如有余额，相当于占用税务局的钱，这会在短期内减少公司现金流的流出，相当于一笔融资，对企业有利；企业递延所得税资产项目如有余额，相当于当期向税局多交了税
- 我一直倡导在税务处理上采用应付税款法，不提倡采用资产负债表债务法
- 目前的“所得税会计”，所推行的资产负债表债务法实质上是放任会计准则与税法的分离，从而使报表的编制完全遵从准则而不受税法的制约。这个出发点本身就错了
- 递延所得税资产：好人终有好报吗？就怕你等不到那一天；递延所得税负债：出来混的，迟早要还的
- 其实这些都是准则制定者们人为虚幻出来的！第一，在现实中，税务局怎么会让你占用它的钱呢？第二，在现实中，你向税务局多交了税就多交了税，以后的抵扣只是你人为去计算出来的
- 真是自己将自己整复杂了
- 出现的递延所得税费用就是所谓的递延所得税资产，出现递延所得税收益就是所谓的递延所得税负债
- 一般而言，所得税费用是负数，那么企业应该是亏损的
- 事出反常必有妖
- 会计上有两个“和事佬”科目，它们是“递延所得税资产”和“递延所得税负债”。
- 只要公司未来实际支付该部分薪酬时不再提前计提或减少了计提，即可减少企业当期的成本费用，达到释放利润的效果，由于其对应的所得税已经提前支付，所释放的将是净利润。
- 这些就是传说中所谓的利润储备，为公司未来根据行业预期发生变化而调剂利润留下操作空间，以增加公司利润的稳定性。
