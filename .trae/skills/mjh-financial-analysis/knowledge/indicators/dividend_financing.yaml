name: 分红融资比
key: dividend_financing
category: 现金流质量
alias: [分红融资比, 累积分红与融资对比, 派息率, 股息支付率视角]
definition: 公司上市以来历史累积分红与融资金额的对比——看一家公司能否持续创造盈利和现金、对股东是慷慨还是铁公鸡；更进一步要检验分红的钱是经营挣来的，还是借款滚动出来的。
formula: >-
  分红融资比=上市以来累积分红金额÷上市以来融资金额（历史累计口径）。
  分红真实性检验视角：对照资产负债表和现金流量表，看分红付息的现金是经营赚来的还是"取得借款—偿还债务"滚动出来的新钱；高分红率的加分前提是分红的钱必须是挣来的，不是借来的（而非靠股权融资、借新还旧输血）。
majinghao_view: |
  根据公司在上市以来历史累积分红和融资金额的对比，可以看出一家公司能否持续创造盈利和现金，对股东是不是慷慨，是不是铁公鸡——像贵州茅台、长江电力、吉比特等上市公司，既创造了盈利更创造了现金，这个指标就非常耀眼。
  他强调分红要靠真金白银背书："利润是观点，现金才是事实；借来的现金分红，本质上是在用债权人的钱给股东发福利。"
  判断一家公司的分红质量，标准应从"股息率有多高"升级为"分红的钱是不是借来的"——别光盯着利润表流口水，要看看它的资产负债表扎不扎实、现金流量表的日子过得稳不稳；靓丽利润表的成果，应转化为资产负债表的修复，而不是转化为更高比例的分红。
  分红融资比与收现比、净现比并列为给企业"化验血液"的三项检测——对于利润呈现长期增长的上市公司，用现金流检测成色：一看经营活动现金流量净额是否长期为正；二看收现比是否长期大于1、净现比是否长期大于0.8；三看收现比长期低于0.8或净现比长期低于0.5的风险信号。据研究，80%以上公司经营失败都可以归因于现金管理不当——现金流决定企业命运，"没有利润可以活，但是没有现金只有死"。
thresholds:
  healthy: 历史累积分红远超累计融资，且分红由持续创造的盈利和现金支撑（贵州茅台、长江电力、吉比特、海天味业式的现金牛）；分红的钱必须是挣来的，不是借来的
  watch: 分红率承诺很高（如伊利承诺2025—2027年分红率不低于75%、每股分红不低于1.22元"双兜底"），但财务结构"金融化"——短期借款膨胀、巨额资金锁在长期大额存单吃利差、"存贷双高、借新还旧"——分红付息可能是"借"出来的，要存疑
  danger: 借新债维持的大额分红付息——用债权人的钱给股东发福利；公司需要不停向市场要钱而经营自己生不出钱，是造假和崩盘的共同逃生信号
fraud_signals:
  - 短期借款连年膨胀至数百亿、长期借款只剩零头、流动负债占比畸高，同时超过数百亿资金锁定在长期大额存单里吃利差——"存贷双高、借新还旧"结构下，当年分红付息的钱有多少是"借"出来的要打问号
  - 债务滚动规模（单年取得借款+偿还债务合计）逼近甚至超过营收两倍——分红依附于债务滚动而非经营造血
  - 分红的钱来自筹资活动流入（股权融资、借新还旧）而非经营活动创造的现金——分红可持续性存疑
  - 检验方法：结合三张表同看——利润表好看的同时，看资产负债表是否扎实（速动比率、短期借款规模）、现金流量表日子是否过得稳（经营现金流能否覆盖分红付息）
  - 现金流量表并非造不了假——通过开出银行承兑汇票支付、洗出资金进行体外循环等方式可以"搞定"现金流量表（虚增销售收入会牵扯应收账款和体外现金循环，需补合同、补成本单据、补现金流凭证以瞒过审计与监管，且搞掂现金流量表比搞掂资产负债表和利润表麻烦多了）；但"真实的现金是造不了假的"，当公司没有现金流支撑时，所有的财务造假问题都会暴露无遗
cases:
  - company: 伊利
    article: "402982575"
    point: 年赚115亿、承诺2025—2027年分红率不低于75%，但短期借款从2021年125.96亿膨胀至2026年一季度末590.51亿、超380亿锁在大额存单吃利差、2025年取得借款2344.71亿偿还债务2355.60亿——"2025年那120亿元的分红付息，有多少是'借'出来的？"，判断标准应从"股息率有多高"升级为"分红的钱是不是借来的"
  - company: 贵州茅台
    article: "270120691"
    point: 既创造了盈利更创造了现金，分红融资比这个指标非常耀眼；经营现金流净额常年高于净利润，历史累计分红数非常可观
  - company: 长江电力
    article: "270120691"
    point: 与贵州茅台、吉比特并列——既创造了盈利更创造了现金的现金牛，累积分红对融资的比值耀眼
  - company: 海天味业
    article: "267414411"
    point: 现金牛，历史累计分红数非常可观，印证其持续创造盈利和现金的能力
