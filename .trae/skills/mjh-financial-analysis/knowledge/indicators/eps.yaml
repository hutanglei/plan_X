name: 每股收益
key: eps
category: 盈利能力
alias: [EPS, 每股盈余, 基本每股收益, 稀释每股收益]
definition: 每一股股票分到的公司盈余——蛋糕（净利润）除以切蛋糕的刀（股数），EPS越高代表公司的实际盈利能力越强。
formula: EPS=盈余/流通在外股数；基本每股收益仅考虑当期实际发行在外的普通股股份，稀释每股收益要考虑稀释性潜在普通股的影响（假设当期转换为普通股会减少每股收益的潜在普通股）；与ROE的关系：ROE=每股收益(E)/每股净资产(A)。
majinghao_view: |
  EPS数值通常是越高越好的，也不存在上限，它代表公司的实际盈利能力；运用时要结合行业平均业绩——个股业绩比行业平均高出两倍以上且股价不高的绝对值得买入，高出不多的再等等，低于行业平均的就没啥投资价值。
  他最看重的视角是"股本扩张摊薄"：只看归母净利润增长会被外延并购"做大蛋糕"的表象迷惑，必须盯着EPS——蛋糕做大了多少、切蛋糕的刀多了多少，两相比较才知道每股股东真正分到多少；这是外延并购的铁律：并表当季总资产、营收立刻做大，但ROE和每股收益要等协同效应慢慢熬，熬出来之前叫摊薄，熬出来之后才叫重组成功。
  股本增加（送股、增发）会让每股股票所代表的企业实际价值（每股净资产）减少，这就是除权的财务本质。
thresholds:
  healthy: EPS与归母净利润增速同步（股本稳定或扩张被盈利增长覆盖）；个股业绩比行业平均高出两倍以上且股价不高，绝对值得买入
  watch: EPS增速低于归母净利润增速——差额部分被股本扩张吃掉，需查明增发/送股的用途与并购资产的挣钱效率（神华2026中报：归母净利润+4.10%，基本每股收益只+2.8%，差出来的1.3个百分点被大了9.2%的股本摊薄）
  danger: 靠增发不断扩股本、并购资产挣钱效率不如存量老资产（ROE和EPS双双被拖低）——熬不出协同效应的重组只是持续摊薄；EPS低于行业平均没啥投资价值
fraud_signals:
  - 归母净利润增速与EPS增速的背离是股本扩张的照妖镜：蛋糕增速低于刀的增速，每股股东权益被稀释——判断并购重组是"摊薄"还是"重组成功"，就看协同效应能否熬出来
  - 稀释每股收益计算差错（据其转载的证监会2024年报监管报告）：部分上市公司披露的稀释每股收益高于基本每股收益，不符合会计准则——如果潜在普通股转换为普通股将增加每股收益或降低每股亏损，则其不具有稀释性而是反稀释性，计算稀释每股收益时不应予以考虑
  - 送股/配股除权的本质：股本增加使每股净资产减少——警惕靠扩大分母"降低"估值指标（如每股净资产、每股收益）制造便宜假象
  - 戴维斯双杀预警：业绩下滑时每股收益（EPS）减少或下降、市场给予的估值（PE）也下降，股价得到相乘倍数的下跌——每股盈利0.3元的下跌就可以让股价差点腰斩，高市盈率的股票必须要小心再小心
  - 市梦率泡沫识别：市盈率大于77就该称为市梦率，投资者要超过77年的时间才能回本——市梦率都是炒上去的，EPS完全无法支撑股价时应尽量避开，否则梦醒时分只有抱着它流泪到天明
  - 估值区间被动恶化：市盈率0-13代表价值被低估、14-20代表正常水平、21-28代表被高估、28+代表出现投机性泡沫——EPS作为市盈率分母持续下滑时，会被动推高市盈率，把股票从正常区间推入泡沫区间
  - 盈利质量与股本扩张双重恶化监控：EPS增速低于归母净利润增速时，要进一步检查净利率与ROE是否同步下滑——两者同时恶化（如中国神华2026年中报净利率21.45%降到18.76%、加权ROE从6.0%滑到5.83%），说明并购进来的资产挣钱效率暂时还不如存量老资产
  - 行业对标检验：运用EPS要结合行业平均业绩——个股业绩比行业平均高出两倍以上且股价不高的绝对值得买入，高出不多的再等等，低于行业平均的就没啥投资价值
cases:
  - company: 中国神华
    article: "408983763"
    point: 2026年上半年归母净利润增长4.10%，基本每股收益只增长2.8%——为收购集团12家公司增发新股，股本从198.69亿股扩到216.89亿股（+9.2%），"蛋糕做大了4.1%，切蛋糕的刀多了9.2%，分到每股上自然薄了"；同时净利率从21.45%降到18.76%、加权ROE从6.0%滑到5.83%，并购进来的资产挣钱效率暂时还不如存量老资产
quotes:
  - "但请盯着每股收益：蛋糕大了4.1%，到每股只剩2.8"
  - "差出来的1.3个百分点去哪了？被股本吃掉了"
  - "蛋糕做大了4.1%，切蛋糕的刀多了9.2%，分到每股上自然薄了"
  - "这是外延并购的铁律：并表当季，总资产、营收立刻做大；但ROE和每股收益，要等协同效应慢慢熬。熬出来之前叫摊薄，熬出来之后才叫重组成功"
  - "EPS即为每股盈余的意思，和很多指标一样，它也有固定的计算公式，EPS=盈余/流通在外股数。"
  - "EPS这个指标的数值通常是越高越好的，也不存在上限，它所代表的是公司的实际盈利能力"
  - "由于公司股本增加，每股股票所代表的企业实际价值（每股净资产）有所减少，需要在发生该事实之后从股票市场价格中剔除这部分因素"
  - "也就是说当一个公司利润持续增长使得每股收益（EPS）提高，同时市场给予的估值（PE）也提高，股价得到了相乘倍数的上涨，这就叫戴维斯双击；相反，当一个公司业绩下滑时，每股收益（EPS）减少或下降，市场给予的估值（PE）也下降，股价得到相乘倍数的下跌，这就叫戴维斯双杀"
  - "我认为，市盈率大于77（中国人的人均寿命），就该称为市梦率了。投资者要超过77年的时间才能回本，梦够长啊"
  - "市梦率都是炒上去的，股民应尽量避开市梦率的股票，否则，梦醒时分，你只有抱着它流泪到天明了"
  - "一般来说，市盈率为0-13 代表价值被低估，14-20代表正常水平；21-28代表被高估；28+ 代表出现投机性泡沫"
