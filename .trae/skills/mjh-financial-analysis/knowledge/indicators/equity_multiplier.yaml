name: 权益乘数
key: equity_multiplier
category: 盈利能力
alias: [权益乘数, 财务杠杆, 杠杆率, 财务杠杆率, 杜邦分析]
definition: 资产将所有者权益放大的倍数——投入一元想搏动四元资产，权益乘数就是4，另外三元是借来的（资产负债率75%），这种以小搏大现象就是财务杠杆。
formula: 权益乘数=资产总额/股东权益总额=1/(1-资产负债率)=1+产权比率；在杜邦体系中：ROE=销售净利率×总资产周转率×权益乘数，且净资产收益率=总资产收益率×权益乘数（ROE/ROA即杠杆率）；财务杠杆效用=负债额×(债务资本利润率-负债利率)×(1-所得税税率)。
majinghao_view: |
  权益乘数一般情况下都大于1，所以ROE一般大于ROA；它是连接净资产收益率、销售净利率、资产周转率的桥梁，也是连接ROE与ROA的桥梁——把ROE与ROA放在一起，两个比例相除就是公司盈利的"杠杆率"。
  权益乘数、资产负债率、产权比率是财务杠杆的三种表现形式，三者同向变动，指标越高财务风险越大、财务杠杆作用度越大；高权益乘数（财务杠杆）是个双刃剑，放大了盈利能力但也增加了企业风险，企业破产很多时候不是因为没有账面利润，而是因为资金链紧张。
  关键要分析权益乘数大的高负债的性质：负债中含大量有息负债的高ROE，背后隐藏风险，去杠杆时风险可能暴露；但含大量无息负债（占用上下游资金）的高权益乘数，是企业竞争力强大的表现——没有利息吞噬利润的后顾之忧，可以运用更高的财务杠杆、享受更高的估值（也要警惕上下游"挤兑"风险）。
  企业稳健的筹资战略应主要来自充分利用上下游的无息经营负债和利润形成的留存收益；不缺钱、不借债才真牛，企业的核心竞争力是完胜财务杠杆的。
thresholds:
  healthy: 低权益乘数（财务杠杆尽量低、尤其有息债务尽量低）并保留充分自由现金流的情况下，ROE还能长期保持优秀（一般大于15%）的企业，值得投资；债务资本利润率大于负债利息率时，负债经营才有正的财务杠杆效应
  watch: 财务杠杆诱人也很危险：债务资本利润率等于负债利率时杠杆效用为零、小于负债利率时为负——企业至少要具备"债务资本利润率（可用总资产报酬率替代）大于负债利息率"的借钱能力
  danger: 过度负债加大财务风险，有息负债如无法偿还将面临资金链断裂风险；依靠高杠杆得到的ROE，在大致相同ROE的情况下不如财务结构稳健、负债较低的企业；去杠杆时风险可能暴露
fraud_signals:
  - 高ROE＋高权益乘数组合：若高净资产收益率主要是高的权益乘数导致的，说明资产负债率高、财务风险相对较大——要警惕含有大量有息负债的高ROE企业
  - “真有钱假有钱”识别：如果一家上市公司能够产生自由现金流，却拥有需支付大笔利息费用的长期借款，就要怀疑其自由现金流是否真实可靠——通常能产生自由现金流的公司不会借贷经营；较低的负债水平、几乎为0的长期借款一般都是优秀上市公司的财务特征
  - 借钱能力检验：企业不是能够借到钱就是"师傅"，至少债务资本利润率（可用总资产报酬率替代）要大于负债利息率，否则负债经营的财务杠杆将起到负面作用，引发资金链断裂甚至破产
  - 净财务杠杆（有息负债/股东权益）比传统财务杠杆更能准确衡量财务风险——无息负债是占用上下游资金，风险性质完全不同
  - 利息抵税效用核算：利息抵税效用=负债额×负债利率×所得税税率（《企业所得税法》规定生产经营期间向金融机构借款的利息支出可按实际发生数扣除）——既定负债利率和所得税税率下负债额越多利息抵税效用越大，但抵税收益不能掩盖财务杠杆效用为负的风险
  - 财务杠杆效用正负检验：财务杠杆效用=负债额×(债务资本利润率-负债利率)×(1-所得税税率)——债务资本利润率越高杠杆效用越大，等于负债利率时效用为零，小于负债利率时为负；财务杠杆也可能给企业带来负效用，能否获益取决于债务资本利润率与负债利率的对比关系
  - 高杠杆ROE横向比较陷阱：利用净资产收益率进行企业横向比较时一定要注意负债率——大致相同的ROE下，依靠高杠杆得到的不如财务结构稳健、负债较低的企业；高ROE若不是依靠杠杆放大而是来自较高的销售净利率，才反映业务经营优良、产品竞争力较强、财务风险较小
  - 加杠杆周期风险：对加杠杆而获得较高净资产收益率的企业要多加注意——一是会产生较大的财务费用减少盈利，二是如果经营状况经历周期波动或意外情况，过高的杠杆水平将带来灾难
  - 少数股东权益利润操纵：少数股东权益大幅增加而少数股东损益不增反减，因加权平均净资产收益率的计算要扣除少数股东权益和少数股东损益，导致分母相对大幅减少、分子相对同比增加，加权ROE被推高——玩的是数字游戏
  - 明股实债识别：有息负债率的下降伴随着少数股东权益的大幅上升，可能存在明股实债——将表内负债转移至表外，美化资产负债表；实际有息负债率比披露值更高，也间接印证通过少数股东权益操纵利润
  - 少数股东ROE背离检验：一般来讲少数股东的净资产收益率远高于母公司股东的净资产收益率，说明少数股东占了便宜；反之少数股东ROE远低于归母ROE，则少数股东吃了亏——背离过大（如归母20%对应少数股东不足3%）要高度警惕
cases:
  - company: 中国海油
    article: "405247485"
    point: 权益乘数从1.55降至1.36（贡献ROE约-2.1个百分点），有息债务四年砍掉一半至613.70亿元——主动降杠杆的代价，一半算自愿，换来的是"安全答卷"
  - company: 苹果公司
    article: "271057749"
    point: 曾经很长一段时间一直没有有息负债——钱多到根本不需要贷款支付利息费用，用自己的钱把利息省下来不是更香
  - company: 金科股份
    article: "146731463"
    point: 2018-2019年归母摊薄ROE为16.76%、20.74%，而少数股东摊薄ROE仅0.92%、2.75%；少数股东权益从2017年25.97亿元跃升至2018年145.9亿元（5.62倍）、2019年247.8亿元，但少数股东损益2018年1.346亿元反而比2017年2.808亿元少了一倍多——初步判断通过少数股东权益进行利润操纵；同时有息负债率42.85%→35.29%→30.69%逐年下降伴随少数股东权益大幅上升，可能存在明股实债
quotes:
  - "权益乘数就是资产将所有者权益放大的倍数"
  - "通常我们将权益乘数的以小搏大现象称之为财务杠杆，权益乘数越大，财务杠杆就越大"
  - "权益乘数一般情况下都大于1，从上面的公式可以看出，净资产收益率一般情况下都应该大于总资产收益率"
  - "高权益乘数（财务杠杆）是个双刃剑，放大了盈利能力，但也增加了企业风险，企业破产很多时候不是因为没有账面利润，而是因为资金链紧张，所以需要关注企业负债水平，尤其是有息负债水平"
  - "如果负债中含有大量有息负债，这类企业在该ROE指标上的优秀背后确实隐藏着风险，去杠杆时风险可能就会暴露出来，因此，要警惕的是含有大量有息负债的高净资产收益率的企业"
  - "但对于负债中含有大量无息负债的企业，其拥有高净资产收益率，正是因为财务杠杆中有大量的无息负债，相当于投入资本不多，但依靠自身强势地位，借用了大量的上下游资金进行经营，这是企业竞争力强大的表现"
  - "企业不缺钱、不借债才真牛！最终，企业的核心竞争力是完胜财务杠杆的"
  - "财务杠杆是没钱才用的，代价是损失一部分现金利润"
  - "巴菲特只喜欢投资那些财务杠杆很低，财务非常稳健的公司"
  - "利息抵税效用=负债额×负债利率×所得税税率"
  - "财务杠杆效用=负债额×(债务资本利润率-负债利率)×(1-所得税税率"
  - "要是一家企业总是能在低负债，也就是财务杠杆尽量低，尤其是有息债务尽量低，并保留充分自由现金流的情况下，净资产收益率（ROE）还能长期保持优秀（一般大于15%）的企业，是值得投资的"
  - "在利用净资产收益率进行企业横向比较时，一定要注意企业的负债率，如果某些企业的净资产收益率是依靠高杠杆而得到，在大致相同的净资产收益率的情况下，就不如那些财务结构稳健、负债较低的企业"
  - "对于那些加杠杆而获得较高净资产收益率的企业要多加注意，一是会产生较大的财务费用减少盈利，二是如果公司的经营状况经历周期波动或者意外情况，过高的杠杆水平将带来灾难"
  - "一般来讲，少数股东的净资产收益率远高于母公司股东的净资产收益率，说明少数股东占了便宜，反之，少数股东的净资产收益率远低于母公司股东的净资产收益率，则少数股东吃了亏"
  - "有息负债率的下降伴随着少数股东权益的大幅上升，初步判断该公司可能存在明股实债的情况，也即可能存在将表内的负债转移至表外，美化公司资产负债表"
