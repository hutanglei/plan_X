name: 自由现金流
key: fcf
category: 现金流质量
alias: [FCF, FCFF, 企业自由现金流]
definition: 企业支付必要的运营成本费用（购买存货、支付工资、偿付应付款）和资本性支出后剩下的、可以自由支配的现金——"利润是面子，现金流是里子"。
formula: >-
  标准法（FCFF）：FCFF=息前税后利润(即EBIT−EBIT×所得税率)+折旧摊销−净营运资本增加−资本开支；
  影响自由现金流的五个直接因素：①EBIT（息税前利润，代表盈利和盈利成长的结果）②所得税（税款，代表企业履行社会责任程度）③折旧和摊销（影响盈利不影响经营现金流）④净营运资本的变化（用以维持日常经营和维护上下游稳定性）⑤资本开支（维持未来的成长性和竞争力）。
  简易法：自由现金流=经营活动产生的现金流量净额−购建固定资产、无形资产和其他长期资产支付的现金（严谨口径下再减去处置长期资产收回的现金净额）。
  中国会计准则的妙处：现金流量表把利息支出放在筹资活动里（"分配股利、利润或偿付利息支付的现金"），经营现金流没被利息污染，所以简易口径天然接近教科书上的FCFF，不用再费劲加回税后利息。
majinghao_view: |
  自由现金流代表企业每年拥有可以自由支配的现金有多少，一个企业的价值通常就是未来每年的自由现金流按预期折现率折现到现在的价值。
  自由现金流为正说明企业具有良好的财务弹性，持续经营能力强，能不依靠外部输血仅靠经营活动就支撑投资活动现金流出（"自生造血"）；为负则意味着财务弹性差，需要外部融资。
  筹资活动（增发、借债、分红、还债）一律不计入自由现金流；应付账款占款留在企业没有现金流出，由此变好的自由现金流也是真实的，不需要扣除。
  判断一家企业是否高质量发展，其实就是判断该企业是否具备持续创造自由现金流的能力；自由现金流长期为正，代表企业在创造价值，反之则是在毁灭价值。
  自由现金流越充沛，表示一个公司获取现金的能力更强；考量一个企业真实强弱的重要标准就是获取现金的能力，特别是获取自由现金流的能力——只有足够强的自由现金流才能体现公司的价值，有了自由现金流，企业才能真正为股东派发现金股利。
thresholds:
  healthy: 自由现金流长期为正；自由现金流占营业收入的5%或更多，"就相当于印钞机了"
  watch: 最新三年EBIT逐年上升且大于0，最近五年FCFF÷EBIT均值大于50%且每一年该值均大于0——公司FCFF长期处于稳定高位，若ROE还能长期保持优秀（一般大于15%），则是值得投资的好股票；很多快速扩张的公司自由现金流一般为负数——经营现金流的增长赶不上资本支出的增长，属扩张期常态，须与经营现金流本身连年为负的"失血"状态区分
  danger: 连续多年经营现金流为负数（企业没有"造血"能力，只能靠发债或增发融资，增加经营风险并稀释股东权益）；自由现金流为负却还要大额分红、付高息
fraud_signals:
  - 一家上市公司能够产生自由现金流，却拥有需支付大笔利息费用的长期借款——要怀疑其自由现金流是否真实可靠，通常能产生自由现金流的公司不会借贷经营；但也并非一棍子打死财务杠杆——若业务前景一片光明、产品或服务需求增长迅猛，可能一段时期内加杠杆发展，不过不会是长期现象
  - 经营现金流为负的公司，要检查应收账款是否大幅增加、甚至超过销售增长——很可能已入不敷出，警惕资金链断裂
  - 自由现金流长期为负却持续大额分红、高息举债、发天价薪酬——分红/付息/工资的现金来自筹资活动流入，即"庞氏分红、庞氏利息、庞氏工资"结构，一旦输血停止必然崩盘
  - 经营现金流里含着大量应付款占款（供应商信用）时，简易口径算出的自由现金流有占款贡献，看趋势要留个心眼
  - 检验分红真实性：拿全年自由现金流对照股息加利息，覆盖后若剩不下钱去消化短期借款，说明分红掏的是股权融资和借新还旧进来的新钱
cases:
  - company: 中国神华
    article: "408983763"
    point: 2026上半年简易口径自由现金流约251亿（经营净额546.64亿−购建长期资产295.79亿），但覆盖418亿股息加利息后剩不下几个铜板去消化675亿短期借款——分红的钱靠股权融资和借新还旧，"利润是面子，现金流是里子，借钱分红是日子过反了"
  - company: 中国恒大
    article: "407156353"
    point: 2016—2020年经营+投资合计自由现金流累计-4,190亿元，全靠筹资净流入+4,746亿元维持运转，期间却向股东派发股息939亿元——教科书级的"庞氏分红"
  - company: 华夏幸福
    article: "407156353"
    point: 自2011年借壳以来逐年累计自由现金流量持续为负值，所谓分红、付息都沦为"庞氏分红与庞氏利息"
  - company: 海螺水泥
    article: "146020294"
    point: 2015-2019年自由现金流分别为47.41亿、82.15亿、137.07亿、313.10亿、318.64亿元，2019年自由现金流/营业收入达20.29%——2018、2019两年自由现金流均超300亿元、占营收均超20%，妥妥的现金牛，堪称验钞机。
  - company: 片仔癀
    article: "144814823"
    point: 每年资本开支均不超过1亿元、固定资产几乎保持不变，2014-2018年经营活动现金净流量合计22.54亿元、资本开支合计3.22亿元、自由现金流合计19.32亿元；本期自由现金流10.93亿元、占营业收入25.17%——现金获取能力强悍，但账上40多亿现金而投资活动现金流出不到4000万元，需关注机会成本与资金使用效率。
  - company: 汤臣倍健
    article: "144814522"
    point: 2016-2019年自由现金流分别为5.35亿、8亿、10.98亿、12.05亿元，占同期营业收入比重分别为23.17%、25.72%、25.24%、22.90%——生产经营活动产生的现金流完全能够满足公司投资需求，且不受商誉减值（非现金活动）影响。
quotes:
  - "追女朋友时，净利润重要，可以忽悠，云山雾罩，看不清你的真面目；将女朋友变为老婆后，现金流重要，柴米油盐过日子，很现实，你必须原形毕露"
  - "何为“自生造血”？企业可以不需要外部输血，仅靠经营活动就能够支撑投资活动现金流出，即自由现金流为正"
  - "当企业的自由现金流占营业收入的5%或者更多时，就相当于印钞机了"
  - "可以简单地认为，一个企业如果不创造自由现金流就不是一个值得投资的企业，毕竟对于股东来说，是要以能拿到手里的现金作为投资回报的"
  - "判断一家企业是否高质量发展，其实就是判断该企业是否具备持续创造自由现金流的能力"
  - "咱们的现金流量表把利息支出放在筹资活动里（“分配股利、利润或偿付利息支付的现金”），经营现金流就没被利息污染过，所以“经营现金流−购建长期资产支出”这个简易口径，天然接近教科书上的FCFF，不用再费劲加回税后利息。"
  - "自由现金流越充沛，表示一个公司获取现金的能力更强，而考量一个企业真实强弱的重要标准就是获取现金的能力，特别是获取自由现金流的能力，这是投资的核心思路，只有足够强的自由现金流才能体现公司的价值"
  - "有了自由现金流，企业才能真正为股东派发现金股利"
