---
name: 固定资产（含在建工程）
key: fixed_assets
category: 资产质量
alias:
- 在建工程
- 转固
- 固定资产周转天数
- 重资产
- 投资性房地产
- 开发产品
definition: 企业看得见变旧的资产（靠折旧把损耗的价值转进利润表）；在建工程是还没转正的固定资产——生产线都造出产品了还赖在“在建工程”里不转正，就是耍流氓。折旧像一个搬运工，将资产负债表中购买固定资产的支出一点一点地“搬到”利润表中去；除存货外的其他资产不能通过销售的方式进利润表，就通过折旧和摊销（折旧摊销还可先计入产品成本、随销售结转成本进利润表）。同一幢新盖的房子在财务上可用多达四个科目记载：自建自用完工后记“固定资产”，还未结转先在“在建工程”核算，用于出租记“投资性房地产”，房地产公司为销售目的所建记“开发产品”。
formula: 无统一计算公式。识别口径（马靖昊原文）：固定资产造假看①固定资产周转天数是否明显提高、远高于同行；②与同行对比固定资产金额/营收总额有无明显差异，固定资产与收入比（平均固定资产净值/销售收入）远远大于同行的水平即“事出反常必有妖”；③在建工程这些年有没有超乎常规的增长。在建工程造假看①“在建工程”/总资产对比同行，远高于同行为危险；②在建工程连续多年保持很高数额且不转化为固定资产为危险。另：（固定资产+在建工程）/总资产大于40%为重资产型公司。现金流口径（早期文新增）：购买机器设备的钱在购买当年已一次性反映在现金流量表“购建固定资产、无形资产和其他长期资产支付的现金”项目中，以后计提折旧的年份并无现金流出，以利润为基数计算现金流时要加回折旧摊销（资产减值损失同理加回）。
majinghao_view: |
  “在建工程、固定资产”是财务造假最好用的科目：它们是非流动性资产，不像应收账款造假那样利润与现金流脱节扎眼；建设周期长、价值高、定价复杂，给了虚增造价套取资金的空间；造假只要当年蒙混过关，以后可通过折旧、减值把“资产黑洞”自然而然化解于无形——在流动资产上做假很累，得时刻想着补窟窿；在长期资产上做假，造一笔，管十年。
  财务造假已经进化：既要利润，又要现金流入，还要有投资现金流出——造假科目从应收账款、存货类流动资产转移到了更难审计的非流动资产（固定资产、在建工程），它们投入资金巨大、很难说清楚值多少钱，自然成了藏污纳垢的好地方，以后可以通过折旧、减值自然而然将黑洞化解于无形。
  判断财务造假时资产负债表才是最重要的，应收账款、存货、固定资产、在建工程是最常见的藏污纳垢之地。
  虚增的固定资产是为了平衡利润表中虚增的收入、利润；只要资产质量得不到保证，净利润就不可信——资产夯实下的净利润是可信的，资产肿胀下的净利润是不可信的。
thresholds:
  healthy: 存货、在建工程、固定资产、无形资产和商誉都没有大级别的变动，资产负债表结构较为稳定；在建工程转固速度正常，巨额固定资产及在建工程正常用于抵押融资。
  watch: 在建工程金额很大而净利润很小（延迟转固冲动最强，一转固、一折旧利润就可能由盈转亏）；项目进度常年停在95%到不了100%；最近1、2年在建工程突然变大，同时收入利润也在逐步增加（可能在用在建工程消化造假利润）。
  danger: 在建工程连续多年余额较高且每年变动金额较小一直不转固；固定资产周转天数每年突突上升且远比同行高；固定资产与收入比（平均固定资产净值/销售收入）远大于同行；同行业一家公司营收是它几倍而两家固定资产差不多；绝大部分固定资产及在建工程没拿去抵押（资产可能虚构、经不起评估审计）；亏损年度对固定资产“洗大澡”式巨额计提减值（一次亏个够）。
fraud_signals:
- 推迟转固调节利润：在建工程不转固就无需计提折旧、借款利息继续资本化，费用少了利润就“胖”了——达到预定可使用状态才是转固的唯一刚性标准，“没办竣工决算”从来不是理由，只是借口。
- 停工继续利息资本化：非正常中断连续超过3个月应暂停借款费用资本化，停工项目继续把利息记入在建工程就是虚增当期利润。
- 虚增造价套取资金：故意抬高厂房设备价格（如5000万工程抬到8000万），多出的钱一部分被贪污、一部分通过购买自家产品回流做大利润；路径是与工程承包公司签订价格较高的“阴阳合同”把资金转移出上市公司。
- 大杂烩科目：将费用化支出任意资本化，八竿子打不着的成本费用也往在建工程里塞——在建工程是“垃圾桶”，什么都往里面装。
- 造假消化链：应收账款→银行存款→预付账款（其他应收款、存货）→在建工程（无形资产、长期股权投资）→固定资产；转到固定资产后按20年折旧，每年只消化造假利润的1/20，基本闭环。
- 识别三看：一看在建工程长期挂账金额巨大、转固速度明显放缓；二看在建工程金额大而净利润小；三看巨额固定资产及在建工程居然没拿去抵押——上市公司有融资冲动，放着巨额资产晒太阳，就要问资产是不是虚构的。
- 现金流量表配合：这类公司经营现金流一般为正，但有大量资本开支体现在“购建固定资产、无形资产和其他长期资产支付的现金”，要判断那么大的资本开支是否符合常识。
- 3-5年报表对比：将3至5年财务报表数字列在一起，看长期资产科目变动，在建工程突然变大且利润同步增加就要怀疑通过在建工程消化造假利润。
- 无造假公司的资产负债表特征：固定资产、在建工程等无大级别变动；总资产异常大幅增长（如乐视网复合增长78%）可作虚增利润的提示性指标。
- 造假进化论（早期文新增）：财务造假已进化到既要利润、又要现金流入、还要有投资现金流出的阶段——造假科目从应收账款、存货类流动资产转移到更难审计的非流动资产（固定资产、在建工程）；虚增固定资产的支出化作资本性支出转移进现金流量表第二部分“投资活动产生的现金流量”，经营活动现金流反而更好看。
- 亏损年洗大澡的两个好处（早期文新增）：亏损时对固定资产多计提减值，一可减少以后年度的折旧费用、为盈利腾出空间；二为处置该项资产作准备——原价1000万、已提折旧200万的资产以600万出售亏200万，若以前年度已提取减值准备600万，出售反而“盈”400万（固定资产减值不得转回，但减值后处置可变现“利润”），有时会计就是数字游戏。
- 固定资产与收入比识妖（早期文新增）：与同行进行对比，固定资产金额与营收总额是否有明显差异——如果固定资产与收入比（平均固定资产净值/销售收入）远远大于同行的水平，那么“事出反常必有妖”，就是那些固定资产中隐藏了虚增的利润。
cases:
- company: 奇信股份
  article: 285811028
  point: 2012-2019年跨期8年连续财务造假、虚增利润总额逾26亿（每年虚增利润占当期披露利润总额127%-242%），充分利用“在建工程、固定资产”科目，从在建工程中洗出资金回流企业时既增加经营现金流又形成巨大“资产黑洞”。
- company: 尔康制药
  article: 275214552
  point: 净利润从2013年1.92亿涨到2016年7.5亿、三年翻近4倍，同时固定资产周转天数每年上升且远比同行医药公司高，固定资产居然和营收为其6-8倍的恒瑞医药很接近——虚增的“净利润”都化作固定资产，2017年5月被爆财务造假。
- company: 万福生科
  article: 392741351
  point: 通过在建工程虚增成本洗出资金，回流企业时不仅增加了经营现金流量，还同时形成了一个巨大的“资产黑洞”，长期未被发现。
- company: 康美药业
  article: 277804390
  point: 2018年财报分别调增固定资产11.89亿元、在建工程4.01亿元、投资性房地产20.15亿元，合计调增资产总额36.05亿元——通过虚增在建工程成本转固达到虚增固定资产、虚增利润并套取资金的目的。
- company: 乐视网
  article: 261407963
  point: 总资产从2010年到2016年底峰值年复合增长78%，巨额虚增利润公司无一例外伴随总资产大幅增长——虚增资产和利润的最终目的是圈进更多的钱。
- company: "*ST秋林"
  article: 137010433
  point: 2018年净资产为负并巨亏41.31亿，拟将自用固定资产租赁他人后以投资性房地产公允价值重估，填补净资产窟窿并规避亏损退市保壳。
quotes:
- 财务造假最好用的科目：“在建工程”、“固定资产
- 任何不以结婚为目的的恋爱都是耍流氓，生米都煮成熟饭了，就是事实婚姻。在会计上，如果在建工程中的生产线都制造出产品了或办公楼都已经入住了，却还没转正为固定资产，就是耍流氓，任何没办理竣工决算的托辞都是狡辩
- 在流动资产上做假很累，得时刻想着怎么补窟窿；在长期资产上做假，造一笔，管十年
- 在建工程更容易成为“垃圾桶”，什么都往里面装
- 事实上在判断上市公司是否进行财务造假的时候，资产负债表是最重要的。应收账款、存货、固定资产、在建工程是最常见的藏污纳垢的地方，甚至货币资金都不靠谱
- 只要能减值的东西，都可以慢慢消化，只要现金流还能维持下去，不暴雷，最终都化为无形
- 在建工程不转固，利润里面有“水分”；水分挤干时，小心资产变“黑洞
- 折旧会迟到，但不会缺席
- 只有资产质量得到保证的情况下，净利润才是可信的；资产肿胀下的净利润是不可信的
- 折旧好象一个搬运工，将资产负债表中购买固定资产的支出一点一点地"搬到"利润表中去
- 没有本质的区别，固定资产减值，就是固定资产“猛”的折一下旧
- 有时，会计就是数字游戏
- 现在上市公司财务造假已经进化到既要利润，又要现金流入，还要有投资现金流出，这种类型造假，资产负债表中体现的科目就不是应收账款、存货类流动资产，而是转移到了更难审计的非流动资产，如固定资产和在建工程
- 如果固定资产与收入比（平均固定资产净值/销售收入）远远大于同行的水平，那么，事出反常必有妖，就是那些固定资产中隐藏了虚增的利润
- 购买这些资产时，唯独没有利润表的事，等到通过摊销、折旧将这些资产转为费用时，就与利润表发生关联了
- 很多上市公司都需要建设厂房、购买固定资产，这些东西的价格往往很高，关键是难以定价。因此，套取资金最安全的手法就是故意抬高它们的价格，然后转移出去高出来的那部分资金，一部分可能用于贪污，另一部分也可能通过购买自身产品，以做大利润的方式重新回到公司。
