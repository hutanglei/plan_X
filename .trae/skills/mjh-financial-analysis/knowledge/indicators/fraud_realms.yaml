  point: 证监会2026年5月事先告知：故意少计存货跌价准备+虚假销售，2022年虚增利润总额4540.21万、占当年104.58%（利润全假），拟罚1.73亿，触及重大违法强制退市。
- company: 东尼电子
  article: 410523721
  point: 2022年应全额计提跌价的未入账原材料未计提，2022年报、2023半年报分别虚增利润总额3877.59万、7227.79万，占当期披露额绝对值38.63%、70.95%。
quotes:
- 利润是虚的东西，因为它是由虚账户结转而来的，所以可以造假；赚钱是实的东西，它必须能掏兜验证
- 利润表造假，必然在资产负债表上留下“水分”，实际上就是将“费用”放进了资产负债表里了。这就是一切造假的原罪，资金闭环也逃不掉
- 钱造不了假，谁要在货币资金上造假，那是耍流氓，一点钞就露馅
- 利润表繁花似锦，资产负债表虚胖臃肿，经营现金流常年失血，三者互相打架，必是财务造假
- 闭环转得再圆，也圆不了会计恒等式；三张报表的勾稽关系，就是悬在造假者头上的达摩克利斯之剑
- 造假不产生现金，只消耗现金。用爱发电都不行，何况用假账
- 有。就一条：这家公司需要不停向市场要钱，而它的经营自己生不出钱
- 从较长周期来看（10年），经营活动现金流量净额/净利润（净现比）应该大于1。如果净现比低于0.7，则存在利润造假的可能性；如果低于0.5，则可以判断其利润造假
- 在利润存疑的情况下，通过分析资产负债表科目的异常，往往更容易发现财务造假的线索
- 事实上在判断上市公司是否存在财务造假的时候，资产负债表才是最重要的。应收账款、存货、固定资产、在建工程是最常见的藏污纳垢的地方，甚至货币资金都不靠谱
- 上面造假的五重境界，虚增利润都将导致虚增资产，虚增的应收账款（应收票据）、存货、在建工程、固定资产等项目，都是资产中的“水分”，这些“水分”就是披着资产外衣的费用
- 财务造假的本质，不是把利润“凭空变出来”，而是把谎言在报表之间转移：利润表负责制造繁荣，资产负债表负责暂时藏匿，未来的利润表再负责承担代价
- 唯有极大地提高惩罚，让财务造假的主要责任人处罚到倾家荡产，才能逐步杜绝造假，否则惩罚与得到利益的代价不平等，那财务造假难免还会层出不穷，所谓的重拳打击上市公司财务造假就会沦为一句笑话
- 如果从三大报表来看，虚增利润都会造成资产负债表里的一项或多项资产虚增，同时利润表里的收入虚增或成本虚减，而现金流量表里的经营活动现金流必须与其利润产生背离，虚增的利润越多，两者背离得就越厉害
- 虽然财务造假其实很累，而且成本很高，但由于其中的利太大，造假企业还是乐此不疲
- 不是玩笑，上市公司财务造假，税务局无论如何都是赢家
- 上市公司财务造假越猛，税务局越高兴，此谓吹牛税
- 钱是造不了假的，康美钱“造假”是耍流氓，这不，一点钞就露馅了，但利润留造假，是点不清的
- 企业的财务造假案例，很少是专业会计、审计机构事先核查出来的，大多是通过公司内部出问题，比如内斗，或者造假成本过高造成现金流枯竭，导致造假行为败露
- 如果一家上市公司的营业收入增速仅为应收账款增速的一半以内，可以这么说，要么公司销售部门在向下游压货，要么公司财务部门在造假
- 应收账款有坏账，存货要减值，还有一个更不利的，“三流合一”是虚增流动资产死敌，容易撞到枪口上了
- 我拿一笔钱到体外循环一圈儿，然后赚一笔进来，你能咋滴
- 公司账上的资产是虚的，会越来越“多”，这会导致公司资产周转率不断下降。因此，像什么资产科目严重臃肿的公司，其实就是利润造假的结果
- 在判断其财报是否存在财务造假时，如果成本和营收都增加而利润却没有按照相应的净利率增加，就是重要的破绽之一
- 财务造假严重挑战信息披露制度的严肃性，严重毁坏市场诚信基础，严重破坏市场信心，严重损害投资者利益，是证券市场“毒瘤”，必须坚决从严从重打击
- 可以说，每一次会计改革，都在不同程度上要求会计人员做出更多的估计和判断，简直要把会计人员当作“神人”了。不过，对于上市公司而言，增加了会计弹性，就增加了操纵利润（也可谓之为盈余管理）的空间
- 在我看来，还是政府聪明，政府收税时收取的全都是现金，我从来没听过哪个政府收税时是收利润或收入的！收入和利润都是子虚乌有的东西，但按收入和利润计算税金，比按现金收入和现金利润计算税金，永远要大，这就是奥秘
- 不客气地讲，这样的会计技术就是专门用来做假账的
- 如果一家上市公司连续几年虚增利润，那么资产负债表上的某一个项目或几个项目就会虚增，例如货币资金、应收账款、存货、在建工程、固定资产、无形资产等项目的数字会注入“水分”，显得较为臃肿。这一逻辑就是我们识别财务造假的基本方法。
- 上市公司财务造假基本上都是为了虚增利润，根据会计平衡原理，如同守恒定律一样，虚增净利润，绝大多数情况下必然要虚增资产（很难虚减负债，因为有债权人盯着，而资产则属于我的地盘我作主）。因此，造假企业总在琢磨如何把虚增的利润藏到什么资产类科目里最不容易被人发现，真如同小时候玩的躲猫猫。
- 财务造假都是围绕“资产＝负债+期初所有者权益+净利润（简单表述：净利润=收入-费用；详细表述：净利润=营业收入-营业成本-营业税金及附加-销售费用-管理费用-财务费用-资产减值损失+公允价值变动损益+投资收益+营业外收入—营业外支出-所得税费用）这个动态会计平衡等式进行的，虚增利润表达为：资产↑+费用↓＝负债↓+期初所有者权益+收入↑，虚减利润表达为：资产↓+费用↑＝负债↑+期初所有者权益+收入↓。
- 上市公司造假主要涉及的是资产类，至于负债，因为有第三方验证，但资产就不一样，我的地盘我作主。利润的造假最终主要是要通过资产造假来实现的。
- 财务造假的核心思想是将不想进利润表的费用（收入）披上资产（负债）的外衣继续呆在或直接进入资产负债表中。
- 上市公司财务造假越猛，交税越多，税务局越高兴，此谓吹牛税；主板、新三板上市的公司越多，交税越多，税务局越高兴，此谓补漏税。
- 我说过无数遍：三张报表里，利润表最会“撒谎”，资产负债表负责“圆谎”，现金流量表负责“揭穿”。
