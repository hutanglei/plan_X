---
name: 造假五重境界（造假总论）
key: fraud_realms
category: 造假识别
alias:
- 财务造假总论
- 造假三分类
- 造假五重境界
- 资金闭环造假
- 虚增资产藏利润
definition: 财务造假万变不离其宗：虚增的利润必然要在资产负债表上找个地方藏起来——按藏匿科目分为五重境界（应收账款→货币资金→预付往来→存货→在建工程固定资产），钱转得再圆，也圆不了会计恒等式。
formula: |
  动态会计平衡等式：资产+费用＝负债+所有者权益+收入；虚增利润表达为：资产↑+费用↓＝负债↓+期初所有者权益+收入↑，虚减利润表达为：资产↓+费用↑＝负债↑+期初所有者权益+收入↓（调高利润就是费用资产化或虚增收入，调低利润就是资产费用化或收入负债化）。
  马氏定律：从较长周期（10年）看，经营活动现金流量净额/净利润（净现比）应大于1；低于0.7利润造假可能性很大，低于0.5可判断利润造假。长期经营性净现金流与净利润背离的，可将会计期间从1年延伸至5年甚至10年——经营性净现金流基本上应与净利润一致，仍背离很大即可判断存在财务造假。
  现金流量偏离标准比率：经营性现金流量/(净利润+折旧+摊销)，一般应在1左右，虚假利润会导致该比率严重偏离（某虚增利润企业连续三年为-21%、-5.6%、36%）。
majinghao_view: |
  财务造假分三类：无中生有（虚构收入、隐瞒费用，虚增资产、隐瞒债务）、寅吃卯粮（提前确认收入、推迟确认费用或干脆将费用资本化）、洗大澡（提前确认费用、推迟确认收入，报出巨亏为以后盈利作准备）。
  三大报表联动总纲：虚增利润都会造成资产负债表里一项或多项资产虚增，同时利润表里收入虚增或成本虚减，而现金流量表里的经营活动现金流必须与其利润产生背离——虚增的利润越多，两者背离得就越厉害。
  虚增利润绝大多数情况下需要虚增资产来平衡（虚减负债太难，有债权人盯着），所以在利润存疑时，通过分析资产负债表科目的异常更容易发现造假线索——虚增的利润藏匿在资产的任何项目中，那些"水分"就是披着资产外衣的费用。
  造假动因是代价太小（造假成本论）：财务造假其实很累、成本很高（假账真做要缴增值税、所得税、关税等各种税费，"税务局无论如何都是赢家"），但由于其中的利太大，造假企业还是乐此不疲——康美造假三年多交税款8.7亿元（增值税3.52亿+所得税5.18亿），但与其通过发行股票、债券和贷款累计融资803.93亿元的巨额利益相比微不足道。
  造假是条完整链条：利润表虚增利润→资产负债表虚增资产→最后靠减值核销把假资产出清，用未来的利润回吐埋单；资金闭环这种"最高段位"造假天生是死路，因为造假不产生现金，只消耗现金——为保证业绩增长需要虚增更多收入利润，除提高资金周转频率外更需要源源不断补充资金，资金无以为继时泡沫就破裂。
  造假败露规律：财务造假很少是专业会计、审计机构事先核查出来的，大多通过公司内部出问题（内斗）或造假成本过高造成现金流枯竭而败露。
  监管与惩罚升级：证监会2019年以来累计对22家上市公司财务造假立案调查、18起行政处罚、移送公安6起，案件呈造假周期长涉案金额大、手段隐蔽复杂、系统性造假突出、主观恶性明显四大特点；新《证券法》将信披违法罚款上限从60万提高至1000万、中介机构罚款从业务收入5倍提高至10倍；马靖昊主张引入破产制度——一旦发现造假就拍卖实控人股份弥补中小股东损失，处罚到倾家荡产。
thresholds:
  healthy: 10年累计净现比大于1，利润全是真金白银；资产增速与收入匹配、周转效率稳定。
  watch: 净现比0.7到1为正常，低于0.7利润造假可能性很大；收现比长期小于1要打问号；某项资产长期异常增长、周转效率持续下降后又突然大额减值（先膨胀后出清）；资产科目严重臃肿、资产周转率不断下降。
  danger: 净现比低于0.5基本落在造假命中区；净利润为正、经营现金流为负（净现比为负数）最危险；对境界三以上的体外循环，单年收现比净现比可能失灵，须回到常识追查交易对手与资金轨迹。
fraud_signals:
- 识别总思路：三张报表打架——利润表繁花似锦，资产负债表虚胖臃肿，经营现金流常年失血，三者互相打架，必是财务造假；资产负债表才是最重要的，应收账款、存货、固定资产、在建工程是最常见的藏污纳垢的地方，甚至货币资金都不靠谱。
- 境界一（虚增应收账款/应收票据）：撒手不管现金流，虚增收入挂应收上；识别：应收账款、应收票据增速大于营业收入增速，收现比长期小于1甚至更低，现金流与利润长期背离；量化阈值——营业收入增速仅为应收账款增速的一半以内，要么销售部门在向下游压货，要么财务部门在造假。
- 境界二（虚增货币资金）：私刻印章、虚假回函、甚至开假银行网点来搞定；识别：虚增的货币资金无法产生利息收入，通过计算利息收入和货币资金的匹配性异常发现问题；存贷双高。
- 境界三（虚增预付账款/其他应收款）：钱转到关联方体外转一圈再以"销售回款"名义流回，从现金流看是完美的"真实"生意，收现比净现比双失效；识别：警惕预付账款和其他应收款等科目余额特别高且没有合理解释的企业。
- 境界四（虚增存货）：农业等存货难以核查的企业高发（蓝田股份、银广夏、绿大地、万福生科、獐子岛）；特征：存货等流动资产科目余额持续增长，等待一次"大洗澡"通过计提存货减值将旧账一笔勾销。
- 境界五（虚增在建工程/固定资产）：转入更难以审查的非流动资产，投入资金巨大、值多少钱说不清，天然就是藏污纳垢的"资产黑洞"；识别：在建工程/总资产远高于同行、在建工程连续多年高额不转固、固定资产周转天数明显提高；固定资产和在建工程增长较快但产品不畅销（应收和存货占比较大）也有造假嫌疑。
- 藏匿科目比较优势学（造假者的科目选择逻辑）：虚增应收账款有坏账、存货要减值，"三流合一"是虚增流动资产的死敌；虚增固定资产要被未来折旧吃掉利润；虚增在建工程转固是归宿、周转率与同行比较易发现；虚增货币资金"最省事"（无品名规格之分、无减值，"我拿一笔钱到体外循环一圈儿，然后赚一笔进来，你能咋滴？"），但钱悄悄溜走了就会现"大存大贷"原形——货币资金造假虽最省事，仍可识别。
- 资产周转率信号：公司账上的资产是虚的，会越来越"多"，导致资产周转率不断下降——资产科目严重臃肿的公司，其实就是利润造假的结果。
- 成本营收利润联动破绽：有些公司为搞大营收只好虚增成本，但利润增加要多缴税，为不多缴税干脆不增加利润——成本和营收都增加而利润却没有按照相应的净利率增加，是判断财报造假的重要破绽。
- 造假流程倒推：造假公司先设定当年需虚增利润的金额，按销售净利率反推虚增收入，按毛利率计算虚增生产成本和虚假采购金额，再通过虚增资产消化虚假毛利占用的资金，最后将造假金额分解到每个月份；每个季末财务负责人将真实利润与按年度目标分解的季度利润报给董事长或CEO，由他们确定当季对外披露的利润数据——利润是"定"出来的。
- 假账真做（体外循环）：通过表面非关联公司扮演"真实"客户和供应商，整个造假流程有伪造的购销合同、入库单、检验单、生产单、销售单、发票等"真实"票据凭证对应，资金划转真实、原始凭证真实、毛利率稳定，但沿资金进出的轨迹追查，钱实际在体内体外循环转圈且不断流失；识别靠常识：交易对手什么来头、注册资本多少、有没有干活的能力、大额资金何时进出、对手方是谁。
- 造假手法全景清单：虚构收入、提前确认收入、推迟确认收入、多提或少提资产减值准备以调控利润、制造非经常性损益事项、会计政策和会计估计变更、关联交易非关联化（"你二大爷换了个马甲，跟外人说这不是你二大爷，其实他就是你二大爷"）。
- 会计弹性原理：资产负债表、利润表中所有项目除现金外都具有一定程度的弹性，可供选择的方法越多弹性越大——每一次会计改革都在增加会计估计和判断，也就增加了上市公司操纵利润（盈余管理）的空间。
- 权责发生制的税收奥秘：政府收税时收取的全都是现金，按收入和利润计税永远比按现金收入和现金利润计税要大——这是各国准则坚持权责发生制、听任利润与现金脱节的底层原因。
- 共同逃生信号：这家公司需要不停向市场要钱，而它的经营自己生不出钱——记住这一条，能躲开90%的雷。
