- company: 赫美集团
  article: 126506937
  point: 2018年报总经理、副总、财务总监三名高管声明“无法保证年报真实、准确、完整”；为控股股东违规担保7.8亿元（为自身净资产5倍）；关联方以公司名义借款超2亿元；筹划重组停牌10天后计提资产减值22.04亿元“财务大洗澡”。
- company: 郑百文
  article: 115710222
  point: "“阴阳合同”造假：让进货厂家以欠商品返利形式打欠条、约定不据此还款，以应收款名目做成账面赢利，10年销售收入增长45倍；曝光后创每股净亏2.54元纪录。"
- company: 洪九果品
  article: 409828543
  point: 港股“水果第一股”，营收2019年20.78亿→2022年150.81亿三年翻7倍、净现比-1.18（赚34亿“利润”钱反少40亿）；2023年末预付款44.7亿流向零社保等异常新增供应商，毕马威辞任；董事长邓洪九等6人涉骗贷、虚开增值税专用发票被刑事强制措施，2025年12月30日摘牌。
- company: 清越科技
