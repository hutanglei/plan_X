  point: 2015年10月拟以7.56亿元收购成立仅一天、注册资本1000万元的空壳公司浙江东阳浩瀚影视娱乐70%股权（该公司整体估值10.8亿元，因无任何过往业绩只能记为商誉）；同年11月又拟以10.5亿元收购所有者权益-0.55万元的浙江东阳美拉传媒70%股权（估值15亿元）——高价收购空壳公司摆明给明星送钱、上市公司联合明星花式割韭菜；2018年计提资产减值13.82亿元（其中商誉减值9.73亿元）导致当年亏损10.93亿元，2019年近40亿元亏损中含26.6亿元资产减值损失（其中近6亿元商誉减值）及18.73亿元长期股权投资减值损失。
- company: 宋城演艺
  article: 144532126
