---
name: 商誉
key: goodwill
category: 资产质量
alias:
- 并购溢价
- 商誉减值
- 外购商誉
- 业绩承诺
- 隐藏商誉
- 商誉占净资产比
definition: 商誉就是“买贵了的金额”——非同一控制下企业合并中，购买方合并成本大于被购买方可辨认净资产公允价值份额的差额；价值1000元的东西花8000元买下来，多出的7000元就是商誉。报表中的商誉仅指并购中产生的外购商誉（自创商誉因计量困难一直未能进入财务报表）；商誉属不可辨认资产，不属于无形资产——准则说它满足资产确认条件却没说它属于什么资产，马靖昊认为它并不满足资产确认条件、本质上属于费用。合并报表机理：A公司花10亿元100%控股可辨认净资产公允价值1亿元的B公司，母公司长期股权投资与子公司所有者权益抵消后报表编不平，加上9亿元“商誉”就平了——一旦业绩达不到预期，这9亿元商誉的账面价值很可能就是0，即并购所花的9亿元现金成为费用；且买亏了确认为商誉（挂资产）、买赚了作为投资方的营业外收入（增利润），并购对上市公司报表“无论如何都是一件好事”。
formula: 商誉＝购买方合并成本－合并中取得的被购买方可辨认净资产公允价值份额（非同一控制下）；同一控制下企业合并按账面价值核算、不产生商誉。商誉规模安全度用商誉/净资产×100%判断（早期文新增五档标准）：0＜商誉/净资产≤10%商誉安全；10%＜商誉/净资产≤20%商誉较安全；20%＜商誉/净资产≤30%商誉基本合理；30%＜商誉/净资产≤50%商誉偏高、风险较大；商誉/净资产＞50%商誉过高、风险大。减值触发条件：一旦业绩承诺不达标，可回收金额低于“商誉＋按购买日持续计算的可辨认净资产公允价值”时导致商誉减值。准则沿革：2006年以前我国将商誉在确认后按10年平均摊销计入损益，2006年为与国际会计准则趋同改为不摊销、只做减值测算。分析偿债能力时：真正资产负债率＝（负债总额－预收账款－合同负债）/（资产总额－商誉－长期待摊费用－递延所得税资产），商誉应从资产方剔除。
majinghao_view: |
  商誉从严格意义上讲根本就不能属于资产，它不符合资产的定义，商誉不会导致未来现金流流入——商誉究其根本是并购中的一项亏损，是收购价超过被收购企业净资产公允价值的差额，作为资产存在是掩人耳目；在他眼中商誉就是费用，主张并购时将商誉直接作为“费用”处理（不摊销、也不作主观性很强的减值测试）。
  现行准则不摊销只做减值测试，而减值测试主观性较大、装模作样，天然成为操纵利润的工具：年景不好亏损时就对商誉“洗大澡”式巨额冲销，为未来盈利留足空间；如果公允价值准则是魔术，商誉简直就是巫术。
  高估值、高业绩承诺催化了高商誉，形成上市公司的“不良资产”、积聚暴雷减值风险——业绩承诺按利润而非现金数额考核，被并购方在承诺期内各种手段虚增利润，承诺期一过原形毕露，巨额商誉减值的“洗澡”行为背后，并购所付款项大部分可能已被掏出上市公司体外。
  会计准则服务于资本市场，才有商誉目前这样的处理方式——可以方便地调节利润，也可以“合法”地套取资金；对“买买买”导致的账面高商誉要实行责任制，收购垃圾资产、问题资产导致巨额商誉减值损失的，应追究主要责任人及有关当事人责任（赔偿企业损失、背信损害上市公司利益罪），不能放任董监高以并购之名损害上市公司及广大投资者利益。
thresholds:
  healthy: 商誉/净资产≤10%为安全档（10%-20%较安全、20%-30%基本合理，越低越好）；他的一贯态度是商誉本质是费用，越小越好，商誉减值损失极小、资产负债表结构稳定（无大级别变动）的公司更可信。
  watch: 商誉/净资产进入10%-30%区间且持续攀升；商誉大级别增加（高溢价并购）；存在配套高业绩承诺的并购（用赚取利润数额而非现金数额考核）；商誉账上一直趴着不做任何处理（为不影响未来收益而拖延减值）。
  danger: 商誉/净资产＞30%为偏高、风险较大，＞50%为过高、风险大（早期排雷名单中部分高溢价公司商誉占净资产比重远远超过100%、最高甚至达到23倍多）；业绩承诺期刚过就全额计提商誉减值；亏损年度对商誉“洗大澡”式巨额冲销（一次亏个够、为来年轻装上阵避免连续亏损*ST）；商誉减值测试参数（未来现金流现值估计）与账面价值严重背离。
fraud_signals:
- 商誉不是资产：可辨认净资产确认不充分往往导致商誉初始确认偏高，净资产公允价值基本都是偏高的。
- 隐藏商誉（早期文核心新增）：通过评估机构调高被并购方可辨认净资产的价值，将大部分商誉甚至全部商誉隐藏进被并购方可辨认净资产的价值中，导致购买方长期股权投资数额中看起来包含的商誉很少甚至没有——多付的钱（商誉）一直在那里，只是隐藏起来了而已；面对并购估值压力，公司不是压降并购标的估值，而是靠将并购商誉隐藏起来。
- 买亏买赚不对称处理（早期文新增）：长期股权投资初始成本按支付对价的公允价值确定，买亏了就确认为商誉（挂资产），买赚了就作为投资方的营业外收入（增利润）——无论买亏买赚，并购对上市公司都是一件“好事”，多付钱的并购行为因此有了很美的说法；并购的钱都是股民的钱，最后进了谁的口袋，天知道。
- 商誉只减不增悖论（早期文新增）：商誉号称是资产，却只有减值、没有增值——既然商誉是资产，商誉为什么只有减值没有增值呢？
- 双向减值操纵（早期文新增）：有些公司收购标的盈利不及预期，却不计提减值准备；或因当年扭亏无望，便通过大额计提商誉减值给财务报表“洗澡”、为未来业绩增长铺平道路——现金流量预测与贴现率选择都有自主裁决空间，商誉减值本质上就是“财务洗大澡”。
- 业绩承诺陷阱：通过被并购方的高业绩承诺获得高商誉并购通行证，承诺期内被并购方运用各种手段虚增利润兑现承诺；承诺期结束各方利益落袋为安，被并购方开始不断亏损，最后以计提商誉减值一洗了之。
- 并购套资金通道（早期文新增）：有些企业通过并购一方面增大自己的资产、另一方面套走资金，还冠冕堂皇地美其名曰“做大做强”——传媒行业最为明显（华谊兄弟高价收购空壳公司给明星送钱）；自己的企业都做不好，难道收购别人的企业就能做好？
- 同一控制判别：同一控制下合并按账面价值核算、不产生商誉；非同一控制才产生商誉——非同一控制下的大额商誉要额外警惕买贵和利益输送。
- 计算偿债指标剔除商誉：商誉不能独立存在、不能单独变现、不能用来偿债，不剔除会低估真实负债水平。
