- 用所谓的‘并购’掏空上市公司，然后用所谓的‘商誉’减值进行洗白，这是上市公司欺诈中小投资者的一场浩劫，平均到一亿股民身上，每人被打劫了十多万啊。西化的会计准则该反思了！
- 商誉永远无法在自身的报表中招展，却可以在男人的合并报表中荡漾。
- 我一直说，报表中的商誉从严格意义上讲根本就不能算资产。它不会独立带来一分钱的现金流入，不符合资产的定义。商誉，究其根本，是并购中的一项亏损，是多付的钱。
- 商誉占净资产比例超过30%的公司，躲远点；并购标的“轻资产”、评估用收益法、增值率好几倍的，打个问号；业绩承诺年年“精准达标”的，别高兴，要警惕；承诺期刚满、业绩就变脸的，基本可以断定前面的业绩是“做”出来的；账上商誉多年趴着不减值、忽然一年计提80%以上的，那不是利空出尽，那是告诉你：这家的报表，管理层想怎么画就怎么画。
