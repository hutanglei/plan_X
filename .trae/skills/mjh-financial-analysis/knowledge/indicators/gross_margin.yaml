name: 毛利率
key: gross_margin
category: 盈利能力
alias: [毛利率, 毛利, gross margin]
definition: 毛利是没有拔过毛的利润（销售收入减去销售成本的差额）——企业内部人拔的毛是管理费用、销售费用，银行拔的是财务费用，政府拔的是税金，拔干净了才成净利润；毛利率就是毛利÷销售收入，是公司核心业务盈利能力的直接体现。
formula: 毛利率=（销售收入-销售成本）/销售收入×100%，不扣除营业税金及附加（按他的"毛利分配论"，税费是毛利分配的一项内容）；毛利分配论恒等式：毛利（收入-成本）=工资费用（职工）+利息费用（债权人）+税收费用（政府）+净利润（老板）。
majinghao_view: |
  毛利率主要反映公司产品在市场的竞争力，是判断公司盈利能力的基本指标——只有主营业务获得足够毛利才能覆盖各种运行费用、税金、利息，维持持续经营。
  他把毛利率当作"简单粗暴但十分有效"的财务造假识别工具：毛利率具有一定的稳定性并与行业平均值相差幅度不大，太低说明产品竞争力不强，太高又可能财务做假——太高或太低都不正常，符合自然规律（百米赛跑正常成绩10到15秒，跑5秒超过生理极限，跑30秒违背常识）。
  毛利率只能与同行业相比才具分析价值，不同行业间没有可比性；靠产品定价高（品牌、定价权）的高毛利率是真牛逼，靠降成本的高毛利率可能不太靠谱；垄断行业和奢侈品企业毛多可拔，红海地摊货企业没几根毛可拔。
thresholds:
  healthy: 毛利率高于45%（且净利率高于30%）的企业非常优秀，若每年还能基本稳定保持则更加优秀；行业平均毛利率至少在30%以上，才表明行业未来发展有足够空间
  watch: 毛利率向上波动大就要具体分析；靠降成本导致的毛利率提升可能不太靠谱
  danger: 毛利率明显高（低）于同行业上市公司水平、或变动趋势与行业规律不符；不受经济周期影响、增长异常平稳；毛利率忽高忽低如同过山车；行业平均毛利率低于20%基本没有投资价值；毛利率一直远高于行业毛利率又没有独门秘籍——要么隐藏了成本、要么虚增了售价
fraud_signals:
  - 异常一：毛利率升高，应付账款却减少、应收账款却增加——有悖于产业链地位增强的常识，可能将一部分虚增的利润隐藏在虚增的应收账款中
  - 异常二：毛利率升高，存货周转率却下降——产品若滞销毛利率应当下降而非升高，可能将一部分虚增的利润隐藏在虚增的存货中
  - 异常三：毛利率升高，现金循环周期（应收账款周转天数+存货周转天数-应付账款周转天数）却上升，甚至比同行毛利率低的企业更高——毛利率往往不真实，可判断可能做了假账（此条是前两条的综合）
  - 异常四：毛利率大幅高于同行业平均水平，研发费用却低于同行业平均水平——要么隐藏了成本，要么虚增了售价
  - 交叉验证：毛利率提升且应收账款周转率、存货周转率同时提升，毛利率提升一般是真实的；反之可能存在造假（收入虚增应收账款致应收周转率下降，或少结转成本致存货周转率下降）
  - “按预算做账”型造假的破解：企业先设定造假利润目标，按销售净利率反推虚增收入、按毛利率推虚增成本与虚假采购、再虚增资产消化虚假毛利占用的资金——毛利率上看不出异常，但可查水电费等生产指标是否异常（虚增产量必增水电费）、存货是否异常、有无虚假采购合同乃至“假戏真演”的银行流水
  - 拔毛率（他首创）：拔毛率=[毛利率-（毛利-销售费用-管理费用）/营业收入]÷毛利率，作为国企腐败风险识别指标，拔毛率达到1或超过1，可能整个管理层都烂掉了
  - 增值税税负率交叉验证：增值税税负率=（毛利率-不可抵扣税的成本/收入）×增值税税率，两者存在勾稽关系——增值税就是按照毛利缴纳的税（虽不等于按毛利乘税率计算的实际税款），虚增收入、虚增毛利的企业往往缴纳不起与毛利率相匹配的增值税，税负率长期与毛利率背离要高度警惕
  - 虚增存货转移信号：毛利率异于同行业呈现大幅增长而销售收入相对平稳、同时囤积存货，可能虚增了存货、少结转了成本以虚增毛利率与利润；往后抹平这些“存货”时，则可能将虚增的存货转移到在建工程、固定资产，以此掩盖利润舞弊的过程——毛利率高本身不是问题，毛利率高且资产周转率慢才是问题
cases:
  - company: 华新水泥
    article: "260584959"
    point: 2016—2019年现金循环周期持续为负（-41.67天、-24.99天、-38.25天、-55天），符合高毛利率公司现金循环周期短的特点，在同行业可比公司中处于最低水平，说明其议价能力很强、可完全依靠占用上下游资金维持运营周转——是异常情况三的正面对照案例
  - company: 鲁华泓锦
    article: "199647818"
    point: 2018—2020年主营业务收入257999.08万元→250825.06万元→204097.42万元连续下降（2019年降2.78%、2020年降18.63%），毛利率却16.69%→18.85%→22.17%连续升高——收入与毛利率背离的造假疑点，IPO审核中被重点关注
  - company: 珠江啤酒
    article: "167175033"
    point: 2019年毛利率46.84%（同比提升6.29个百分点）居A股啤酒上市公司第一，2020年前三季度达51.57%、拉开第二名近10个百分点——高毛利率并非靠定价（吨价3219元低于青岛啤酒3390元），而是靠低成本（吨成本1756元低于青岛啤酒2070元）与对上游议价能力（应付账款周转天数101天，远高于青岛啤酒51天）
  - company: 农夫山泉
    article: "149995594"
    point: 2019年综合毛利率超55%、瓶装水毛利率60%（对比伊利股份37%、海天味业45%）；应收账款仅3亿元占收入1%、合约负债20亿元先款后货——先款后货与高毛利率相互印证品牌力；但产能利用率仅约50%，若产销量无法消化产能增速需警惕毛利率下滑
  - company: 神州泰岳
    article: "149421690"
    point: 2020年一季度毛利率62.64%很高，但营业净利率仅1.22%、净资产收益率仅0.40%——2017—2019年销售费用率22.54%、22.21%、33.79%，管理费用率32.72%、32.86%、37.56%，2019年三费/毛利达112.9%，畸高费用几乎把毛利吞噬干净
  - company: 恒生电子
    article: "151323521"
    point: 2019年前三季度毛利率97.66%远超贵州茅台的91.49%（同行业同花顺87.89%、东方财富72.69%）——研发强度45.41%远超同行、现金循环周期-522.1天，高毛利率有真金白银的独门绝技支撑，属正面对照案例
  - company: 江中药业
    article: "164892583"
    point: 2019年毛利率66.66%、净利率19.57%均处较高水平，但因货币资金占比超40%资金闲置，总资产周转率仅0.57、权益乘数仅1.21，净资产收益率只有13.63%——毛利率高不等于股东回报高，需结合周转与杠杆看
  - company: 未名医药
    article: "196881605"
    point: 2020年销售费用2.86亿元、占销售收入的比重为103.40%，居然超出了它的销售收入——销售费用占收入比例超过50%以上基本可说明正采用最直接最高效的方法营销（商业贿赂、带金销售），靠高销售费用驱动的收入与毛利质量堪忧
  - company: 步长制药
    article: "196881605"
    point: 2018—2020年销售费用均超80亿元、近3年销售费用率59%、57%、52%达到畸高水平，2020年销售费用83.73亿元是营业成本37.41亿元的2倍还多；毛利率高达76.63%左右但净利率仅11.51%表现平平——用庞大销售费用堆积起来的高毛利率没有意义
  - company: 上峰水泥
    article: "145497675"
    point: 2019年三季度毛利率51%、净资产收益率38%均为水泥行业第一（高于华新水泥41%/ROE 27%、海螺水泥32%/ROE 20%），毛利率甚至超过卖药的同仁堂（49%）——但高毛利率并未偏离行业（水泥产品毛利率45%，海螺水泥42.5级47%、32.5R级49%，海螺综合毛利率仅32%系占比28%的建材贸易业务毛利率仅0.16%拖累）；高毛利部分源于收入95%来自华东地区、以及较强的成本管控能力，未发现造假迹象
quotes:
  - "毛利就是没有拔过毛的利润，净利就是拔完毛的利润"
  - "有很多毛可以拔的一般是垄断企业或奢侈品企业，没几根毛可以拔的一般是过度竞争的红海企业，特别是地摊货企业"
  - "毛利率异常是判断上市公司财务是否造假的起点"
  - "所以，毛利率忽高忽低的企业，特别是那些毛利率如同过山车的企业，可能是财务造假造成的现象"
  - "要是产品成本正常，主要是靠产品的定价高而导致的高毛利率，那是人家牛逼，产品有品牌、有定价权。要是靠降成本，可能就不太靠谱了"
  - "如果它的毛利率一直远远高于行业毛利率，要是没有独门秘籍，它的毛利率就有可能是假的，要么隐藏了成本，要么虚增了售价"
  - "毛利率太高就会怀疑可能财务做假，太低又说明产品竞争力不强。因此，太高或太低都不正常，这也符合自然规律"
  - "如果一个行业的平均毛利率低于20%，基本上没有什么投资价值。一般而言，平均毛利率至少在30%以上，才表明行业未来的发展有足够的空间"
  - "根据以上四种情况判断上市公司是否进行财务造假的方法，虽然简单粗暴，但是却十分有效"
  - "如果一家企业的毛利率高于45%，净利率高于30%，那么，该企业是非常优秀的，倘若每年还能够基本稳定地保持这样的比率，那就更加优秀了"
  - "毛利率高本身不是问题，毛利率高且资产周转率慢才是问题"
  - "造假公司在虚增利润的同时，往往通过虚增资产来进行平稳，虚增利润导致毛利率异常，虚增资产导致资产周转率异常"
  - "往后，该公司抹平这些“存货”，则可能将这些虚增的存货转移到在建工程、固定资产，以此掩盖利润舞弊的过程"
  - "增值税税负率 = （毛利率-不可抵扣税的成本/收入）×增值税税率"
  - "同期同仁堂的毛利率为49%，一家卖水泥的毛利率竟然比卖药的还高？有没有颠覆你的认知？可见，即使是传统行业，供需逆转后，其盈利水平会达到惊人的水平"
  - "上峰水泥取得高于同行的毛利率，也一定程度反映了该公司较强的成本管控能力"
  - "水泥是一个同质化比较严重的产品，销售价格不会相差太多，而成本管控能力如何则直接反映一个公司的竞争优劣"
