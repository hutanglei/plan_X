name: 总额法vs净额法（收入确认主体判定）
key: gross_vs_net_method
category: 收入质量
alias: [主要责任人与代理人判定, 收入确认方法选择, 净额法, 总额法, 过路财神]
definition: 一句话说透你是"老板"还是"中间商"——货是你自己的、你说了算、砸手里算你的，按总额法，收多少记多少；货是别人的、你只牵个线、赚个佣金，按净额法，只能记那点差价。
formula: >-
  监管判定标准：根据企业在向客户转让商品前是否拥有对该商品的控制权，判断其是主要责任人还是代理人，相应按总额法或净额法确认收入；
  判断是否有控制权时，综合考虑企业是否承担向客户转让商品的主要责任、是否承担存货风险、是否自主决定商品价格；
  马氏"五连问"判定框架：一问存货（货砸手里，损失谁扛）、二问定价（卖多少钱，谁拍板）、三问信用（客户赖账，谁倒霉）、四问供应商（跟谁进货，谁说了算）、五问售后（客户找上门，先找谁赔）。
majinghao_view: |
  同样一笔生意，有的公司入账100块，有的公司只入账5块，利润一分不差，收入却差了20倍——虽然利润一样，可收入是面子，面子能换钱：市销率估值靠它，行业排名靠它，银行授信靠它，于是总额法就成了某些公司报表的"放大器"、营收的"注水肉"。
  联合体牵头人是个法律名头，不是会计名头——你不控货、不担险，凭什么把全桌的菜都记成自己吃的？
  五连问的答案都指向"我自己"，你是真老板，总额法没毛病；都指向"别人"，你就是个跑腿的，乖乖记佣金；五个问题中"担不担责、扛不扛存货风险"分量最重，有些公司精得很，在合同里设计个名义上的"定价权"来遮羞，也改变不了代理人的实质。
  判断到最后就一句大白话：这买卖，是"我在卖自己的东西"，还是"我在帮别人卖"？
  口径还决定可比性：京东自营按总额法，2019年营收5768.88亿元反超按净额法收佣金的平台模式阿里巴巴（5097.11亿元），但净利润118.9亿元对1403.5亿元、毛利率14.63%对44.60%，完全不在一个量级——确认口径不同的公司之间，收入规模、毛利率都不可直接比较，跨公司比较前先对齐收入确认口径。
thresholds:
  healthy: 五连问答案全部指向"我自己"（控货、自主定价、担客户信用风险、自主选定供应商、担售后责任），按总额法确认收入没毛病；纯代理、只赚差价的业务老实按净额法只记佣金
  watch: 毛利率常年比同行低一大截（总额法摊薄毛利率，收入里可能全是"过路财神"）；处于贸易、百货、电商、充电、来料加工、广告营销、互联网平台等监管点名应特别关注的总额法高发行业；收入蹭蹭涨而经营现金流原地踏步、税金和人员也对不上号；合同中存在名义上的"定价权"条款遮羞；与收入确认口径不同的公司直接对比收入规模和毛利率（总额法放大收入、摊薄毛利率，比出来的"低毛利"可能是口径问题而非竞争力问题）
  danger: 明知交易模式、对商品没有控制权仍按总额法确认收入——恒信东方2022年一年虚增营收1.82亿元、占当年披露营收的37.12%，"三分之一的收入是吹出来的"；*ST科林新媒体广告代充值业务按净额法后收入从7072万缩水至353万（缩水95%）
fraud_signals:
  - 五连问现原形：存货砸手里损失谁扛、卖多少钱谁拍板、客户赖账谁倒霉、跟谁进货谁说了算、客户找上门先找谁赔——答案都指向"别人"却按总额法记收入
  - 只干部分活儿（如只做设计、只管报关）却仗着"联合体牵头人"的名头，把采购、施工全桌的菜都记成自己吃的
  - 通过商品购销方式帮境内供应商完成出口报关退税并获取利润，供应商指定客户、公司仅负责交付、承担存货跌价毁损风险极小——业务实质是出口报关退税代理，应按净额法
  - 两道工序中客户指定第二道工序的工艺、供应商并确定报价，公司不能主导该工序方案及价格、也不承担主要责任——对第二道工序应按净额法确认收入
  - 总额法会把毛利率摊薄——一家公司毛利率常年比同行低一大截，收入里可能全是"过路财神"
  - 营收激增的同时，应收、预付异常膨胀——过账的资金总要留下痕迹
  - 财政部财会〔2022〕28号《关于加大审计重点领域关注力度 控制审计风险 进一步有效识别财务舞弊的通知》明确要求关注"不恰当地以总额法代替净额法核算"等收入舞弊情形——官方点名的监管口径
  - 公司以"会计差错更正"名义自曝"本应该按净额法确认收入的代理销售业务却采用总额法计算"（赛特斯公告的差错事项之一），同期还伴有期末一次性确认收入、研发支出应费用化却资本化等差错——差错公告里现原形
cases:
  - company: 汉嘉数智（300746）
    article: "404334629"
    point: 6个EPC联合体项目中明明只干设计的活儿、采购和施工都不归它主导、只收设计费和管理费，却仗着"联合体牵头人"名头按总额法记账，2024年多计收入2.93亿元，不到三年累计多计收入超12亿元，牵出5.81亿元业绩对赌失败
  - company: 恒信东方（300081）
    article: "404334629"
    point: 2022年与创意信息、诺比侃做算力系统集成生意，明知交易模式、对商品没有控制权仍按总额法确认收入，一年虚增营收1.82亿元、占当年披露营收的37.12%，公司被罚500万、时任董事长等四人合计再罚750万
  - company: 立方数科
    article: "404334629"
    point: 三年通过代理业务、融资性贸易虚增收入6.38亿元，直接触及重大违法强制退市
  - company: 际华集团
    article: "404334629"
    point: 四年累计虚增营收约96.6亿元，公司加13名高管合计被罚2320万元
  - company: 万向钱潮
    article: "404334629"
    point: 供应链贸易误用总额法，两年调减营收12.8亿元
  - company: "*ST科林"
    article: "404334629"
    point: 新媒体广告代充值业务7072万元收入按净额法只能确认353万元，缩水95%，最后退市收场
  - company: 京东（自营）vs 阿里巴巴（平台）
    article: "150265931"
    point: 2019年京东营收5768.88亿元超过阿里巴巴的5097.11亿元、与常识不符，原因是收入确认模式不一样：京东自营按总额法、阿里平台收交易佣金按净额法；净利润118.9亿元对1403.5亿元、毛利率14.63%对44.60%完全不在一个量级——总额法放大收入、摊薄毛利率，口径不同的公司财务数据不具备直接可比性
  - company: 赛特斯（832800）
    article: "165153950"
    point: 公告的多项会计差错中自曝"本应该按净额法确认收入的代理销售业务却采用总额法计算"，同期还有维保服务本应在约定服务期限以直线法确认收入却在维保期末一次性确认收入、应该费用化的研发支出却予以资本化等差错——频繁更换会计师事务所（5年3次）叠加密集差错更正，财务数据真实性存疑
quotes:
  - "货是你自己的，你说了算、砸手里算你的——你是老板，按总额法，收多少记多少。"
  - "货是别人的，你就牵个线、赚个佣金——你是中间商，按净额法，只能记那点差价"
  - "牵头人是个法律名头，不是会计名头——你不控货、不担险，凭什么把全桌的菜都记成自己吃的"
  - "五个答案都指向“我自己”，你是真老板，用总额法没毛病；都指向“别人”，对不起，你就是个跑腿的，乖乖记佣金"
  - "有些公司精得很，在合同里设计个名义上的“定价权”来遮羞——猪八戒照镜子，再怎么打扮，也改变不了代理人的实质"
  - "判断到最后就一句大白话：这买卖，是“我在卖自己的东西”，还是“我在帮别人卖"
  - "收入可以被确认方法吹大，现金流不会陪着演戏"
  - "一项只赚5块钱差价的生意，账上记100块收入，不会让公司多创造一分钱价值，只会让看报表的人产生错觉——纸糊的老虎，风一吹就露馅；注水的收入，一查就现原形"
  - "收入的质量，永远比收入的规模重要"
  - "京东采用的是自营模式，在会计上以总额法确认收入，而阿里巴巴采取平台模式，收取的是交易佣金，在会计上以净额法确认收入。两者的商业模式迥异，也导致两者的财务数据不具备直接可比性"
