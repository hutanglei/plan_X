---
name: 增速交叉验证（应收、存货、总资产增速 vs 营收增速）
key: growth_cross
category: 收入质量
alias:
- 成长质量
- 应收账款增速vs营收增速
- 存货增速vs营收增速
- 资产的异常增长
- 报表间撕裂
definition: 真成长的增速链条是经营现金流增速＞净利润增速＞销售收入增速＞净资产增速＞总资产增速；而应收、存货、总资产增速长期高于营收增速，多半不是在成长，而是在藏假——虚增的利润总要有一处资产被撑得变形，格外醒目。
formula: 成长性五指标增速排序：经营现金流增速＞净利润增速＞销售收入增速＞净资产增速＞总资产增速（满足则成长质量较高）； 经营现金流增速＝本年度经营现金流净增加额/上年经营现金流净额×100%；
  净利润增速＝本年度净利润增长额/上年净利润额×100%； 销售收入增速＝本年度销售收入增长额/上年销售收入×100%； 净资产增速＝本年度净资产增长额/年初净资产额×100%；
  总资产增速＝本年度总资产增长额/年初资产总额×100%； 现金循环周期＝存货周转天数＋应收账款周转天数－应付账款周转天数。
majinghao_view: |
  增速难度：经营现金流＞净利润＞销售收入＞净资产＞资产——越靠前的指标越难增长；经营现金流增速＞净利润增速，反映利润质量较高、生产经营具有较强的创现能力；销售收入增速＞净资产增速，说明产品有品牌优势、有护城河、有一定定价权（如贵州茅台、同仁堂）。
  如果应收账款、存货的增长速度在较长时期内明显大于营业收入的增长速度，很可能隐藏着一个真相：应收账款的增长并不是真的增长，而是通过虚构业务或关联方交易虚增了收入；存货的高速增长则可能源于营业收入少结转了成本从而虚增利润。
  总资产的异常增长不是虚增利润的充分条件，但一般情况下是虚增利润的必要条件——但凡巨额虚增利润的公司无一例外地伴随着总资产的大幅增长；虚增资产和利润的最终目的是圈进更多的钱。
  分析成长性时要注意剔除并购因素：收购公司并表之时就是商誉变动之日，并表日到期末的利润表合并进来，这样算出来的销售增速、利润增速"其虚的成分就较大"，市场更喜欢内生增长。
  产能扩张的空间决定了业绩增长的空间：在供不应求的市场状态下，固定资产和在建工程规模就是反映一个公司现有产能和潜在产能的财务指标（英科医疗2020年固定资产同比增长196.95%，带来同行中最大的业绩增幅）；但产能扩张是一把双刃剑，一旦需求反转出现供过于求，过剩的产能必然反噬利润。
  收入增速要看结构：低毛利板块（如医药商业）收入持续下滑会拖累总体收入增速、造成失真，此时要更加关注净利润同比增速而不是收入增速（恩华药业）。
thresholds:
  healthy: 经营现金流增速＞净利润增速＞销售收入增速＞净资产增速＞总资产增速，且各指标为正；连续几年保持30%以上的销售收入增速（成长性很好）；应收账款的变化幅度与营业收入的变化一致；产品得到市场认可后应收账款占营业收入的比例降到20%以下（最好低于15%）；预收账款占营业收入的比例超过5%才具有预测意义，满足比例后预收账款增速同比增加较多，则来年收入同比增加的可能性较大
  watch: 营业收入增速仅为应收账款增速的一半以内——要么销售部门在向下游压货，要么财务部门在造假；应收账款增速快于营收增速但存货未计提跌价准备；总资产增速持续远超营收增速；并购并表贡献的增长（看商誉变动）；备货扩张期的存货增长需结合销售收现增速与采购付现增速甄别真伪；净资产增速为负——资本受到侵蚀、股东利益受损；应收账款和存货占总资产比例过高（超40%）且现金循环周期持续拉长——利润被营运资金占用，注意减值风险；原材料战略储备（如中药企业囤药材）导致的存货高增长，需结合存货结构与周转天数甄别真伪；产能激进扩张（在建工程激增）若遇需求反转，过剩产能将反噬利润
  danger: 应收账款连年超过营业收入（回款速度慢、经营效率低、拿客户信用风险博利润）；应收账款四年增长13.8倍而同期营收仅增5.2倍（海光信息）；存货单年激增405%（海光信息2024年）；(应收账款+合同资产)/总资产大于20%的公司需要淘汰掉
fraud_signals:
- 应收账款、存货的增长速度在较长时期内明显大于营业收入的增长速度——应收账款可能通过虚构业务或关联方交易虚增了收入，存货高增长可能是少结转成本虚增利润
- 虚增利润必然通过总资产大幅增长来消化——总资产异常增长是虚增利润的必要条件（非充分条件），可作提示性指标；在资产中夸大存货和在建工程，既难以计量又营造出业绩上升的未来预期
- 在建工程像"三峡工程"一样几年不完工且年年增加——要么工程项目是虚假的，要么迟迟不转固以不计提折旧、便于将各种费用装进在建工程虚增当期盈利
- 账面收入利润年年增长、固定资产投资不停，但固定资产周转率低于同类公司、相同产值的投入是同行的几倍——极可能固定资产项目存在虚构，目的是平衡利润表中虚增的收入、利润
- 经营现金流净额由正转负时看三处：应收项目增长幅度较大（产品走弱、盈利质量变差）、应付项目下降幅度较大（产业链地位下降、现金流压力攀升）、存货增长幅度较大（滞销、出清压力大）
- 合同负债骤降与存货暴增的组合——"求着买"变"赊着卖"，负债端的确定性与资产端的风险敞口发生根本性换位
- 只要造假任何资产都存在虚增的可能，可用用电量、运输费用与产品销量、产能与销量、人均创收创利与企业地位的匹配性交叉验证
- 预收账款与存货双高（推迟确认收入可能性大）；预收账款增速与毛利率、存货周转率、应收账款周转率、营业收入增速的变动趋势严重背离——要高度警惕财务造假
- 应收账款增速持续高于收入增速，随后坏账准备计提比例反而大幅提高——警惕管理层利用加大计提对此前虚增的收入“毁尸灭迹”
cases:
- company: 海光信息
  article: '406258402'
  point: 应收账款从2021年2.73亿元增至2025年40.34亿元、四年增长13.8倍（同期营收仅增5.2倍），增速连续四年跑赢营收（2022年+256.13%
    vs 营收+121.83%；2025年+77.3% vs +56.92%）；存货2024年激增405.09%至54.25亿元，现金循环周期从186天翻倍至375天
- company: 中际旭创（300308）
  article: '396055275'
  point: 2026Q1应收账款95.36亿元（同比+98%）、存货156.72亿元（同比+100%）、营运资金占用高达252亿元——账面利润丰厚但回款放缓，净利润现金含量从136.74%骤降至58.72%
- company: 寒武纪
  article: '404266285'
  point: 利润现金背离的"非造假"情形：净现比0.13，但销售收现74.52亿元同比+85%回款不差，出血点在采购付现59.97亿元同比+125%、比营收+108%还快——是"豪赌备货"信号而非收入确认激进（82.48亿存货占总资产45%）
- company: 乐视网
  article: '261407963'
  point: 总资产从2010年到2016年底达到峰值，年复合增长率78%——巨额虚增利润的公司无一例外伴随总资产的大幅增长
- company: 辅仁药业
  article: '261407963'
  point: 1997年上市至2018年从未分红，真要分红时账上只有区区378万元可用资金、没法完成6272万元现金分红的划转——"真是蠢到忘记自己造假了"
- company: 北京新时空科技
  article: '353560043'
  point: 2018年IPO被否：应收账款增长较快、存货也大幅上升，并且未计提存货跌价准备，未能说明原因及合理性
- company: 英科医疗（300677）
  article: '179658740'
  point: 固定资产从2019年9亿元猛增至2020年27亿元（同比增长196.95%），产能扩张的空间决定了业绩增长的空间，带来同行中最大业绩增幅；但产能扩张是双刃剑，一次性手套产能从190亿只增至360亿只、再启超1800亿只扩产计划，需求反转时过剩产能将反噬利润
- company: 国恩股份
  article: '179542839'
  point: 上市5年收入复合增速57.12%，但应收账款复合增速35.35%、存货复合增速50.66%；5年净现比仅0.16，未分配利润增加15.22亿元与应收、存货增加额相当——赚取的利润基本都凝结在应收账款和存货里，两者合计占总资产近50%
- company: 赛特斯
  article: '165153950'
  point: 2018年之后应收账款增速均显著高于营业收入增速（2020上半年收入同比-30.2%而应收账款+13.28%）；五年净现比仅0.16，五年里只赚了一堆应收账款，应收账款占总资产31.96%、周转天数536天
- company: 中远海科
  article: '148975062'
  point: 预收账款增速持续50%以上、占营业收入35%以上，但2017、2018年收入增速仅5.69%、6.88%；存货增速与预收账款基本同步、存货周转天数从73.78天升至373.82天——预收账款和存货双高，涉嫌通过预收账款和存货进行收入操纵
- company: 片仔癀
  article: '150168739'
  point: 非造假情形：十年净现比仅0.38，存货增速超收入增速的年份有6个——存货高增长源于麝香、牛黄等原材料战略储备（原材料占存货63%），且存货周转天数逐年下降并未恶化，属经营模式而非造假
- company: 大康农业
  article: 132756673
  point: 营收从2014年5.85亿暴增至2018年133.9亿（超20倍），扣非净利却恶化至-8.31亿——增速与行业和利润严重背离即造假信号。
quotes:
- 如果经营现金流增速>净利润增速>销售收入增速>净资产增速>总资产增速，则该企业的成长质量较高
- 增速难度：经营现金流＞净利润＞销售收入＞净资产＞资产
- 如果你发现一家上市公司的应收账款、存货的增长速度在较长时期内明显大于营业收入的增长速度，那么这里面很有可能就隐藏着一个真相，即应收账款的增长并不是真的增长，而是可能通过虚构业务或关联方交易等，通过应收账款虚增了收入。而存货的高速增长可能源于营业收入少结转了成本从而虚增利润所导致
- 总资产的异常增长不是虚增利润的充分条件，但一般情况下是虚增利润的必要条件，可以作为判断企业虚增利润的提示性指标
- 正常情况下，应收账款的变化幅度应与营业收入的变化一致。如果应收账款增速高于营业收入的增速，可能是因为公司放宽信用条件以刺激销售；与此同时，如果存货余额居高不下，可能公司人为通过“应收账款”科目虚构营业收入
- 对于应收账款已经连年超过营业收入的上市公司要高度关注
- 只要造假，任何资产都存在虚增的可能。同样，只要虚增就会有异常信息
- 存货要么变成收入，要么变成减值；现金流要么追上利润，要么戳破利润
- 在供不应求的市场状态下，可以说产能扩张的空间决定了业绩增长的空间
- 产能扩张是一把双刃剑，如果未来疫情好转，行业需求反转，出现供过于求，过剩的产能必然会成为一个累赘，反噬公司利润
- 拉长历史周期看，预收账款与营业收入的比例应该是稳定的，如果忽高忽低，大幅波动，则预收账款造假的可能性大
- 一般情况下，预收账款占营业收入的比例要超过5%才具有预测意义，比例太小的预收账款不具有参考意义
- 我们必须清楚的是：即使是在一个快速发展的市场，行业领先的公司业绩增长其实也是在围绕行业增长速度一定幅度范围内的，一般不会过于离谱。因此，如果一家企业的主营收入增长率与可比对象或行业的趋势、平均水平偏离较大，通常就是财务粉饰的信号。
- 如果一家企业营收增长，但获利不仅没有增长反而出现负增长，表明该企业在盲目追求成长中失去对成本的控制，为“增长而增长”；如果一家企业营收及获利均增长，而经营活动的现金流却持续萎缩，甚至出现负现金流，表明该企业没有好好控制应收账款或存货的增加，造成劣质成长，严重的话，会引发财务危机。
- 如果企业呈现：1.主营业务收入持续增长；2.利润增长率超过主营业务收入增长率；3.经营活动现金流与利润数额相差在20%之间；4.经营活动现金流与投资活动现金流之和为正，并持续增长；5.财务费用比率持续下降。就可以基本上判断这家企业非常好，有很大的发展潜力！
