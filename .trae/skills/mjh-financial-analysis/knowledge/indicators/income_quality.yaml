name: 利润质量与收入含金量
key: income_quality
category: 收入质量
alias: [收入含金量, 利润含金量, 净现比, 收现比, 含金量指数, 白条收入, 纸面富贵]
definition: 利润反映的是一家企业经营成果"应该是什么"，经营现金流反映的是"实际是什么"——利润中最终有多少能转化为真金白银，就是利润的含金量；客户拿了东西、钱还在客户手中堆出来的应收账款，是"白条收入"，没有现金流入。
formula: >-
  营业收入现金含量（收现比）＝[销售商品、提供劳务收到的现金/（1+增值税税率）]/营业收入，大于1说明营收收现比率高、营收含金量高（现金流量表中"销售商品、提供劳务收到的现金"包含增值税，因此要扣除）；
  净利润的含金量＝经营活动产生的现金流量净额＋取得投资收益收到的现金－财务费用（＋处置长期资产溢余现金）；
  含金量指数＝净利润的含金量/净利润；
  马氏定律（净现比）＝经营活动现金流量净额/净利润（较长周期10年观察）；
  核心利润＝营业收入－营业成本－营业税金及附加－销售费用－管理费用－财务费用（＝毛利－三费总和－营业税金及附加）；
  应收账款/营业收入（仅适用于同行业之间对比，比值越高说明收入含金量越低）；
  占用上下游资金能力＝[(应付票据+应付账款+预收账款+合同负债)－(应收票据+应收账款+应收款项融资+预付账款+合同资产)]/营业收入。
majinghao_view: |
  以收付实现制为基础编制的现金流量表，可以称为"利润的测谎仪"；净利润持续高于经营活动产生的现金流量净额，往往说明利润是假的，属于典型的"纸面富贵"，这种富贵难以为继，公司只能依赖外部筹资补充现金缺口，最终必然遭遇资金链断裂的厄运。
  虚增的利润必然要在资产负债表中通过虚增资产来消化——应收账款、存货、预付账款、在建工程、固定资产等几乎所有的资产项目；不能转化为现金流的利润所形成的"资产"，以后多半会通过资产减值来化解。
  没有现金流支持的利润是假利润，没有利润支持的销售是有害销售；没利润有现金，可以活，有利润没现金，不可活。
thresholds:
  healthy: 净现比（10年较长周期）大于1，报表上每赚1块、账户里真进1块以上；营业收入现金含量大于1；核心利润/营业利润＞80%（利润结构健康，刨除了资产减值损失、投资收益和营业外收入等）；财务费用连续多年为负数（有钱存放银行赚取利息，表明盈利能力强、净利润含金量高、现金流好）
  watch: 净现比长期低于1但高于0.7——净现比低不一定直接等同于造假，重资产、扩张期企业可能因业务模式或经营周期阶段性偏低（如扩张期现金被营运资本"吃掉"的备货模式）；归母净利润与扣非净利润差额大（公允价值变动浮盈等非经常性收益，是"纸面富贵"）；应收账款/营业收入占比在行业内升高
  danger: 含金量指数低于30%——盈利质量很差，甚至根本不是盈利而是利润造假；净现比低于0.7存在利润造假可能性、低于0.5可以判断其利润造假（马氏定律）；应收账款连年超过营业收入；(应收账款+合同资产)/总资产大于20%的公司需要淘汰掉
fraud_signals:
  - 虚构收入的上市公司往往表现为应收账款急剧增加、应收账款周转率急剧下降
  - 营业收入增速仅为应收账款增速的一半以内——要么公司销售部门在向下游压货，要么公司财务部门在造假
  - 应收账款和销售收入大幅增长，但应付账款却不增长或增长很低——销售收入很可能并没有真实增长而是虚构的，应付账款暴露了公司的真实经营情况
  - 上市公司先把资金打出去（挂其他应收款或预付账款），再叫客户把资金打回来冲销应收账款——存在较大金额的其他应收款、预付账款时要分析是不是隐藏的应收账款，多半是造假形成的、永远没有可能收回的
  - 假销售把戏：找一个托，做一笔分录——借应收账款，贷营业收入、应交税费-销项税额；要多少利润就有多少利润，空留下应收账款"象个寡妇，最终坏账处理拉倒"
  - 业绩暴雷如果是由于计提应收账款减值损失导致——多半是收入造假所为
  - 净利润持续高于经营活动现金流量净额——往往说明利润是假的
  - 虚增利润必伴随虚增资产（应收账款、存货、预付账款、在建工程、固定资产等），资产肿胀下的净利润是不可信的
  - 权责发生制让利润摆脱了现金流的束缚——利润表可以做得很漂亮，最后却可能发生财务危机甚至资金链断裂破产，必须再用现金流量表验证利润有没有转化为真实的现金流
  - 虚增收入和利润必须付出真金白银的税收代价——为不穿帮需及时缴纳至少占收入2成以上的税收，吹牛也要上税，税金与收入的匹配性可作交叉验证
  - 企业收入增长了，按业内“工资/收入”比例工资支出也要相应增长——虚增的收入无法发工资，造“工资”这个假的成本至少要占虚增收入5成以上，现金流差的公司没有实力这么做
  - 虚增货币资金无法产生利息收入——用利息收入/货币资金平均余额计算资金收益率并与七天通知存款利率比较，明显偏低即异常；货币资金很多同时有息负债也非常多，即“大存大贷”
  - 频繁更换会计师事务所、年报未按规定时限披露、连续公告多项会计差错——多个不祥信号叠加，财务数据真实性存疑，不少公司拿“会计差错”当挡箭牌行财务造假之实
  - 虚增收入实增货币资金、虚增预付账款或其他应收款等流动资产的升级造假——钱转到关联方再以经营活动现金流入回流，收现比和净现比都会失效，要警惕预付账款和其他应收款余额特别高且没有合理解释的企业
  - 营业税金及附加应随收入增长而增长——城建税、教育费附加以增值税为计税依据，收入增长而税金及附加下降的背离提示开票收入可能存疑
cases:
  - company: 源杰科技（688498）
    article: "401478551"
    point: 2026Q1归母净利润1.79亿元而经营活动现金流净额只有3965万元、净利润现金含量约22%；归母与扣非之间约1亿元差额来自私募基金公允价值变动收益——账面浮盈"不产生一分钱现金流"，要评估真实盈利能力应以扣非口径为锚
  - company: 海光信息
    article: "406258402"
    point: 净现比轨迹2021年182.81%→2022年-5.38%→2023年64.42%→2024年50.60%→2025年82.40%→2026H1为-23.77%，六年中没有任何一年触及100%的充分印证线——账面利润始终未被现金完全验证，且两次转负均精确对应"备货扩张"期间
  - company: 北京新时空科技
    article: "353560043"
    point: 2018年IPO被否：应收账款增长较快、存货也大幅上升，并且未计提存货跌价准备，未能向发审委很好地说明其原因及合理性
  - company: 五粮液
    article: "334823601"
    point: 正面案例：上半年经营活动产生的现金流量净额约113.3亿元、上年同期为18.87亿元、同比增长500.39%——现金回款比例提高、销售商品提供劳务收到的现金大幅增加，利润含金量高
  - company: 贵州茅台、海天味业
    article: "267414411"
    point: 正面案例：像这样的现金牛，历史累积分红非常可观——用上市以来历史累积分红可看出一家公司能否持续创造盈利和现金
  - company: 华润三九
    article: "145669254"
    point: 本期归属净利润同比+47.51%、扣非净利润却同比-4.11%，出现背离；归属净利润21亿元而扣非仅12亿元（扣非/归属=57.14%），4成利润由非经常性损益贡献（非流动资产处置损益7.6亿元、政府补助2亿元）——主业只贡献不到6成利润，利润质量不高，靠出售深圳三九医院82.89%股权来提振补足。
  - company: 同仁堂
    article: "144814837"
    point: 正面案例：本期收现比1.05（一元收入实际收到1.03元现金），2016-2018年收现比均大于1；净现比2.21（1元净利润实际流入2.21元现金）——销售回款质量和净利润质量都很高，经营活动现金净流量同比增长23.47%，远好于归属净利润0.04%的增速。
quotes:
  - "以收付实现制为基础编制的现金流量表，可以称为“利润的测谎仪"
  - "如果净利润的含金量很低甚至为负，属于典型的“纸面富贵”，因为净利润持续高于经营活动产生的现金流量净额，往往说明利润是假的"
  - "利润反映的是一家企业的经营成果“应该是什么”；经营现金流反映的是一家企业的经营成果“实际是什么"
  - "从较长周期来看（10年），经营活动现金流量净额/净利润（净现比）应该大于1。如果净现比低于0.7，则存在利润造假的可能性；如果低于0.5，则可以判断其利润造假"
  - "如果含金量指数低于30%以下，说明盈利质量是很差的，甚至根本就不是什么盈利，而是利润造假"
  - "没有现金流支持的利润就不算利润，没有利润支持的销售额就不算销售额"
  - "没有现金流支持的利润是假利润，而且还有可能进一步损害企业现金流；没有利润支持的销售是有害销售，销得越多，亏得越大"
  - "没利润有现金，可以活，有利润没现金，不可活"
  - "这些营业收入纯属白条收入，没有现金流入"
  - "一个真正优秀的企业，其未呈现为现金的利润是可以大量变现的。"
  - "而一个财务造假的企业，其未呈现为现金的“利润”基本上是不可能变现的"
