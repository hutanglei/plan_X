name: 无形资产
key: intangibles
category: 资产质量
alias: [研发支出资本化, 开发支出, 摊销, 采矿权探矿权, 土地使用权, 影视版权]
definition: 无形资产是看不到它变旧的资产（所以叫摊销不叫折旧）；好比爱情——研发成功打了结婚证才转入无形资产，资产负债表日（结婚纪念日）要做减值测试。“开发支出”是无形资产的半成品——资产负债表“开发支出”栏目按“研发支出—资本化支出”科目账面余额填列，如果说在建工程是某些固定资产的前世今生，研发支出-资本化支出就是某些无形资产的前世今生（资本化支出达到预定用途形成无形资产后转出，转出前一直挂账）。土地使用权是无形资产中的特殊硬资产——到银行办理抵押贷款，银行看重的抵押物除了房产外就数土地使用权，其会计处理横跨无形资产、固定资产、投资性房地产、开发产品四个科目。
formula: 无统一计算公式。识别口径：资产减值损失越大表明资产质量越差（含无形资产减值）；与企业经营有关的资产合计中包含无形资产、开发支出，其占总资产比例越高越好。摊销费用＝（无形资产初始价值－残值）/使用年限（企业可通过选择摊销方法、拉长摊销年限、高估残值来“管理”利润）。IPO红线口径（早期文新增）：《首次公开发行股票并上市管理办法》第26条第4款规定“最近一期末无形资产（扣除土地使用权、水面养殖权和采矿权等后）占净资产的比例不高于20%”，且证监会审核口径中该“无形资产”＝报表无形资产＋商誉合计数额。研发支出科目结构：下设“费用化支出”（每月月末转入管理费用）与“资本化支出”（达到预定用途形成无形资产后转出，转出前余额填列资产负债表“开发支出”栏目）两个二级科目。
majinghao_view: |
  他批判费用资本化是“一个公然进行财务造假的概念”：费用本应计到利润表却计到资产负债表，不敢说“费用资产化”而搞出“资本化”的概念来迷惑大家——研发费用资本化有“三美”：一美化利润，二美化资产，三美化现金流（一个亿研发支出资本化，凭空多一个亿利润、总资产增加一个亿、经营活动现金流虚高一个亿）。
  摊销和折旧是会计的两大黑魔法：都是主观估计，只要故事讲得通就很难找到会计舞弊证据，企业可借选择摊销方法/年限/残值操纵利润；无形资产计提的减值准备不能转回。
  将没有成熟的技术或专利计入无形资产，等于将费用记作资产——形不成资产的费用终归是费用，不是资产的“资产”都得通过“大洗澡”减值恢复本来面目（乐视网长期60%左右研发费用资本化、2017年影视版权类无形资产减值32.8亿元）。
  对资源类无形资产要盯住“账面资源”的估值假设：神华并购带进来的采矿权、探矿权值多少钱取决于未来煤价中枢假设——煤价涨它们是金山，煤价跌它们就是减值测试表上最敏感的参数。
thresholds:
  healthy: 资产减值损失极小（含无形资产减值），经营稳健的概率较高；资产负债表结构稳定，无形资产无大级别变动。
  watch: 研发支出资本化比例高（费用化改资本化的三美动机）；研发费用资本化比例长期畸高（乐视网长期连续60%左右极其不正常）；扣除土地使用权等后的无形资产（＋商誉）占净资产比例向20%红线逼近（证监会IPO审核即按此口径，某公司40%以上被否）；“开发支出”半成品长期挂账不转无形资产；无形资产、开发支出在总资产中占比快速上升；拉长摊销年限、高估残值。
  danger: 扣除土地使用权后的无形资产＋商誉占净资产比例超过20%（某拟IPO企业因高达40%以上远超规定被否）；将没有成熟的技术或专利资本化计入无形资产，最终只能巨额减值“大洗澡”恢复本来面目；无形资产巨额减值（巨额计提就要问资产到底存在不存在）；使用寿命不确定的无形资产不摊销、长期挂账；采矿权探矿权等“账面资源”占比畸高而有形资产占比骤降（价值高度依赖商品价格中枢假设）。
fraud_signals:
  - 研发费用资本化三美：虚增利润、虚增资产、虚增经营活动现金流量——资本化研发投入的现金流出不记在经营性现金流出里。
  - 摊销操纵利润：选择直线法/加速法、故意拉长摊销年限、高估残值降低摊销费用，让每年汇报的利润多一些。
  - 高级造假转移路径：虚增收入转为银行存款后再转化为在建工程、无形资产、长期股权投资，审计更难查。
  - 无形资产摊销与减值可被用来消化虚增资产：资产减值准则客观上为虚增资产开了方便之门，任何异常大额的资产减值都要警惕背后财务造假的可能。
  - 账面资源估值假设：并购并入的采矿权、探矿权类无形资产价值取决于煤价等商品价格中枢假设，价格下跌时是减值测试表上最敏感的参数，并购做大资产的同时要做实质量。
  - IPO口径红线（早期文新增）：证监会审核口径下“扣除土地使用权、水面养殖权和采矿权等后的无形资产＋商誉”合计占净资产不得高于20%——某拟IPO企业因该比例高达40%以上远超规定被否；分析上市公司同样可用该比例衡量无形资产＋商誉对净资产的侵蚀。
  - 开发支出半成品挂账（早期文新增）：研发支出—资本化支出余额长期挂在资产负债表“开发支出”栏目——它是无形资产的“在建工程”，何时转入无形资产、成色如何均由企业掌握，既是利润蓄水池也是费用藏身处。
  - 不成熟技术专利资本化（早期文新增）：将没有成熟的技术或者专利计入到无形资产里，等于将费用记作无形资产——这些实际上形不成资产的费用最终还是费用，无形资产减值就不可避免，最终都得通过“大洗澡”减值恢复本来面目。
cases:
  - company: 中国神华
    article: 408983763
    point: 2026年中报无形资产两年内翻倍达1,298.63亿元、有形资产占总资产比重从48%骤降到33%——并购进来的12家公司带进来的主要是采矿权、探矿权这类“账面上的资源”，值多少钱取决于未来煤价中枢的假设。
  - company: 乐视网
    article: 215986572
    point: 长期连续60%左右研发费用资本化极其不正常（贾跃亭会计出身、操作游刃有余）；2017年报显示无形资产（主要是影视版权类资产）减值损失32.8亿元，亏得一塌糊涂；退市时总市值7.18亿元，较高峰时1700亿元市值毁灭99%以上。
  - company: 汤臣倍健
    article: 144814522
    point: 2018年收购LSG除形成21.66亿元商誉外，还形成14.14亿元无形资产——既不是专利也不是软件，而是确认的商标品牌10.77亿元＋客户关系3.37亿元，占2018年度无形资产总额15.63亿元的90.46%（超9成无形资产因合并LSG形成，而2017年度无形资产仅1.84亿元）；2019年计提5.62亿元无形资产减值准备——商誉之外，无形资产是同一笔并购里更隐蔽的第二个"减值雷"。
quotes:
  - "在原理上都是一样的，都是将资产损耗的价值转入到利润表的方法，在我看来，固定资产是看得见它变旧的，所以叫折旧；无形资产看不到它变旧，所以叫摊销"
  - "会计准则中的“费用资本化”是一个公然进行财务造假的概念，你把费用记作了“资产”，却不敢说“费用资产化”，搞出一个“资本化”的概念来迷惑大家，是从文字上隐蔽它是一个对财务信息扭曲很大的造假方式"
  - "我总结“将研发费用资本化”有三美：一美化利润，二美化资产，三美化现金流"
  - "摊销和折旧都是一种估计，是企业觉得这部分减值了，应该算作成本。既然是估计，就带了灰色的空间。因为估计都是主观的，只要你的故事讲得通，就很难找到会计舞弊的证据"
  - "并进来的12家公司，带进来的主要是采矿权、探矿权这类“账面上的资源”。这些资产值多少钱，取决于未来煤价中枢的假设——煤价涨，它们是金山；煤价跌，它们就是减值测试表上最敏感的参数"
  - "资产是可以延伸到未来灭失的费用；费用是现时灭失的资产"
  - "通常来说，资产减值损失越大，表明企业的资产质量越差；反之，资产减值损失越小，表明企业的资产质量越好"
  - "如果说在建工程是某些固定资产的前世今生，那么研发支出-资本化支出就是某些无形资产的前世今生"
  - "乐视网长期以来连续60%左右的研发费用资本化是极其不正常的"
  - "将没有成熟的技术或者专利计入到无形资产里，等于是将费用记作了无形资产，这些实际上形不成资产的费用最终还是费用，无形资产减值就不可避免了"
  - "是资产就是资产，是费用终归是费用，不是资产的“资产”都得通过“大洗澡”减值，恢复其本来面目"
