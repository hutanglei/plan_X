---
name: 资产有息负债率
key: interest_bearing_debt
category: 偿债能力
alias:
- 有息负债率
- 带息负债率
- 净财务杠杆
definition: 一家企业的总资产中，有多少比例的资产是向银行等金融机构以支付利息等方式借入的债务——马靖昊称之为"更有价值的负债率"、比资产负债率更管用的"真正的资产负债率"，因为它避免了预收账款、应付账款等不付利息的软性债务对指标的干扰。
formula: 资产有息负债率＝（短期借款＋1年内到期的长期负债＋长期借款＋应付债券＋长期应付款）÷总资产×100%，应和同时期、同行业的其他企业比较。 更准确的财务杠杆（只用有息负债）：财务杠杆＝（短期借款＋一年内到期的长期负债＋长期借款＋长期债券）÷所有者权益，大于1时风险偏大——无息负债没有固定成本、没有杠杆作用，不应计入财务杠杆。
  净财务杠杆＝有息负债÷股东权益，更能准确衡量企业的财务风险。
majinghao_view: |
  无息负债是本事——通过欠产业链上下游的钱做自己的生意，多多益善；有息负债是担子——特点就是负债越多需支付的资金费用越高，有息借款还不起将面临现金流断裂的风险。
  有息负债的成本一般情况至少是6%，无息负债的成本是0：当总资产收益率回落低于6%时，有息负债就是累赘（大部分上市公司总资产收益率达不到6%）；无息负债没有利息吞噬利润的后顾之忧，可以运用更高的财务杠杆。
  企业稳健的筹资战略，应主要来自充分利用上下游的无息经营负债和利润形成的留存收益；不缺钱、不借债才真牛——较低的负债水平、几乎为0的长期借款一般是优秀上市公司的财务特征（苹果公司曾很长时间没有有息负债）。
  能够产生自由现金流的公司通常不会借贷经营——若一家上市公司能产生自由现金流却拥有需支付大笔利息费用的长期借款，就要怀疑其自由现金流是否真实可靠。
  有息负债与无息负债对利润的影响完全不同：前者通过财务费用减少利润，后者不直接减少利润——所以企业在降低负债率时应当重点减少有息负债、而不是无息负债，这对利润增长或扭亏为盈具有重大意义。
  根据杜邦公式（净资产收益率＝销售净利率×总资产周转率×财务杠杆），无息负债没有利息吞噬利润的后顾之忧、可以运用更高的财务杠杆，此类公司可拥有更高的净资产收益率、享受更高的估值；反过来，就要警惕有大量有息负债的高净资产收益率的企业。
  财务杠杆既可以为正、也可以为负：投资收益率小于负债利率即负财务杠杆——债务管理使每股收益下降，负债所产生的利润不足以弥补所需支付的利息，从而导致资金链断裂；负财务杠杆是不能用的，除非傻大胆，或冒险进行投机融资甚至庞氏融资。好公司一般不需要借钱，能在极低负债率下还拥有亮眼利润的公司才值得投资。
thresholds:
  healthy: 越低越好，0最优秀（负债基本来自对供应商的赊账和客户的预收账款，靠无偿占用上下游资金就足以满足营运资产需要，账面还趴着巨额现金，质地非常优秀）；利息支出占营业收入比例最低（有息负债率最低）的企业往往最具有持续竞争优势
  watch: 有息负债超过总资产的六成，企业算比较激进，承受宏观环境变化、行业变化的能力较弱，遇到宏观或行业突变陷入困境的可能性较大
  danger: 财务杠杆（有息负债÷所有者权益）大于1时风险偏大；要支付几十亿财务成本且超过净利润的公司"都烂得很"；总资产收益率低于6%时（有息负债成累赘）；投资收益率低于有息负债利率（负财务杠杆）——负债利润不足以弥补利息、资金链断裂
fraud_signals:
- 有息负债占总资产的比例提升迅速，但资产周转率没有提升、毛利率/净利润/净资产收益率等盈利指标也没有明显改善——资金使用效率不高，业务或项目可能出问题，未来偿债能力可能出大问题
- 财务费用占净利润的比例超过50%且已持续好几年——企业在为银行打工、偿债能力出了问题，这些贷款是靠银行借新还旧一路走过来的
- 有自由现金流却拥有大笔付息长期借款——要怀疑自由现金流是否真实可靠
- 要警惕有大量有息负债的高净资产收益率的企业——有息负债存在利息吞噬利润的后顾之忧，高ROE若靠有息财务杠杆撑起来，风险很大
- 支付利息的现金有一部分来自筹资活动流入的现金，即"庞氏利息"——恒大2016—2020年五年经营+投资自由现金流累计-4,190亿元、全靠筹资净流入+4,746亿元维持付息分红，还用利息资本化把利息藏进资产
cases:
- company: 千山药机
  article: '282844478'
  point: 资产负债率176%的同时资产有息负债率高达114%、背离程度低，资不抵债，2019年4月暂停上市、2020年9月16日被深交所摘牌
- company: 苹果公司
  article: '271057749'
  point: 曾经很长一段时间一直没有有息负债——钱多到根本不需要贷款支付利息费用，"难道它傻吗？！"
- company: 海南航空
  article: '280450854'
  point: 2000—2012连续13年财务费用占净利润比例超50%，一直在替银行打工、偿债能力一直有问题，海航后来的结局充分验证了疑问
- company: 中国神华
  article: '408983763'
  point: 有息负债率52.94%，带息债务占全部投入资本从12.5%翻到30.33%，财务费用上半年16.41亿、同比暴增759%——从"存款大户"变成"贷款大户"
- company: 中国恒大
  article: '407156353'
  point: 2017—2020年将累计2,252亿元利息资本化计入"开发中物业"而非当期费用，2020年末开发中物业中利息资本化余额高达1,697亿元——用会计技术把利息藏进资产，掩护庞氏利息
- company: 宁德时代
  article: '199733401'
  point: 无息负债高、可同时占用上下游企业资金——马靖昊将自身造血能力强、有息负债低的贵州茅台与强势占用上下游的宁德时代并称为"资本市场中的两个标杆公司，上市公司里的两大王牌企业"
- company: 老干妈
  article: '199733401'
  point: 现金流好得不得了、不要贷款也不愿上市——加速流动资金的周转，提高变现能力，用钱来赚钱
- company: 一丁集团
  article: '227717128'
  point: 曾经的百强连锁企业破产，老板吴建荣跑路前总结三点失败经验（永远不要跟银行借钱、永远不要向民间借贷、量力而行）——马靖昊点评：问题不在借钱本身，而在投资收益率小于负债利率，负债所产生的利润不足以弥补所需支付的利息，从而导致资金链断裂
- company: 比亚迪
  article: 140745765
  point: 2019年前三季度营收938.22亿元(+5.44%)；三季度末有息负债合计约795亿元（其中短期560多亿元），财务费用攀升，偿债压力和资金链面临考验。
- company: 巴安水务
  article: 140745765
  point: 截至当年三季度末有息负债合计20.67亿元，货币资金仅6.57亿元，有息负债现金覆盖率仅31.8%，债务规模高、财务风险大，财务费用侵蚀利润。
quotes:
- 在财务分析的运用中，可以说，资产有息负债率比资产负债率更管用
- 并非所有的负债都是风险，企业的预收账款、合同负债以及占用的应付账款多多益善，但有息负债越少越好，因为有息借款还不起，企业将面临现金流断裂的风险
- 企业不缺钱、不借债才真牛！最终，企业的核心竞争力是完胜财务杠杆的
- 较低的负债水平，几乎为0的长期借款一般都是优秀上市公司的财务特征
- 和同行业的其他公司相比，那些利息支出占营业收入比例最低的公司，也就是有息负债率最低的企业，往往是最具有持续竞争优势的
- 苹果公司曾经很长一段时间就一直没有有息负债，难道它傻吗？！只要有足够的钱，干吗要负债去支付利息？！用自己的钱，将利息节省下来不是更香吗
- 由于无息负债没有利息吞噬利润的后顾之忧，因此，在无息负债上可以运用更高的财务杠杆。根据杜邦公式，净资产收益率＝销售净利率×总资产周转率×财务杠杆，此类公司可以拥有更高的净资产收益率，从而享受更高的估值
- 同理，有息负债存在利息吞噬利润的后顾之忧，因此，要警惕有大量有息负债的高净资产收益率的企业
- 真正的好公司还考虑什么财务杠杆呢？还考虑什么适度负债以维持一个最优资本结构呢？钱多到根本就不需要贷款支付利息费用不是更牛逼吗
- 财务杠杆既可以为正，也可以为负，负财务杠杆是不能用的，除非你是傻大胆，或你冒险进行投机融资，甚至庞氏融资
- 好公司一般是不需要借钱的。如果一个公司能够在极低的负债率下还拥有亮眼的利润，那么这个公司是值得投资的
- 我认为，由于无息负债没有固定的成本，没有杠杆作用，不应计入到财务杠杆中。因此，有息负债与所有者权益的比才是更加准确的财务杠杆。即财务杠杆＝(短期借款+一年内到期的长期负债+长期借款+长期债券)/所有者权益，该指标大于1时，风险偏大。
- 有息负债现金覆盖率=货币资金/有息负债，这个比率主要用来分析公司是否存在债务危机。一个财务稳健的公司，其货币资金应该能够覆盖有息负债。
