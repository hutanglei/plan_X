name: 已获利息倍数
key: interest_cover
category: 偿债能力
alias: [利息保障倍数, 利息覆盖倍数, 现金利息保障倍数]
definition: 未扣除借款利息的利润总额能够多大程度覆盖借款利息——息税前利润是利息支出的多少倍，衡量企业长期偿债（付息）能力；马靖昊用它时最强调"变化斜率比绝对值更可怕"。
formula: >-
  利息保障倍数＝息税前利润÷利息支出＝（净利润＋利息费用＋所得税费用）÷利息费用。
  口径要求：公式中的"利息费用"是指本期发生的全部应付利息，不仅包括财务费用中的利息费用，还应包括计入所有的资本化利息——漏算资本化利息会高估倍数。
  马靖昊建议的现金口径：因净利润"说不清楚"，实务中建议改用现金利息保障倍数＝息税前经营现金净流量（经营活动现金净流量＋营业税支付的现金＋利息支付的现金）÷利息费用。
majinghao_view: |
  他用这个指标最核心的提示是"变化斜率比绝对值更可怕"：神华已获利息倍数从2024年上半年的1,183倍，跌到2025年上半年的198倍，再跌到2026年上半年的28.7倍——28.7倍绝对安全，但从1,183倍到28.7倍不是"安全水平"的问题，是"变化斜率"的问题。
  指标的分子、分母都建立在利润口径之上，而实际支付利息需要付出真正的现金流——利润与经营现金流背离较大时，指标再高也不能说明企业有足够的现金来偿还利息，所以建议改用现金利息保障倍数。
  巴菲特非常青睐利息支出占息税前利润比率很低（利息保障倍数很高）、低负债甚至零负债的公司，非常讨厌高负债公司；从国内债务违约案例看，利息保障倍数可较好衡量偿债能力。
  利息保障倍数高，也只说明企业没有偿债上的风险，但不代表这就一定是一家好公司——判断好公司还需要结合其他指标来进行分析；该指标比较适合衡量高负债的企业。
  使用方法论（比较注意事项）：要与同行业比较，不同行业经营性质不同、比较没有意义；比较适合评估每年资本支出大的公司（电子业、制造业、运输业等借钱投资自己的产业维持竞争力）；有些产业本身现金很多（如零售业，可占用供应方资金），不太需要用该指标评估；单凭一个年度无法真实反映偿债能力，应计算连续数年的利息保障倍数进行比对，并通常选择指标最低的会计年度考核公司长期偿债能力。
  资信逻辑：公司若能一贯按时、足额支付债务利息，就可以借新债还旧债，从理论上永远不需要偿还债务本金；若利息保障倍数较低，利润难以对支付利息提供充分保障，公司就会失去对债权人的吸引力。
thresholds:
  healthy: 至少应大于1，倍数越高长期偿债能力越强；巴菲特选股标准：非金融企业的利息保障倍数一般高于7倍——每偿还100元的利息，背后当期至少有700元以上的净利（阳光电源409倍——"不叫财务稳健，这叫财务奢侈"）
  watch: 发行人利息保障倍数在2以上，其一年内违约的概率极小
  danger: 利息保障倍数低于2，违约的概率显著增加——要关注低于2的公募债发行人发生实质违约的风险，特别是极度依赖借新还旧的发行人；倍数断崖式下跌（神华1,183倍→198倍→28.7倍；东方电气530倍→40倍附近）本身就是危险信号；流动比率小于200%、速动比率小于100%、利息保障倍数小于2倍——公司体质很差，很难借到钱，失去举债经营的能力
fraud_signals:
  - 利润口径盲区：分子分母都建立在利润之上，虚增利润会推高表面倍数——利润与经营现金流背离较大时，指标再高也不能说明有足够现金付息
  - 计算口径陷阱：利息费用必须是本期发生的全部应付利息（含资本化利息）——只取财务费用中的利息费用、漏掉资本化利息会高估倍数；将利息资本化计入资产（如恒大累计2,252亿元计入"开发中物业"）既做大分子利润又做小分母利息费用，双重美化指标
  - 财务费用暴增导致倍数断崖下跌：神华财务费用上半年16.41亿、同比暴增759%，一年光利息就从利润表割走三十多亿——两年前还是利息收入大于利息支出的"存款大户"，如今成了"贷款大户"
  - 支付利息的现金有一部分来自筹资活动流入的现金，即"庞氏利息"——恒大2016—2020年五年自身经营+投资自由现金流累计-4,190亿元、全靠筹资净流入+4,746亿元维持付息分红，还将利息资本化藏进资产
cases:
  - company: 中国神华
    article: "408983763"
    point: 已获利息倍数从2024年上半年1,183倍跌到2025年上半年198倍、再跌到2026年上半年28.7倍——绝对安全但"变化斜率"可怕，从"存款大户"变成"贷款大户"
  - company: 阳光电源
    article: "404170453"
    point: 利息保障倍数409倍，一年的利润够付四百年的利息——一边经营进账169亿、一边还债106亿、分红44亿，"这不叫财务稳健，这叫财务奢侈"
  - company: 东方电气
    article: "407184259"
    point: 利息保障倍数从2023年的530倍一路降到40倍附近，同期长期借款两年增长228%、资产负债率突破70%
  - company: 中国恒大
    article: "407156353"
    point: 2017—2020年每年将450亿—694亿元利息支出资本化计入"开发中物业"（累计2,252亿元）而非当期费用，藏起真实利息负担、做大账面利润——庞氏利息的会计掩体
