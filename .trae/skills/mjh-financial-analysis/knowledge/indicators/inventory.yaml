quotes:
- 库存是潜亏的深水区，里面可能装着惊人的浪费以及不正常损耗，还假装具有正常的“价值”，因此，也可以这么讲，库存是调节利润的大杀器。总之，库存是亏损的万恶之源
- 如果存货的存货周转天数很大，则在这些畸高的存货周转天数背后可能存在巨额的存货窟窿
- 如果一家上市公司经营活动产生的现金流量净额长期为负数，存货余额却持续增加，这时，就要怀疑它是不是财务造假了
- 当需要清空这些假存货时，只要发一个公告，扇贝又跑了，存货瞬间灰飞烟灭。相应，虚增的利润通过存货减值（非常损失），完成闭环实现账目平衡，并且可以归为天灾
- 实际上，中银绒业实现的账面净利润全部体现在存货里面了
- 是的，他们就是这样欺负审计人员爬不动山，下不了海
- 应该按照存货的成本（即存货所占用的资金）来计算存货周转率，因为存货周转的是成本。销售收入包含毛利，不是存货的真实成本。因此，存货周转率的计算是采用“销售成本/存货平均余额”。不过，用“销售收入净额/存货平均余额”也不是毫无意义，它可以说明存货储备与销售收入净额之间的关系
- 如果一家上市公司通过少结转成品成本的方式虚增利润，其特征为：1.毛利率异常，肯定高于可比年度，也肯定高于同行业企业。2.由于未及时结转的成本留存在存货（在产品、产成品）中，公司存货会越来越多，存货周转率也会明显下降
- 甚至酒越好喝的企业，它一般会大量生产，大量库存，其存货周转率就越低，因此，我们通过库存周转率，可能亦大致可以判断一家酒企其酒的品质的高下了
- 价格战只是一种暂时的战术，如果产品过硬，薄利多销绝对是一种愚蠢的行为！薄利多销只会在产品竞争力差、不低价卖的话将会积压库存的情况下存在
- 如果一家企业的存货周转率远低于同行其他企业，说明该企业积压了不少存货，并且这些存货应该不值其账面价值，要计提跌价准备，成为资产减值损失
- 如果应收预付款项-应付预收款项＞0，这说明企业的竞争力弱，行业地位较低
- 只要以后发生巨额计提，就要问一问，这些资产到底存在不存在
- 计提资产减值准备为虚增资产开了方便之门，计提巨额损失的资产，这些账上的资产在现实中到底存在还是不存在是一个大问题，是不是想通过减值的路径一洗了之
- 1.毛利率提高，存货周转率上升，说明产品竞争力強，有非常畅销，并有很強的定价能力；毛利率提高，存货周转率下降，大众产品，价格敏感度高；毛利率下降，存货周转率上升，替代品多，定价能力较弱；毛利率下降，存货周转率下降，降价也没用，产品卖不动了，属淘汰产品。
- 我们分析存货周转率时，不要机械地以为存货周转率越快越好。其实一家企业的产品要不要保持库存，要看它的产品属性。
- 一方面存货周转速度在不断下降，另一方面销售却很旺盛，这就不合情理了，因为存货周转速度放慢意味着营运能力在下降，销售放缓，所以主营产品周转太慢时就不可能实现高额收入，也不可能实现巨额利润。
- 存货这个科目，是企业的“蓄水池”，也是财报里最容易“藏污纳垢”的地方。有合同覆盖的备货是资产，没合同覆盖的备货是风险。看它，别光看总数，要盯着它和合同负债的匹配度——哪天存货还在涨、合同负债不涨了，警报就响了。
