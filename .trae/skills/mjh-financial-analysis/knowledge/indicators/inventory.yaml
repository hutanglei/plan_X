  point: 2014-2021年通过虚增在地林下参采购成本虚增存货，截至2021年虚增期末存货资产59.4亿元，"人参之王"的天量人参子虚乌有；马靖昊2012年即指出其毛利率攀升、存货高企而周转率奇低、经营现金流巨额负数。
- company: 獐子岛
