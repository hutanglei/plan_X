  point: 存货周转天数从2013-2018年稳定在30天以内飙升至2020年100天，2018-2019年虚增存货合计达20.38亿元，虚构的收入与利润"藏匿"在存货科目中。
- company: 抚顺特钢
  article: '343158777'
  point: 通过虚增存货、减少生产成本、将部分虚增存货转入在建工程和固定资产等方式，累计虚增利润19.02亿元。
- company: 茅台
  article: '148525831'
  point: 存货周转率天然很低的行业标杆——2018年度0.29次（换算库存周转天数约1258天）、2019年三季报0.22次（约1659天）；白酒先生产再放上几年销售，周转率取决于存货战略，酒越好喝的企业越大量生产大量库存、周转率越低，通过库存周转率可大致判断酒企品质的高下（对白酒类企业，分析应收账款周转率比存货周转率更重要）。
- company: 同仁堂
