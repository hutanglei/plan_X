---
name: 存货
key: inventory
category: 资产质量
alias:
- 库存
- 库存商品
- 在产品
definition: 企业的重要营运资产，是生产成本跨向市场价值的桥梁；库存是潜亏的深水区，是"亏损的万恶之源"，高库存从根本上说明企业创新能力不足以及市场地位弱势。
formula: 存货周转率＝营业成本/平均存货余额（存货周转天数为其倒数口径）；存货跌价准备＝库存数量×（单位成本价－不含税的市场价）；存货高计低计路径：期初存货低计或期末存货高计→销售成本低计→利润高计。周转率口径应按存货所占用的资金（销售成本/营业成本）计算而非销售收入净额——存货周转的是成本，销售收入包含毛利、不是存货的真实成本（用"销售收入净额/存货平均余额"也不是毫无意义，可说明存货储备与销售收入净额之间的关系）；若存货年中计提了跌价准备，计算时须将跌价准备加回，否则计提越多、账面存货越少、周转率反而越快（如2000万元受潮发霉食品计提1000万元跌价准备后存货账面减半、周转率一下就快了，实际存货状况更糟，实为会计数字游戏）。另可参考存货资金周转率＝分析期销售存货收到的现金/（分析期存货平均余额+增值税进项税额+分析期预付账款平均余额-分析期应付账款平均余额-分析期预收账款平均余额+分析期应收账款平均余额）：当预付账款和应收账款大于预收账款和应付账款时，存货的资金周转时间长于实物周转时间，反之则短于。
majinghao_view: |
  存货过多有四种可能：产品销售遇到困难、未计提或少计提存货跌价准备、存货未及时结转为成本以虚增利润、部分存货子虚乌有为套出的资金。
  存货高速增长可能源于营业收入少结转了成本从而虚增利润，虚增利润总得虚增资产来平衡，很多企业就选择了盘点难度大的存货。
  分析要分行业：高端白酒年份越长价值越大基本无跌价风险，新鲜食品、高科技产品易跌价，农牧业产品（林下参、海底扇贝）很难核对清楚，正是造假高发地带。
  应收账款周转率与存货周转率要组合研判：两者同步上升，表明产品市场前景好、企业扩大了产销规模，存货转应收、应收转现金都快；应收账款周转率上升而存货周转率下降，表明存货管理效率下降、备货增多、存货占用资金多；存货周转率上升而应收账款周转率下降，表明存货转应收快但应收转现金变慢，企业经营遇到困难、放宽了信用政策扩大赊销，要关注应收账款的坏账风险；两者同步下降，表明存货转应收、应收转现金都变慢，市场前景不容乐观、产品不好卖，应予以警觉。
  分析存货周转率不要机械地以为越快越好，要看产品属性：白酒类企业存货周转率一般都很低（茅台2018年度0.29次、换算库存周转天数约1258天，2019年三季报0.22次、约1659天），取决于其存货战略，甚至酒越好喝的企业越会大量生产、大量库存、周转率越低，通过库存周转率可大致判断一家酒企品质的高下（分析白酒企业应收账款周转率比存货周转率更重要）；但对不易存放、容易迭代的产品，存货周转率远低于同行说明积压了不少存货、存货应不值其账面价值，要计提跌价准备成为资产减值损失。
  存货周转率还须两个结合：与销售利润率结合——周转率提高而销售利润率下降，多半是以打价格战方式通过降价增加销售额；与存货跌价准备结合——周转率靠计提大额跌价准备而上升，不但不能说明存货变现能力增加，反而说明产品竞争力弱、存货变现能力差。
  存货是财务人员最容易用来调剂利润的指标，通过销售结转成本的环节少转成本是常见"财技"：只要少结转了成本，就会提高存货金额、拉长存货周转天数，存货中的"水分"最终通过计提跌价准备处理掉。
thresholds:
  healthy: 正常企业的存货周转天数偏差在一个合理范围内、很少忽上忽下；毛利率与存货周转率呈正相关，两者同升的毛利率提升一般是真实的；白酒类企业按存货战略大量备酒、周转率天然很低（茅台0.29次约合1258天）属正常，不能机械套用快消品标准；存货周转率的提升与销售利润率匹配（不是靠降价打价格战换来），也不是靠大额计提跌价准备换来的。
  watch: 存货增长速度大幅超过营业成本增长速度；收入连年增长但存货周转天数大幅增加；毛利率升高而存货周转率下降（违背常识）；存货周转率明显低于同行（产品不易存放、容易迭代时）说明积压存货且存货应不值其账面价值；存货周转率提高而销售利润率下降（打价格战降价促销）；存货周转率靠大额计提跌价准备而上升（产品竞争力弱、变现能力差）。
  danger: 存货快速增长、占净资产比重越来越大甚至超过净资产（存货相当大比例子虚乌有）；经营活动现金流量净额长期为负而存货余额持续增加；存货周转天数畸高（背后可能存在巨额存货窟窿）；存货造假组合特征：应收预付款项-应付预收款项＞0（竞争力弱、行业地位较低）＋存货/总资产比例远远高于行业平均水平＋存货周转率远低于同行业水平＋货币资金持续大幅度减少——基本可判断公司将虚增的收入所应带来的"现金"消化在"存货"中了，存货中含有大量水分，即"假存货"。
fraud_signals:
- 毛利率不断创新高而存货快速增长、占净资产比重越来越大甚至超过净资产：增长的"存货"相当大比例是子虚乌有的，是虚增利润造的孽。
- 毛利率升高而存货周转率下降：有悖于常识，企业可能将一部分虚增的利润隐藏在虚增的存货中；再结合利润与现金流净额总是不匹配、现金流大多数年份为负，基本可确定存货大部分子虚乌有。
- 收入连年增长的背景下存货周转天数却大幅增加（无并购重组等合理事项）：可能将虚增的利润化成了"存货"。
- 经营活动现金流量净额长期为负数、存货余额却持续增加：虚增的毛利没有相应现金流对应，利用存货难以盘点的特点虚增存货。
- 存货增长速度大幅超过营业成本增长速度：可能虚构商品采购将资金套出企业，再将资金以货款形式流回，虚增收入、利润。
- 突击加大生产摊薄固定成本、提升毛利率，虚增本期利润。
- 业绩暴雷由计提存货减值损失导致、而单个存货本身并无明显减值迹象："洗一次大澡"清洗以前年度虚增利润而虚增的存货。
- 养殖类、农业类公司将本该记入"其他应收款"的大股东占款计入"存货"导致存货畸高，并将大量利息支出资本化为存货，最后妄图通过计提存货跌价准备一洗了之。
- 造假消化路径：虚增预付账款→转为存货→部分转在建工程→固定资产，然后大额计提存货减值、固定资产减值，消化掉虚增的资产。
- 通过少结转成品成本方式虚增利润的两个特征：一是毛利率异常，肯定高于可比年度、也肯定高于同行业企业；二是未及时结转的成本留存在存货（在产品、产成品）中，公司存货越来越多、存货周转率明显下降（如某公司2018年存货周转天数比2016年增加一个月，存货积压时间变久，存货中的"水分"最终通过计提跌价准备处理掉）。
- 存货造假组合判断：应收预付款项-应付预收款项＞0（竞争力弱）、存货/总资产比例远远高于行业平均水平、存货周转率远低于同行业水平、货币资金持续大幅度减少——基本可判断该公司将虚增的收入所应带来的"现金"消化在"存货"中了，"存货"中含有大量的水分，也就是"假存货"；只要以后发生巨额计提，就要问一问这些资产到底存在不存在。
- 计提资产减值准备为虚增资产开了方便之门：对计提巨额损失的资产要追问账上资产在现实中到底存在还是不存在、是不是想通过减值的路径一洗了之，巨额减值都应该调查。
