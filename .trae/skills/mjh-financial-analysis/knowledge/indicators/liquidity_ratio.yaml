quotes:
- 流动比率0.87、速动比率0.72——比一季报的0.99、0.83更低，在安全线以下越走越远
- 675亿短债还趴在账上，0.87的流动比率说明疗程远没结束
- 流动比率0.689、速动比率0.264，全部触及历史最差
- 流动比率两度跌破1.0，速动比率常年在0.62—0.70之间“贴地飞行”，流动负债占负债总额的比例高达90
- 速动比率能否回到0.5以上、短期借款能否压回400亿以内、液体乳降幅能否收窄到-2%以内。这三道坎，本质上是一句话：把靓丽利润表的成果，转化为资产负债表的修复，而不是转化为更高比例的分红
- 越是赚钱的公司，其竞争力强，流动资产周转速度越快，流动资产占用资金量越小，流动比率反而越低，低于2甚至低于1
- 不能盲目地以教材中所学的流动比率大于2时偿还短期负债才有保障作为判断的教条，流动比率高，一般表明偿债保证程度较强
- 当你看到一家企业应收账款基本没有、存货很少，而应付账款不少、预收账款一大堆时，虽然它的营运资金为负数，流动比率数据很烂，但这家企业却可能是一家超级牛逼的公司，它的现金循环周期（应收账款周转天数+存货周转天数－应付账款周转天数）很小，甚至为负数，这说明这家企业可以占用别人的钱，而别人占用不了它的钱，用别人的钱做自己的生意，你说，是不是要爽歪啊
- 现金是必需品，决定企业的生死存亡。相对于现金而言，利润是奢侈品
- 现金比率是所有偿还指标，如资产负债率、流动比率、速动比率中最直接、最现实的指标，它能准确真实地反映出现金及现金等价物对流动资产的担保程度
- 如果一家企业的现金循环周期小甚至为负数，其原因是该企业付不起款而欠供应商货款而导致的，就不能说该企业具有竞争力，反而是资金链断裂的征兆，比如曾经的乐视网就是这样付不起钱的例子，因此，具体问题要具体分析
- 越是赚钱的公司，其竞争力强，流动资产周转速度越快，流动资产占用资金量越小，流动比率反而越低，低于2甚至低于1。
