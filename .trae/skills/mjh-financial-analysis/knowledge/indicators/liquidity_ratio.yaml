---
name: 流动比率与速动比率
key: liquidity_ratio
category: 偿债能力
alias:
- 流动比率
- 速动比率
- 短期偿债能力指标
- 现金比率
definition: 衡量企业短期偿债能力的指标：流动比率看流动资产对流动负债的整体覆盖，速动比率剔除存货后看"能快速变现的资产"够不够还一年内要还的债——手头的活钱与短债的赛跑。
formula: 流动比率＝流动资产÷流动负债；速动比率＝（流动资产－存货）÷流动负债。 马靖昊的使用口径：不能孤立看绝对值，要盯趋势——是否"在安全线以下越走越远"，并配合短期借款规模、货币资金对短期债务的覆盖倍数、流动负债占负债总额的比例一起看。
  现金比率＝现金及现金等价物期末余额÷流动负债——所有偿债指标中最直接、最现实的指标，能准确真实反映现金及现金等价物对流动资产的担保程度，大于或高于1时即期债务可顺利偿还、比率越高担保程度越高。
  到期债务偿付率＝经营活动现金流量净额÷当年到期的债务总额（到期债务本息偿付率＝经营活动现金流量净额÷（本期到期债务＋现金利息支出），大于1意味着偿付到期债务本息后还有剩余）——经营现金流量是偿还企业债务的真正来源，该指标克服了流动比率和速动比率只能反映某一时点偿债能力的缺陷。
  现金负债总额比率＝经营活动现金流量净额÷全部负债——比率越高，偿还全部债务的能力越强。 现金循环周期＝存货周转天数＋应收账款周转天数－应付账款周转天数——周期越小说明运营效率越高、竞争力越强。
majinghao_view: |
  他看流动比率、速动比率，重点不在绝对值而在趋势与斜率：神华流动比率0.87、速动比率0.72，比一季报的0.99、0.83更低，"在安全线以下越走越远"——跌破安全线不是最可怕的，越走越远才是。
  短期偿债指标要与短期借款规模、负债期限结构联动看：伊利流动比率0.689、速动比率0.264触及历史最差，背后是短期借款从125.96亿膨胀至590.51亿、流动负债占负债总额97.4%的"金融化"资产负债表，市场因此怀疑其分红是"借"出来的——"利润是观点，现金才是事实"。
  流动性安全垫建立在应付账款账期占款之上时要警惕：东方电气速动比率0.62—0.70"贴地飞行"，短期流动性安全垫相当程度建立在171天应付账款账期对上游供应商的占款上，一旦占款松动（应付账款下降、短期借款激增），模式就出现裂缝。
  判断标准要从"股息率有多高"升级为"分红的钱是不是借来的"——看公司别光盯着利润表流口水，要看资产负债表扎不扎实、现金流量表的日子过得稳不稳。
  流动比率的"反直觉"：越是赚钱的公司，流动资产周转速度越快、占用资金量越小，流动比率反而越低（低于2甚至低于1）——不能盲目拿教材"流动比率大于2时偿还短期负债才有保障"当教条；反过来，流动比率高甚至大于2，但账上没有多少真正能迅速用来偿债的现金和银行存款、流动资产大部分是变现速度较慢的存货应收账款，竞争力较弱的企业照样可能陷入短期偿债困境。
  应收账款基本没有、存货很少、应付账款不少、预收账款一大堆的企业，营运资金为负数、流动比率数据很烂，却可能是一家超级牛逼的公司——现金循环周期很小甚至为负，占用别人的钱、别人占用不了它的钱，用别人的钱做自己的生意。
  现金是必需品、利润是奢侈品：做过企业的人用钱时绝不关心账上有多少利润，关心的是账上还有多少钱、下个月工资能不能发出、要不要借钱；企业的财务状况不仅取决于某一会计期间取得"利润"，还取决于它的流动性和现金流量。
thresholds:
  healthy: 流动比率1.8、速动比率1.2处于安全区间（洽洽食品，联合资信AA+评级语境）；流动比率3.04、速动比率2.01左右属于流动性缓冲极为充足（雅化集团），短期流动性危机爆发的概率极低；现金比率（现金及现金等价物÷流动负债）大于或高于1时即期债务可顺利偿还
  watch: 速动比率低于0.5——伊利估值修复三道坎之一就是"速动比率能否回到0.5以上"
  danger: 流动比率跌破1.0且持续走低、"在安全线以下越走越远"（神华0.87/0.72）；速动比率0.62—0.70"贴地飞行"、流动负债占负债总额比例高达90%（东方电气）；流动比率小于200%、速动比率小于100%且利息保障倍数小于2倍——体质很差、很难借到钱、失去举债经营能力
fraud_signals:
- 流动比率低下叠加短期借款激增、应付账款占款开始下降——流动性安全垫边际松动（东方电气短期借款从1.41亿元激增至17.18亿元，应付账款开始下降7.7%）
- 货币资金对短期债务的覆盖倍数骤降——神华从16.9倍骤降到1.5倍，掏钱方式从历史存款变成股权融资和借新还旧进来的新钱
- 存贷双高、借新还旧：短期借款膨胀+大额资金锁定长期大额存单吃利差，单年取得借款与偿还债务规模逼近营收两倍（伊利2025年取得借款2,344.71亿、偿还债务2,355.60亿）——要追问分红的钱是不是借来的
- 流动比率高（甚至大于2）不等于安全：账上没有多少真正能迅速用来偿债的现金和银行存款、流动资产中大部分是变现速度较慢的存货应收账款，且竞争力较弱——仍可能陷入难以偿还短期负债的困境
- 现金循环周期小甚至为负数，若原因是付不起款而欠供应商货款——不能说具有竞争力，反而是资金链断裂的征兆（乐视网就是付不起钱的例子），具体问题要具体分析
- 存货周转率降幅很大——畸低的存货周转率背后可能存在巨额的存货窟窿（计算存货周转率＝营业成本÷（（期初存货＋期末存货）÷2）时，若年中计提了跌价准备须将跌价准备加回去，否则只是会计数字游戏）；长期收不到钱的应收账款、长期收不到货的预付账款与长期积压的存货一样，均反映企业发展遇到困难
- 职业经理人通过增加生产、扩大库存取得短期业绩提升（分摊固定成本使单位产品成本下降、与销售收入相匹配结转的销售成本降低、业绩被拉升），然后走人留下烂摊子——库存是亏损的万恶之源
- 财务危机预警征兆：资不抵债、经营活动现金净流量出现负数（财务危机"爆发期"的主要征兆）、过度依赖借款、存在大额的逾期未付利润、无法履行借款合同条款（不能及时足额还款、未能按约定支付债券或借款利息）；或有事项预警：票据贴现、担保、抵押借款、未决诉讼
