name: 长期待摊费用
key: long_term_expense
category: 资产质量
alias: [待摊费用, 披着资产外衣的另类]
definition: 长期待摊费用是"披着资产外衣的另类"——资产已经现时灭失为费用了，但非得要人为延伸到未来去摊销。
formula: 无计算公式。分析口径（马靖昊建议）：真正资产负债率＝（负债总额－预收账款－合同负债）/（资产总额－商誉（如有）－长期待摊费用－递延所得税资产），长期待摊费用因无任何变现能力应从资产方剔除。
majinghao_view: |
  长期待摊费用与商誉、递延所得税资产同属"被记录为资产的费用"：既不能独立存在，也不能单独变现，更不能用来偿债——从严格意义讲都是费用，资产负债表中是记录"费用"的，财报分析时要考虑扣除这些资本化的"费用"。
  资产的核心定义是"可以延伸到未来灭失的费用"，而长期待摊费用恰恰相反：资产已经现时灭失为费用了，却被人为延伸到未来去摊销，名不副实。
  在计算偿债能力指标时，长期待摊费用无任何变现能力，不剔除会虚大资产、低估真实负债水平；财务分析不要拘泥于教材公式，要做减法才更真实。
  长期待摊费用是费用资本化的藏身处：装修、大修理等本该进当期损益的支出，一旦被塞进这个科目慢慢摊销，费用就摇身变成“资产”，当期利润随之虚增；连“12万元买藏獒看门”最后都记入了长期待摊费用——凡是没处安放的支出都可能往这里装，分析时要盯住有没有把“必须立即摊”的费用挂进来慢慢摊。
thresholds:
  healthy: 原文未给出量化标准；其隐含口径为长期待摊费用在总资产中占比极小、剔除前后指标差异不大。
  watch: 长期待摊费用金额或占总资产比例偏大（资产被"费用"撑大）。
  danger: 原文未给出针对长期待摊费用的具体危险信号阈值。
fraud_signals:
  - 偿债指标失真：计算资产负债率时不剔除长期待摊费用，分母被无变现能力的"费用"虚增，真实负债水平和偿债能力被掩盖。
  - 费用资本化的变体：长期待摊费用是"人为延伸到未来去摊销"的费用，与费用资本化美化财报的逻辑同源——把本该进利润表减利润的费用藏进资产负债表。
  - 费用资本化藏身处：长期待摊费用是装修、大修理等本该一次性计入当期损益支出的“藏身处”，塞进来分期摊销后，利润表的费用摇身变成资产负债表上的“资产”，当期利润被虚增。
  - 固定资产后续支出科目混用（证监会年报监管发现问题）：对房屋建筑物进行装修维护时，错误地将固定资产的后续支出计入长期待摊费用，而未对相关支出进行分析判断，并计入固定资产成本或者当期损益。
  - 大修理支出处理随意：大修理支出应按性质在“管理费用”或“长期待摊费用”间区分，可资本化的后续支出应通过“在建工程”科目核算、完工转回固定资产，科目混用会扭曲资产结构与利润。
  - 科目边界模糊处的异常入账：类似“12万元买藏獒看门”的支出在生物资产、固定资产、存货、无形资产之间争议不定，长期待摊费用容易沦为没有合适科目时的“收容所”，需警惕非常规支出混入该科目。
  - 混淆待摊费用与长期待摊费用：把“必须立即摊”的费用挂成长期待摊费用，人为拉长摊销期平滑利润。
  - 偿债分析剔除不彻底：真正的资产负债率要求资产方剔除长期待摊费用、递延所得税资产，负债方剔除预收账款；不剔除则指标失真，公允价值计量还会进一步破坏资产负债率的客观真实性。
cases:
  - company: 藏獒看门案（某企业12万元买藏獒与值班保安一起看门）
    article: "149674944"
    point: 会计们讨论一宿也没得出入账说法，有人主张记生物资产、固定资产、存货甚至无形资产；最终按长期待摊费用处理，估计藏獒能活多久就将12万元摊多久，日常吃、穿、住、行费用记管理费用；分录为借：长期待摊费用 104400，应付税费－应付增值税-进项税额 15600，贷：银行存款 120000。
quotes:
  - "资产已经现时灭失为费用了，但非得要人为延伸到未来去摊销，此为披着资产外衣的另类－长期待摊费用"
  - "在财报中，有一些被记录为资产的东西，既不能独立存在，也不能单独变现，更不能用来偿债，比如，并购溢价形成的商誉、递延所得税资产、长期待摊费用等。其实这些资产从严格意义讲，都是费用"
  - "资产负债表中是记录“费用”的，在财报分析时，要考虑扣除这些资本化的“费用"
  - "大家采用资产负债率分析企业的偿债能力时，最好剔除长期待摊费用、递延所得税资产等项目，原因是它们无任何变现能力。即资产负债率＝负债总额/（资产总额－长期待摊费用－递延所得税资产），这样，更能真实反映企业的负债水平和偿债能力"
  - "事情原委：某企业花费12万元买了一只藏獒，晚上和值班保安一起看门，老板要会计入帐，几个会计讨论了一宿，也没得出个说法"
  - "因此呢，说来说去，你们将我记为长期待摊费用是合适的，你们估计我能活多久，就将那花掉的12万块钱摊多久就行了，我平时吃、穿、住、行的费用，你们记入管理费用好了"
  - "你永远是待摊费用，而且是必须立即摊的那种，决不是长期待摊费用"
  - "打出生起就是一披着资产外衣的长期待摊费用！笑死人了"
  - "什么是真正的资产负债率：大家采用资产负债率分析企业的偿债能力时，在资产方，最好剔除长期待摊费用、递延所得税资产等项目，原因是它们无任何变现能力；在负债方，最好剔除预收账款，扣除预收账款的原因是它不需要用现金去偿还，只需要发产品就行，是收入的前世今生"
  - "即资产负债率＝（负债总额－预收账款）/（资产总额－商誉（如有）－长期待摊费用－递延所得税资产），这样，更能真实反映企业的负债水平和偿债能力"
  - "根据企业会计准则及相关规定，对于固定资产的后续支出，符合固定资产确认条件的，应当计入固定资产成本，同时将被替换部分的账面价值扣除；不符合固定资产确认条件的，应当计入当期损益。年报分析发现，个别上市公司本年度对房屋建筑物进行装修维护，公司错误地将固定资产的后续支出计入长期待摊费用，而未对相关支出进行分析判断，并计入固定资产成本或者当期损益"
  - "平时美容、健身等大修理支出作为\"管理费用\"或\"长期待摊费用\"处理，但对于整容、矫形等发生的可资本化后续支出，应通过\"在建工程\"科目核算，完工后再从在建工程转回固定资产"
