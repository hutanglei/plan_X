---
name: 销售净利率
key: net_margin
category: 盈利能力
alias:
- 净利率
- 销售净利润率
- 扣非销售净利率
definition: 净利润占销售收入的百分比——毛利率是第一步的盈利能力评估，销售净利率是第二步的盈利能力评估，反映公司销售收入的盈利水平。
formula: 销售净利率＝净利润÷销售收入（销售收入指扣除销售折扣、折让和销售退回后的销售净额）；扣非销售净利率＝扣非净利润÷销售收入；在杜邦体系中：ROE=销售净利率×总资产周转率×权益乘数。
majinghao_view: |
  销售净利率的高低直接受毛利率高低的影响，同时又进一步受企业三项费用和其它损失与收益的影响；净利率不仅是衡量盈利能力的指标，也是衡量企业管理能力的指标——相同行业相同产品、毛利率相差不大时，净利率高的那一家企业管理能力更强。
  它有两大局限：一是没有经过现金流的检验，权责发生制下算出的利润若没带来相应经营现金流盈余，净利率数值就不可靠；二是净利润包含非经常性损益，若非经常性损益占比高则利润不可靠，要参考扣非销售净利率、看利润主要来源是否来自核心利润。
  净利率只能与同行业和自己过去比（至少看连续五年以上），不同行业间没有可比性；医药企业毛利率90%但销售费用畸高、净利率相当低的，毛利率根本反映不了产品竞争力——要将毛利率与销售净利率结合起来分析。
thresholds:
  healthy: 净利率高于30%（且毛利率高于45%）的企业非常优秀，若每年还能基本稳定保持则更加优秀；净利率与毛利率一样都是越高越好，但净利率的含金量更高；费用管控优秀的公司净利率更有含金量——极低的销售费用率与管理费用率是高净利率的重要支撑
  watch: 净利润增长速度快于营业收入增长速度则净利率提升，说明盈利能力在增强；反之需留意；提升销售净利率要么靠品牌、研发维持价格优势，要么靠费用管理降低成本——"要么天赋异禀，要么十年磨剑苦练内功"
  danger: 净利率低于8%（且毛利率低于15%）的企业不能说不好但爆发力较弱；净利率较高或提升但利润未带来相应经营现金流盈余——数值不可靠；非经常性损益在净利润中占比过高
fraud_signals:
- 上市前后净利率对比法判断业绩注水：企业上市后股权融资增大的只是净资产规模（影响周转率和权益乘数），不影响净利率，且上市后节省大量财务费用净利润应增加——若上市后销售净利率大幅下降、特别是降幅在4个百分点以上，基本上可以确定企业上市前的财务报表存在业绩注水
- 高毛利率＋巨额销售费用＋低净利率的组合：说明销售费用中可能有很大比例处于灰色地带（激进销售手段，涉嫌回扣、商业贿赂等），产品并没有多少竞争力——毛利率根本反映不了竞争力，需将毛利率与销售净利率结合起来分析
- 扣非视角：非经常性损益（投资收益、营业外收支净额及财政补贴等）占净利润比重太高，则销售净利率不可靠，应看扣非销售净利率
- 净利润增速慢于营业收入增速导致净利率下滑时，要进一步分析是营业成本上升、降价销售、三项费用过多还是投资收益减少
- 净利率趋势检验：净利率指标要至少看连续五年以上，并与同行业间对比、与自己的过去对比——单一年度的净利率高低不足以定性，不同行业间没有可比性
- 管理能力检验：净利率不仅是衡量企业盈利能力的指标，也是衡量企业管理能力的指标——公司创造利润两种途径是增加收入、节约开支降低三项费用，只有管得好才能省出更多利润；相同行业相同产品的公司毛利率相差不大时，净利率高的那一家企业管理能力更强，毛利率高而净利率低说明期间费用消耗大、效益低
- 国企腐败识别：国有企业毛利率很高、净利率却很低，往往因为管理费用太高——由于垄断地位毛利率较高，但中间被拔毛太多（天价吊灯、拉菲以及各种回扣、各种跑冒滴漏甚至贪污），可用拔毛率=[毛利率-（毛利-销售费用-管理费用）/营业收入]÷毛利率量化腐败风险，拔毛率越大腐败风险越大
- 销售费用率分档：销售费用率小于15%的公司其产品比较容易销售、销售风险相对较小；大于30%的公司产品销售难度大、销售风险也大；销售费用占销售收入的比例超过50%以上，基本上可说明企业正在采用最直接最高效的方法来营销——商业贿赂（带金销售）
cases:
- company: 青岛啤酒
  article: '343471141'
  point: 扣非销售净利率也就7%左右，远低于其销售净利率——非经常性损益拉高了表观净利率，看核心利润来源才可靠
- company: 中国海油
  article: '405247485'
  point: 2026年一季度营业成本涨16.95%、营收只涨8.6%，成本增速跑赢收入的边际信号亮起黄灯——净利率承压的拐点先于存量数据开口说话
- company: 未名医药
  article: '196881605'
  point: 2020年销售费用2.86亿元、占销售收入的比重为103.40%，居然超出了它的销售收入——如此畸形的费用结构下净利率必然被吞噬，销售费用中的很大比例可以改为“行贿费用”
- company: 步长制药
  article: '196881605'
  point: 2020年营业成本37.41亿元而同期销售费用83.73亿元（是营业成本的2倍还多），近3年销售费用率59%、57%、52%达到畸高水平；毛利率高达76.63%左右但在如此高的销售费用面前净利率只有11.51%——高毛利率是用超高的销售费用堆积起来的
- company: 同仁堂
  article: '144814837'
  point: 本期毛利率49.00%（高于片仔癀44.76%、云南白药29.70%），净利率却仅8.53%（远低于片仔癀25.54%、云南白药16.36%）——费用管控能力差，销售费用率分别是片仔癀和云南白药的2.56倍和1.62倍、管理费用率分别是2.35倍和5.21倍，高额销售与行政成本吞噬利润，“国企病”有点严重。
- company: 华润三九
  article: '145669254'
  point: 本期毛利率67.15%、销售费用率44.55%（远高于同仁堂2019年三季度的20.69%、云南白药的14.01%），其中市场推广费高达47.92亿元、占销售费用73.16%——销售费用驱动型公司，销售费用总额从2010年13.56亿元攀升到65.50亿元（增近5倍）而收入仅增3倍，边际效益递减，市场推广费也是容易藏污纳垢、滋生腐败的地方。
- company: 兖州煤业（对比恒生电子）
  article: 143034188
  point: 2019Q3兖州煤业利润近70亿、PE约5倍、ROE 10.71%、毛利率13.72%；恒生电子利润8亿、PE约75倍、ROE 22.92%、毛利率97.66%——市盈率（想象力）差异15倍是市值悬殊主因。
- company: 永辉超市/苏宁易购
  article: 409123261
  point: "“辛苦钱”模式（靠周转率赚钱）代表：薄利多销、净利率可能仅2-3%，管理稍有松懈或大环境一变，立马从赚钱变亏钱。"
quotes:
- 毛利率是第一步的盈利能力评估，而销售净利率是第二步的盈利能力评估，净利率的高低直接受毛利率高低的影响，同时又进一步受企业三项费和其它损失与收益的影响
- 销售净利率没有经过现金流的检验，利润质量无法保证
- 销售净利率没有考虑非经常性损益
- 此时，毛利率根本反映不了企业产品的竞争力
- 要将毛利率与销售净利率结合起来分析
- 如果发现企业上市后销售利润率出现了大幅下降的情形，特别是降幅在4个百分点以上，那么基本上可以确定企业上市前的财务报表存在业绩注水的情形
- 如果一家企业的毛利率高于45%，净利率高于30%，那么，该企业是非常优秀的，倘若每年还能够基本稳定地保持这样的比率，那就更加优秀了
- 想要提高销售净利率，要么天赋异禀，要么十年磨剑苦练内功
- 必须指出的是，净利率指标不仅仅是衡量企业盈利能力，也是衡量企业管理能力的指标
- 因此，相同行业相同产品的公司，如果毛利率相差不大，那么净利率高的那一家企业的管理能力更强
- 当然，净利率这个指标也要至少看连续五年以上，并且与同行业间对比，与自己的过去对比，不同行业间没有可比性
- 一般来说，销售费用率小于 15%的公司，其产品比较容易销售，销售风险相对较小。销售费用率大于 30%的公司，其产品销售难度大，销售风险也大
- 所以，如果发现企业上市后销售利润率出现了大幅下降的情形，特别是降幅在4个百分点以上，那么基本上可以确定企业上市前的财务报表存在业绩注水的情形。
- 净利率不低于行业平均，且长期稳定或向上——靠非经常性收益撑起来的不算；周转率的提升要带来现金流的改善——光转得快、钱回不来，白转；权益乘数与行业匹配——资产负债率一般不超过70%，利息保障倍数大于3，赚的钱至少够还利息三回。
