name: 其他应收款/其他应付款
key: other_receivable
category: 资产质量
alias: [其他应收款, 其他应付款, 垃圾桶, 聚宝盆, 无票费用]
definition: 不买东西，钱到了别人兜里，这是其他应收款；没卖东西，钱到了自己兜里，此为其他应付款。很多企业账面上的"其他应收款"根本就不是什么资产，而是没有取得发票的费用。
formula: 关注其他应收款+预付款项合计占总资产的比例；其他应付款总体规模或占总负债的比例（报表项目按应付利息、应付股利和其他应付款科目期末余额合计数填列）。
majinghao_view: |
  最垃圾的会计科目是"其他应收款"，什么都往里塞，很有可能不是其他应收的款，而是隐藏的费用；最有欺骗性的会计科目是"其他应付款"，它冒充负债，很有可能不是其他应付的款，而是隐藏的收入。
  如果其他应收款根本就是子虚乌有，它是企业用来陷藏潜亏的"垃圾桶"；如果其他应付款根本就不用支付出去，它是企业用来陷瞒利润的"聚宝盆"。
  优秀的上市公司，其他应收款和其他应付款应当数额极小，甚至为零；这两个科目数字较大的公司，可以先打上一个经营不规范的标签。凡是带有"其他"字眼的科目金额都不应过大，因为它们都跟生产经营活动无关。
thresholds:
  healthy: 优秀的上市公司两个科目数额极小，甚至为零；应付账款是主角、其他应付款是配角，应付账款金额通常比其他应付款大。
  watch: 其他应付款总体规模或占总负债的比例相对较大，要分析其具体构成及来源；预付款项+其他应收款占总资产的比例较大，风险就较大。
  danger: 长期挂账的其他应收款（往往是收不回来的坏账、投资或早已发生的费用）；经营绩效日益衰退企业的现金流特征之一是应付账款大量减少、其他应付款较大幅度增加（想尽办法拆借资金以应付日常开支）。
fraud_signals:
  - 其他应收款根本不是资产：要么是收不回来的坏账或投资，要么是没有取得发票的费用；想找发票平账，找不来就只能计提坏账准备。
  - 将应计入成本费用的支出计入其他应收款，或将本应计入其他资产项目的内容计入其他应收款：把其他应收款当成"蓄水池"，任意调整成本费用甚至虚增资产，以调节利润。
  - 其他应收款数额过大时做质量分析：可能存在关联方交易（如拆借给母公司的资金）、抽逃税金（将正常赊销收入记入其他应收款"合理避税"）、非法拆借资金、抽逃注册资金等违规行为。
  - 隐藏应收账款：上市公司先把资金打出去挂在其他应收款上，再叫客户把资金打回来冲销应收账款。
  - 大股东占款：养殖类、农业类公司为掩盖资金被占用甚至被侵占，将本该记入"其他应收款"的大股东占款计入"存货"，导致存货畸高。
  - 审计要点：对长期挂账的其他应收款明细科目要追根刨底，彻底弄清其内容和性质，不能轻信被函证单位的确认结果。
  - 其他应付款舞弊三类：隐匿收入偷税漏税（逾期未退包装物押金不结转收入、出售废品及下脚料收入长期挂账、利润达标后用虚假原始凭证将营业收入列入其他应付款）；虚列成本（虚开发票的资金回流长期挂账）；非法集资。
  - 其他应付款"调账"藏收益：无须偿还的应付款项既不结转收益也不申报纳税，直接从其他应付款转入资本公积，被税务机关纳税评估发现后照样调增应纳税所得额、补缴企业所得税和滞纳金。
  - 无须支付的应付款项长期挂账不结转：挂账时间太长、企业根本也无须偿还，却又不敢将其他应付款转为营业外收入，既瞒利润又隐税款，是其他应付款"聚宝盆"的典型形态。
cases:
  - company: 獐子岛
    article: "272948083"
    point: 关联方长期占用上市公司资金，为掩人耳目在会计核算上不走"其他应收款"科目，而是利用养殖类存货难以查验的特点打入"存货"科目，再通过提取减值准备一洗了之。
  - company: 某企业（其他应付款调账补税案）
    article: "248099268"
    point: 几年时间累积下100万元其他应付款，挂账时间太长且根本无须偿还，会计不敢转为营业外收入，突发奇想调账（借：其他应付款-股东100万元，贷：资本公积100万元）；2019年下半年当地税局纳税评估发现隐藏在资本公积中的疑点数字100万元收益，依法调增2018年度应纳税所得额，补缴25万元企业所得税及滞纳金。
quotes:
  - "不买东西，钱暂时到了别人兜里，这是其他应收款。如果其他应收款根本就是子虚乌有，那么，它是企业用来陷藏潜亏的\"垃圾桶\"；没卖东西，钱却暂时到了自己兜里，此为其他应付款。如果其他应付款根本就不用支付出去，那么，它是企业用来陷瞒利润的\"聚宝盆"
  - "最垃圾的会计科目是\"其他应收款\"，什么都往里塞，其实很有可能不是其他应收的款，而是隐藏的费用；最有欺骗性的会计科目是\"其他应付款\"，它冒充负债，其实很有可能不是其他应付的款，而是隐藏的收入"
  - "优秀的上市公司，其他应收款和其他应付款应当数额极小，甚至为零。对于这两个科目数字较大的公司，我们可以先打上一个经营不规范的标签"
  - "其实很多企业账面上的“其他应收款”根本就不是什么资产，而是没有能够取得发票的费用"
  - "是的，其他应收款就是个框，什么都往里面装"
  - "在财务报表中，凡是带有“其他”字眼的科目金额都不应过大，否则就可以怀疑其有问题，因为带有“其他”字眼的科目都是跟生产经营活动无关的，不应该显现出大金额"
  - "如果财报中的“其他应收款”和“其他应付款”期末余额巨大，且与“应收账款”、“应付账款”等科目的余额不相上下，甚至超过这些科目的余额时，就可怀疑“其他应收款”和“其他应付款”成了粉饰财报的“垃圾筒”和“利润调节器"
  - "是的！会计研究中也常把其他应收款看做上市公司大股东转移公司资产，侵占中小股东的利益"
  - "有一类会计科目，用途很广，会计看了偷笑，审计见了要哭，它们有一个共同的名字叫“其他”，算算有“其他货币资金”、“其他应收款”、“其他应付款”、“其他业务收入”、“其他业务支出”等。"
  - "如果你做过“借：其他应收款----股东 XX 万元，贷：银行存款”这笔分录，千万要小心，小心股东被举报抽逃出资了"
  - "应收账款与其他应收款、存货之间的转换避免了应收账款长期挂账，当存货、其他应收款日益增多时，再\"洗一次大澡\"计提减值准备进行处理。其实，更高级的造假，在将应收账款转为\"银行存款\"后，再转化为在建工程、无形资产、长期股权投资等，这样，审计就更难查了"
  - "需要注意的是，上市公司也会担心应收账款周转率急剧下降会引起投资者的怀疑，因此，可能将应收账款往其他应收款、预付账款中转移，手法是上市公司先把资金打出去，再叫客户把资金打回来，打出去时挂在其他应收款或预付账款上，打回来作款项，以冲销应收账款。因此，如果一家上市公司存在较大金额的其他应收款、预付账款时，就要分析一下是不是隐藏的应收账款"
  - "没想到，2019年下半年当地税局在进行纳税评估过程中，发现了隐藏在资本公积中的疑点数字100万元收益，依法要求企业调增了2018年度的应纳税所得额，并补缴了25万元的企业所得税以及滞纳金等"
