name: 庞氏分红（庞氏利息、庞氏工资）
key: ponzi
category: 造假识别
alias: [庞氏分红, 庞氏利息, 庞氏工资, 庞氏三费, 许氏骗局]
definition: 分红、付息、发工资的钱不是自己经营挣来的，而是靠筹资（发股、发债、借钱）流进来的新钱在买单——这就是披着合法外衣的庞氏骗局；一旦输血停止，庞氏泡沫必然破灭。利用筹资流入的款项还本付息，"还本"属于"借新还旧"，支付的利息即庞氏利息，最终还不上所借款项就沦为庞氏骗局。
formula: 判定方法：自IPO以来逐年累计自由现金流量（经营活动现金流净额+投资活动现金流净额），若持续为负，而同期仍在分红、高息举债、支付远超社会平均的薪酬，则分红、利息、工资的现金只能来自筹资活动流入——以累计自由现金流为锚、以筹资依赖度为镜。自由现金流简易算法：自由现金流=经营活动产生的现金流量净额-购建固定资产、无形资产和其他长期资产支付的现金；自由现金流为正则"造血"、为负则"失血"。
majinghao_view: |
  庞氏分红（2012年提出雏形、2020年形式化定义）：用于分红的现金中有一部分来自筹资活动流入的现金，而非全部来自企业自身经营活动和投资活动流入的现金，此即庞氏分红；支付利息的现金中有一部分来自筹资流入，则为庞氏利息；高管员工工资远高于社会平均工资、且用于工资的现金有一部分来自筹资流入，则为庞氏工资（2022年9月因中金公司人均薪酬百万却配售募资270亿而补充提出，要点有二：一是工资过高，二是现金来源于筹资）。
  总括判定：如果一家企业经营活动现金净流量根本无法满足企业自身所谓的分红、付息、工资，只能依靠融资活动和"体外输血"来驱动增长，即为庞氏分红、庞氏利息与庞氏工资。
  这套概念的共同技术内核是利润与现金流的错配：账面利润可以靠激进会计政策制造，但分红、付息、发工资需要真金白银，当"经营+投资"自由现金流长期为负时，每一分钱都只能来自新股东、新债权人的钱。
  股市庞氏骗局循环：操纵利润→抬高股价→增发配股→圈得现金→提高信用等级→申请银行贷款→继续操纵利润，一直循环下去。操纵利润既是为了从股民手中圈钱，又是为了从银行手中圈钱，但从银行圈来的钱最终会以从股民圈来的钱来偿还。恒大案以一己之力为这三个概念提供了从概念定义、学术验证、监管处罚到刑事判决的全链条实证。
  强制分红治理不了造假：造假公司可以在连续3年进行力所能及的现金分红、把利润做得中等偏上，看起来"合理"后申请再融资，再融资的钱远远大于弥补因分红损失的现金——只要报表可以随心所欲，这个游戏就能不断玩下去，融资分红本质上就是庞氏分红；与其强制分红，不如规定不分红就不能减持、减持总金额不得超过分红派息总额。
  自由现金流是照妖镜：自由现金流为正的企业"造血"，具有良好的财务弹性、能够源源不断地为股东带来现金产出；为负的企业"失血"，财务弹性差、需要外部融资。自由现金流充裕却不断扩大负债规模，存在财务造假嫌疑；能产生自由现金流却拥有需支付大笔利息费用的长期借款，则要怀疑其自由现金流本身是否真实可靠。
thresholds:
  healthy: 分红、付息、付薪的现金全部来自经营活动和投资活动流入的现金；自IPO以来累计自由现金流为正。
  watch: 累计自由现金流为负却仍维持大额分红、高息举债；有息负债率高企仍巨额分红、天价薪酬（建议企业有息负债率达到一定程度应禁止高管巨额薪水、大额分红以及减持，否则对债权人极不公平）；宣告分红又分不起、存贷双高。
  danger: 自IPO以来累计自由现金流深度为负，分红、利息、工资全靠筹资流入兜底；输血一停止，庞氏泡沫破灭；自由现金流占营业收入的5%或更多才算"印钞机"级的现金创造能力。
fraud_signals:
  - 判定只需回答一个问题：分红的现金是经营和投资活动挣来的，还是筹资活动借来的——恒大2016至2020五年经营+投资自由现金流累计-4190亿元，同期筹资净流入+4746亿元，累计分红939亿元，是教科书级庞氏分红样本。
  - 超高比例分红与造假周期同步：恒大长期维持约50%分红率（远高于同业20%-30%），且在债务风险暴露前夕达到顶峰（2020年实际支付股息577.79亿元，爆雷前夜还试图特别分红）。
  - 利息资本化藏息：恒大2017至2020年每年将450亿至694亿元利息资本化计入"开发中物业"，四年累计2252亿元——用会计技术把利息藏进资产，让"还息"在报表上消失，是庞氏利息的会计掩体。
  - 实控人同时扮演高息债最大买家：分红出境、高息回流——许氏家族将分红经红筹架构上划离岸账户后，转身认购恒大11%-13.75%的超高息美元债，分红与利息在"公司资金池→离岸个人账户→公司负债表"之间空转放大。
  - 利润对赌绑架分红：恒大向战投承诺2017-2020年净利润目标且至少将68%的净利润以分红方式分配，利润对赌直接制造"必须造出利润、必须大额分红"的双重刚性，造假从选择变为必然。
  - 庞氏工资信号：天价薪酬领取者同时就是虚假利润的制造者（夏海钧2017年领2.7亿元年薪的当年，恒大经营现金流净额为-1510亿元；证监会认定正是夏海钧"组织安排编制虚假财务报告"）；当一个行业有泡沫时，最大的泡沫就是在人才——"上亿年终奖""500万年薪挖不到一个副总裁"。
  - 借钱分红的老套路：账面10亿净利润只有0.8亿现金利润，分3亿红利，2.2亿只能动用借款，其后果必然减损公司资本。
  - 借新还旧结构：利用筹资流入的款项还本付息，"还本"属于"借新还旧"，支付的利息属于"庞氏利息"，如果最终还不上所借入的款项，就沦为"庞氏骗局"。
  - 三类高危画像：那些还不起债爆雷的、宣告分红又分不起的、存贷双高的上市公司，可能广泛存在庞氏分红、庞氏利息的行为。
  - 分红-再融资循环：造假公司可在连续3年进行力所能及的现金分红、把利润做得中等偏上，看起来挺"合理"后申请再融资——再融资的钱远远大于弥补因分红损失的现金，只要报表可以随心所欲，游戏就能不断玩下去（强制分红治理不了造假）。
  - 自由现金流充裕却扩债：如果一家上市公司自由现金流充裕，却还是不断地扩大负债规模，那么存在财务造假的嫌疑——自由现金流本可用来偿还债务、减少利息支出。
  - 自由现金流为正却长期借款：能够产生自由现金流的公司一般不会借贷经营（高额财务费用影响利润），若拥有需支付大笔利息费用的长期借款，要怀疑其自由现金流是否真实可靠。
  - 交叉验证：存贷双高、爆雷、高派息的企业要高度警惕；财务造假的公司反而常是"铁公鸡"——净利润是虚增的，里面根本没有钱，拿什么分红。
cases:
  - company: 中国恒大
    article: "407156353"
    point: 2016-2020五年经营+投资自由现金流累计-4190亿元、筹资净流入+4746亿元，累计分红939亿元，其中许氏夫妇及家族获529.65亿元；2026年许家印被判无期徒刑，判决书认定其"组织财务造假，以分红名义侵占公司财产"。
  - company: 华夏幸福
    article: "254805104"
    point: 自2011年借壳以来逐年累计的自由现金流量持续为负值，分红、付息都沦为"庞氏分红与庞氏利息"，输血停止后庞氏泡沫破灭、暴雷。
  - company: 中金公司
    article: "254805104"
    point: 人均薪酬百万（高管天价工资、普通员工百万年薪），2022年却拟配售股份募资不超270亿元——马靖昊由此触发提出"庞氏工资"概念；概念提出原文见2022年9月24日雪球文（231465049）："连人均薪酬百万的中金公司都差钱，要募资，简直要惊掉下巴了"。
  - company: 易联众
    article: "283191418"
    point: 实控人2013年解除限售后套现10亿元，而给股民的股息率低于银行存款利率，马靖昊称"这与庞氏骗局没有本质区别"（庞氏减持）。
