---
name: 预付账款
key: prepaid
category: 资产质量
alias:
- 预付款项
- 预付货款
- 预付工程款
definition: 东西还没有买入，钱就到了别人的兜里——先将钱放在供应商的手上，但供应商还没有给你产品或者为你提供服务（包括预付货款和预付工程款）。
formula: 核心监控比率：预付账款/总资产（大于10%即预警造假可能性较大）；同时持续关注预付账款占营业收入、营业成本或总资产的比例是否大幅波动。
majinghao_view: |
  预付账款快速增长表明公司对供应商的议价能力较弱；经常需要预付大量货款，说明企业在整个产业链中的地位不高或者信用不好。
  预付账款是一个高危科目：造假公司可能利用这个科目先套出资金，实际并未支付给供应商，而是支付给关联方挪作他用或进行体外循环虚增收入；由于大家都格外注意应收账款的异常增加，老道而经验丰富的造假公司会选预付账款来取代应收账款进行造假。
  这是财务造假的第三重境界：通过预付账款把钱转到关联方公司，转转悠悠，再通过经营活动现金流入流回，从现金流角度看就是完美的"真实"生意，收现比和净现比都会失效，只能靠常识判断——警惕预付账款科目余额特别高且没有合理解释的企业。
thresholds:
  healthy: 预付账款账龄一般在一年以内，实际付款周期一般最多3个月；预付款项+其他应收款占总资产的比例很小。
  watch: 上市公司只要存在超过3个月的预付账款就要关注；预付款项与其他应收款合计占总资产的比例较大；预付账款占营收/成本/总资产的比例出现大幅波动又找不到合理解释。
  danger: 预付账款/总资产大于10%，预警造假可能性较大；大量超过半年期以上的预付账款，资金可能被挪用；超过一年期几乎可以肯定存在异常，可能表明公司以预付货款的名义为关联方提供资金。
fraud_signals:
- 预付账款突然大幅增加，尤其是预付工程款或用来购买专利/非专利技术：很可能通过预付款的形式把资金转移出去，再以营业收入的形式流回来，虚增利润。
- 长期挂账：预付账款作为流动资产一般1年以内应收到存货，好几年挂在账上就可能是虚增采购；供应商无法供货的，预付账款也应早退回购买方。
- 预付账款账面价值非常高、甚至是账面价值最高的资产：不符合商业逻辑（这些资金要被上游无偿占用）。
- 查前五名预付款对象的工商信息判断是否构成关联方关系，是关联方或压根没有披露就要引起注意。
- 预付账款与应付票据及应付账款、应付账款周转率等反映上游议价能力的指标变动趋势背离。
- 将应收账款重分类计入预付账款以掩盖挂账（资金紧张、银行账户被冻结时预付款项反而大幅增加即异常）。
- 套出资金后虚构预付账款的两善后手法：虚增发出商品（虚构生产过程把"原材料"转化为"产成品"）；"以资抵债"（抵债资产往往是残次滞销品、存在瑕疵且价格高估）。
- 采购总额与购付现金背离：当年采购总额大幅度低于现金流量表"购买商品、接受劳务支付的现金"项目的金额，且预付账款没有显著增加、应付款项不降反增，不足以解释采购数额与支付资金之间的差额，可能暴露财务数据造假。
- 将预付账款调整为存货以掩盖套取资金：如广州浪奇借此在2018、2019年两年间虚增存货合计达20.38亿元，后来以"存货丢了"自圆其说，实则是上市公司成了实控人的提款机。
cases:
- company: 万福生科
  article: '281347913'
  point: 创业板造假第一例：利用农户身份开立由公司控制的银行账户，账上资金以粮食收购预付款名义打出，再以不同客户回款名义分笔转回，利用资金循环虚增销售收入、虚增经营现金流量。
- company: 神雾环保
  article: '281347913'
  point: 2019年三季报预付款项16.57亿元、占总资产比例高达30.23%，是账面价值最高的资产，2017年由1.52亿元激增至15.52亿元且长期挂账，审计因此出具保留意见。
- company: 金亚科技
  article: '281347913'
  point: 2014年年报披露的巨额预付工程款3.1亿元"子虚乌有"，将虚增收入造成的漏洞通过虚构预付账款向外引导，实现报表表面的平衡关系。
- company: "*ST利源"
  article: '281347913'
  point: 公司及子公司多个银行账户被冻结、资金紧张，2018年半年报预付款项却大幅增加，迫于交易所问询承认将应收账款重分类计入预付账款。
- company: 广州浪奇
  article: '214344583'
  point: 为掩盖套取资金，通过将部分预付账款调整为存货的方式，在2018、2019年两年间虚增存货合计达20.38亿元，后来居然说存货丢了，实则是上市公司成了实控人的提款机。
- company: 万福生科（预付账款三步分录还原）
  article: '147999312'
  point: 利用预付账款套取资金的完整账务路径——第一步将钱洗出来（借预付账款，贷现金、银行存款等）；第二步记录原材料收购的预付款（借材料采购，贷应交税费—应交增值税（进项税额）按收购凭证13%扣税，贷预付账款）；第三步用真实的交易虚增收入（借现金、银行存款，贷主营业务收入、贷应交税费—应交增值税（销项税额），同时借主营业务成本、贷存货）。资金以粮食收购预付款名义打出、再以不同客户回款名义分笔转回，利用资金循环虚增销售收入与经营现金流量。
- company: 同济堂
  article: 141619219
  point: 2019Q3预付账款6.505亿元，与公司“缺钱”的表态矛盾，质疑套取资金体外循环。
- company: 洪九果品
  article: 409828543
  point: 2023年末预付款44.7亿流向零社保等异常新增供应商（Q4付34.2亿）——预付款成为资金体外转移的主通道。
quotes:
- 东西还没有买入，钱就到了别人的兜里，此为预付账款
- 可以说，预付账款是一个高危科目
- 预付账款超过一年期，一般问题比较大，很少会有企业在不急于提货的情况下，提早很长时间将资金打出去
- 如果一家上市公司存在其他应收款或预付账款挂账，要么是大股东占款，要么是这些流出的资金已经包装为销售回款重新流回公司了
- 对于超过一年的预付账款，几乎可以肯定存在异常情况，可能表明公司以预付货款的名义为关联方提供资金
- 有一些上市公司财务造假被查，预付账款往往是导火索
- 如果一家上市公司的预付账款和在建工程余额突然间增加了好几倍，而其固定资产并未明显增加，这时候就要怀疑该公司有可能通过预付账款和在建工程将资金转移到体外，再通过体外资金的流入虚增收入和利润
- 预付账款可以用来藏匿虚增的利润，因为虚增利润，一般也要虚增现金，这些虚增的现金可能就是公司与“关联方”共谋提供的，它最终还是要还回去的，因此，就通过预付账款支付出去
- 为什么审计的事务所基本都没能够发现预付账款异常而导致的财务造假呢？主要是因为事务所本身没有发现假账的动力，毕竟事务所是乙方，要吃甲方的饭
- 对于任何不正常的巨额资产减值损失，都应该查查是否存在职务犯罪
- 会计差错绝不是财务造假的挡箭牌
- 为掩盖套取资金，广州浪奇通过将部分预付账款调整为存货的方式，在2018、2019年两年间虚增存货合计达20.38亿元。后来居然说存货丢了，好像洗衣粉也会长腿跑路？！实则是上市公司成了实控人的提款机
- 如果一家上市公司当年的采购总额大幅度低于现金流量表中“购买商品、接受劳务支付的现金”项目的金额。在此背景下，如果预付账款没有显著增加、应付款项不降反增，就不足以解释采购数额与支付资金之间的差额，也不符合正常的逻辑，可能暴露出该公司进行了财务数据造假
- 一家上市公司如果向明显处于行业弱势地位的供应商大量预付款项，这么慷慨大方，估计是有不可告人的目的。一家公司需要预付大量款项给供应商，一种可能是企业在整个商业生态链上处于弱势地位，还有一种可能就是通过预付款将资金套出公司，最后会以营业收入的名义流回公司，从而达到增加收入的目的。
- 所以我常说，预付账款/总资产超过10%，就要预警造假风险。
