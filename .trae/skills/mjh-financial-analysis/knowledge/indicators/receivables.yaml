---
name: 应收账款
key: receivables
category: 资产质量
alias:
- 白条收入
- 应收款项
definition: 东西已经卖出去了，钱还在别人的兜里——客户拿了东西，钱还在客户手中，营业收入虽然算进来了，但现金没到自己手上，纯属"白条收入"。
formula: 核心比率：（应收账款+合同资产）/总资产；应收账款/营业收入（同行业对比）；营业收入现金含量=[销售商品、提供劳务收到的现金/（1+增值税税率）]/营业收入。应收账款周转率＝营业收入/应收账款平均余额［（期初应收账款+期末应收账款）/2］，周转天数为换算口径，取决于相对客户的强势或弱势地位、销售模式以及对应收账款的管理能力；若应收账款年末计提了坏账准备，计算时须将坏账准备加回，否则坏账计提越多、账面应收越少、周转率反而越快——如某影视类企业年末应收账款6000万元、对乐视3000万元全额计提坏账后账面一下少了一半，周转率一下就快了，实为会计数字游戏。
majinghao_view: |
  应收账款是"白条收入"，没有现金流入，应收账款增加必然带来现金流量减少。虽然应收账款可以提高收入和利润，但提高不了现金流，企业最终是赚钱而不是赚利润。
  正常情况下，应收账款的变化幅度应与营业收入的变化一致；应收增速长期高于营收增速，要么是放宽信用条件刺激销售，要么是通过"应收账款"科目虚构收入。
  虚构收入的上市公司往往表现为应收账款急剧增加、应收账款周转率急剧下降。应收账款占营收比重高还说明产品缺少稀缺性和竞争性，企业只能靠赊销博利润，产业链上没有话语权。
  应收账款周转率是用于衡量应收账款流动程度的指标，取决于相对客户的强势或弱势地位、销售模式以及对应收账款的管理能力：周转率高表明赊账少、收账迅速、账龄较短、资产流动性强、短期偿债能力强、坏账损失较少；周转率过低则说明催收账款的效率太低或信用政策十分宽松，会影响资金利用率和资金的正常周转、增加坏账比率。赊账肯定是产品不是那么有竞争力，产品非常有竞争力就不是赊账了，而是预收账款。
  毛利率与应收账款周转率、存货周转率一般呈正相关：毛利率提升、应收账款周转率和存货周转率同时提升，这样的毛利率提升一般是真实的；毛利率提升而两个周转率却下降，毛利率可能存在造假——一是营业收入可能是虚增应收账款导致应收账款周转率下降，二是营业成本可能是少结转成本导致存货周转率下降。
  应收账款数额逐年增加的同时周转率却逐年降低，说明公司存在由于赊账而导致的巨额坏账的财务风险；应收账款周转率很低则表明应收账款的实际偿还率也很低，此时若利润额很高，企业可能虚构了销售额、操纵利润。
thresholds:
  healthy: "（应收账款+合同资产）/总资产最优秀的公司小于1%（产品非常畅销），优秀公司一般小于5%（产品竞争力强）；应收账款占营业收入最好低于15%（市场认可后一般会降到20%以下）；应收项目占营业收入比重低于10%意味着90%以上一手交货一手收钱；应收账款占流动资金的合理比例在30%左右；应收账款周转率与同行相当或更快，且按加回坏账准备的口径还原后依然稳定。"
  watch: 应收账款增速持续高于营业收入增速（若营业收入增速仅为应收账款增速的一半以内，要么向下游压货要么造假）；应收账款周转天数明显高于同行；应收账款/营业收入比值在同行中偏高；应收账款数额逐年增加的同时应收账款周转率却逐年降低（因赊账导致的巨额坏账财务风险）；应收账款净额占流动资产的比例超过40%、占总资产的比例也在30%以上，且毛利率低于行业平均水平、应收账款周转率相对同行明显偏低——渠道填塞做大营业收入的典型画像，看起来盈利了其实是潜亏。
  danger: "（应收账款+合同资产）/总资产大于20%的公司需要淘汰掉；应收账款连年超过营业收入；应收账款占总资产比例长期在40%上下（某创业板IPO被否企业即如此）；应收账款增速大于营收增速且经营活动现金流为负值，应收账款十有八九含大量水分；应收账款占营业收入八成以上、主营业务收入主要依赖应收账款（如麦杰科技2009-2011年占比80.34%-83.16%）；应收账款周转率远低于同行（如麦杰科技仅1.5次左右、同行上市公司5.8次左右）而利润额很高，应收账款的实际偿还率也很低，可能虚构销售额操纵利润。"
fraud_signals:
- 虚构收入往往表现为应收账款急剧增加、应收账款周转率急剧下降。
- 营业收入增速仅为应收账款增速的一半以内：要么销售部门向下游压货，要么财务部门在造假。
- 相同行业、相同生意模式下应收账款周转天数明显提高：可能是经营恶化前兆，也可能应收账款有相当部分是虚增的。
- 业绩暴雷由计提应收账款减值损失导致：多半是收入造假所为。
- 应收账款和销售收入大幅增长但应付账款不增长或增长很低：销售收入很可能并未真实增长，应付账款暴露了公司真实经营情况。
- 应收账款增速较快甚至高于营收增速，但存货没有计提跌价准备：产品依赖赊销、处于高度竞争市场，存货跌价应是常态，不计提有问题。
- 应收账款向其他应收款、预付账款转移：上市公司先把资金打出去挂在其他应收款或预付账款上，再叫客户把资金打回来冲销应收账款；若其他应收款、预付账款金额较大，要分析是不是隐藏的应收账款，多半是造假形成、永远收不回。
- 假销售手法：找一个托做分录"借:应收账款，贷:营业收入、应交税费-应交增值税-销项税额"。
- 应收账款周转率很低而利润额很高：应收账款的实际偿还率也很低，企业可能虚构了销售额、从而操纵利润。
- 应收账款增长率远高于收入增长率，但计提的坏账准备没有明显增长：公司怕对业绩造成不利影响而少计提坏账准备。
- 渠道填塞法（channel stuffing）：应收账款净额占流动资产的比例超过40%、占总资产的比例也在30%以上，毛利率低于行业平均水平，再加上应收账款周转率相对同行明显偏低——基本上可判断公司为粉饰报表、做大营业收入采取了渠道填塞的销售策略，看起来盈利了，其实是潜亏（虚增的应收账款就是披着资产外衣的费用，以"水分"形式潜伏在资产负债表中）。
- 周转率计算口径陷阱：年末计提坏账准备未加回，坏账计提越多、应收账款账面越少，周转率反而"变快"、周转天数"变少"，全额计提坏账反而美化指标，须按加回坏账准备的口径还原后再横向比较。
- 毛利率提升而应收账款周转率、存货周转率却下降：毛利率可能存在造假问题（虚增应收账款导致应收账款周转率下降、少结转成本导致存货周转率下降）。
