quotes:
- 应收账款就是客户拿了东西，钱还在客户手中
- 这些营业收入纯属白条收入，没有现金流入
- 虽然应收账款可以提高收入和利润，但是提高不了现金流，企业最终是赚钱而不是赚利润
- 正常情况下，应收账款的变化幅度应与营业收入的变化一致。如果应收账款增速高于营业收入的增速，可能是因为公司放宽信用条件以刺激销售；与此同时，如果存货余额居高不下，可能公司人为通过“应收账款”科目虚构营业收入
- 虚构收入的上市公司往往表现为应收账款急剧增加，应收账款周转率急剧下降
- 另外，收入和税金都可以结转，空留下应收账款孤独地守望着，象个寡妇，最终坏账处理拉倒
- 应收账款周转率是用于衡量应收账款流动程度的指标，其取决于相对客户的强势或弱势地位、销售模式以及对应收账款的管理能力
- 如果应收账款在年末计提了坏账准备，那么，在计算这个指标时，要将坏账准备加回去，否则，计算出来的应收账款周转率可能会告诉大家一个错误的信息
- 如果我们不懂这个道理，应收账款周转率的计算可能只是单纯的一个会计数字游戏而已
- 毛利率提升，如果应收账款周转率、存货周转率同时也提升，这样的毛利率提升一般是真实的；反之，如果毛利率提升，而应收账款周转率、存货周转率却下降，毛利率可能存在造假问题，一是营业收入可能是由于虚增应收账款而导致应收账款周转率下降；二是营业成本可能是由于少结转成本而导致存货周转率下降
- 很低的应收账款周转率意味着该上市公司极可能通过做假账虚构应收账款来虚增收入，从而操纵利润
- 况且赊账肯定是产品不是那么有竞争力，如果产品非常有竞争力，就不是赊账了，而是预收账款了
- 如果发现某上市公司近几年应收账款数额逐年增加的同时，应收账款周转率却逐年降低，这就说明了该公司存在着由于赊账而导致的巨额坏账的财务风险
- 一般来讲，一家上市公司应收账款净额占流动资产的比例超过40%，占总资产的比例也在30%以上，其毛利率低于行业平均水平，如果再加上它的应收账款周转率，相对于同行，明显偏低。那么基本上可判断该公司为了粉饰报表，做大营业收入，采取了渠道填塞的销售策略，看起来是盈利了，其实是潜亏
- 潜亏就是实际上已经亏损了，但是在利润表中却没有得到反映，那么，它潜伏在什么地方呢？它当然是潜伏在资产负债表中，以“水分”形式在资产方滥竽充数！比如虚增了应收账款，这些应收账款其实就是“水分”，也就是披着资产外衣的费用
- 如果一家上市公司的应收账款增长率远高于收入增长率，未来应收账款存在无法收回从而导致坏账金额增加的风险，如果该公司计提的坏账准备没有明显增长，估计是怕对公司业绩造成不利影响而少计提
- 我们在分析应收账款周转率 [ 营业收入/（（期初应收账款+期末应收账款）/2）] （应收账款周转天数=365/应收账款周转率）时，如果应收账款在年末计提了坏账准备，那么，在计算这个指标时，要将坏账准备加回去，否则，计算出来的应收账款周转率可能会告诉大家一个错误的信息。
- 若应收账款周转率与存货周转率同步下降，表明企业存货转换为应收账款的速度变慢，应收账款转换为现金的速度也变慢，这种情况，表明企业的市场前景不容乐观，产品不好卖，应予以警觉。
- 一般来讲，如果上市公司应收款账增长率达到30%，且应收账款/总资产达到50%，则表明该公司含有大量的‘水分’，严重潜亏着。
- 应收账款的存在，让利润割断了与现金流的关系，使得企业利润的增长可以与现金流不同步，甚至可能恶化现金流，因为企业除了要垫支成本费用外，还要给政府交纳流转税和所得税。
- 将虚增收入虚挂‘应收账款’的做法会导致应收账款大幅增加，容易被发现。因此，许多公司不将虚增的收入挂在应收账款上，而是借用采购名义将自有资金转移至体外，再借销售回款的名义转回公司；另外，为做大利润，会少结转存货，少计提销售成本。存货造假的直接后果是公司存货的增长。
- 通俗来讲，应收的款项，不是干等着就能收，还需要干别的才可以收，这个时候就要计入合同资产。因此，从资产质量上讲，合同资产弱于应收账款。
- 东西销出去了，钱拿不回来，其实，你是送货员，还是送税员——增值税、所得税可都是按确认收入算的，一分不能少。钱没收到，税先交了，这就是拖欠对中小企业最狠的地方。
