---
name: 总资产收益率
key: roa
category: 盈利能力
alias:
- ROA
- 总资产净利率
- 总资产报酬率
definition: 从资产负债表左侧看，不管钱是股东的还是借来的，全部资产整体上能赚回多少回报——ROA的高低直接反映公司的竞争实力和发展能力。
formula: 总资产收益率=净利润÷平均资产总额（平均负债总额+平均所有者权益）×100%，也常简化为ROA=净利润/总资产；总资产净利率=销售净利率×总资产周转率；与ROE的关系：ROA=ROE×(1-资产负债率)，即ROE=ROA×权益乘数。他注明三种常见算法及其视角：①ROA=净利润/总资产（站在企业所有者角度——借钱负债+自掏腰包权益，总共投入总资产这么多钱，最后得到净利润回报）；②ROA=EBIT/总资产，EBIT=利息费用+企业所得税+净利润（站在债权人、政府、企业所有者三方角度——利息费用相当于银行的利润、企业所得税相当于政府的利润）；③ROA=（净利润+利息费用）/总资产（站在投资人角度——投资人与EBIT中的企业所得税无关，最多拿回"净利润+利息费用"这么多回报）。他强调财务分析思维要变通，分子用净利润、息税前利润甚至"净利润+财务费用"都可以，只要知道所取数据的意义所在。
majinghao_view: |
  ROA的视角是从资产的角度衡量回报，不关注资本结构——总资产收益率才是一家企业真实的盈利能力，ROE是加了杠杆后被扭曲的盈利能力，这就是分析ROA的意义所在。
  ROA是决定公司是否应举债经营的重要依据：息税前ROA大于债务利息率时，负债筹资才有正的财务杠杆效应；ROA回落低于有息负债成本时，有息负债就是累赘。
  ROA适合作为分析资产盈利能力的指标，但不能作为管理上的考核指标——考核企业效益只能用ROE（因为适度举债会摊低ROA但增厚ROE）；房地产、银行等高负债企业适合用ROA评价，用ROE扭曲成分较大。
  为何不能拿ROA当考核指标（他的数字例证）：某企业净资产100万+银行贷款100万，清偿利息完税后纯收益20万，ROA为10%、ROE为20%；再增贷200万后纯收益可达30万，ROA降至7.5%、ROE却升至30%——企业显然应该增加贷款、降低ROA、提升ROE，若以ROA为考核指标就没有管理者愿意增加贷款了，因此ROA该升就升该降就降、不必顾虑。
  ROA高可能是无息负债少所致（意味着在产业链上地位不高），此时需再比较分析ROIC。
  通过分析ROE以及其杜邦分解，再结合ROA分析，可以了解一家企业的生意模式（段永平亦认为ROE或ROA对了解生意模式有帮助、但不是充分条件）；只要借款的冲动是在ROA大于借款利率的情况下，这种冲动就是合理的。他也提醒：不要由于巴菲特选股最看重ROE而盲目迷信ROE。
thresholds:
  healthy: 总资产收益率一般应该≥5%或≥一年期银行贷款利率；连续三年以上ROA＞6%的企业可以纳入投资视野（《ROA，ROE，ROIC》口径）
  watch: ROA低于5%（或6%）但负债以无息负债为主——无息负债成本为0，ROA在0%—5%（0%—6%）时照样毫无负担；息税前ROA小于债务利息率但大于零时，公司至少可以通过减少负债来获得更大的收益
  danger: ROA低于5%（或6%）却背有大量有息负债——有息负债就是累赘；ROA持续小于无风险利率，公司继续经营就是在毁灭价值；上市公司中大部分企业总资产收益率达不到5%
fraud_signals:
- "“ROE高而ROA低”的组合信号：ROE与ROA差异越小说明负债越少、越依靠自身造血；差异越大说明负债越多，若高ROE靠有息负债堆出来，该指标背后就隐藏着风险"
- 用ROA与ROIC的差距反推无息负债使用情况：企业的无息负债越多，二者差异越大；一般ROA小于ROIC，若二者非常接近，说明无息负债很少，多半表明该企业在产业链中的地位不强
- 识别"真有钱假有钱"：如果一家上市公司能够产生自由现金流，却拥有需支付大笔利息费用的长期借款，就要怀疑其自由现金流是否真实可靠——通常能产生自由现金流的公司不会借贷经营
cases:
- company: 中国海油
  article: '405247485'
  point: 总资产周转率从0.49次降到0.37次（总资产四年膨胀18.2%、营业收入反而缩5.7%），是ROE四年跌掉10个百分点的最大贡献者——资产越滚越大、产出原地踏步，每一块钱资产创造收入的能力打了七五折
quotes:
- 总资产收益率ROA才是一家企业真实的盈利能力，而净资产收益率ROE是因为加了杠杆后被扭曲的盈利能力。这就是分析ROA的意义所在
- 总资产收益率的高低直接反映了公司的竞争实力和发展能力，也是决定公司是否应举债经营的重要依据。总资产收益率一般应该≧5% 或 ≧一年期银行贷款利率
- 有息负债的成本，一般情况至少是5%。而无息负债的成本是0。因此，当公司的总资产收益率回落低于5%的时候，有息负债就是累赘
- 有息负债的成本，一般情况至少是6%。因此，当公司的总资产收益率回落低于6%的时候，有息负债就是累赘
- 上市公司中，大部分企业总资产收益率是达不到5
- 总资产收益率可以作为分析资产盈利能力的一个指标，但不能作为一个管理上的考核指标
- 最好是在没有或存在很少有息负债的情况下，ROA相对较高，才更具意义
- 房地产、银行适合用ROA来评价
- 这些企业负债都是非常高的。用ROE相对来讲，扭曲的成分较大。
- 这些企业负债都是非常高的。用ROE相对来讲，扭曲的成分较大。
- 总资产收益率如果持续小于无风险利率，那公司继续经营就是在毁灭价值
- 由此可见，考核企业效益的指标只能是净资产收益率，总资产收益率则该升就升该降就降，不必顾虑
- 只要借款的冲动是在ROA大于借款利率的情况下，这种冲动就是合理的
- 大伙不要由于巴菲特选股指标最看重ROE而盲目迷信ROE，要真正了解ROE与ROA的区别与联系，这样，才能够真正理解企业的盈利能力
- 通过分析ROE以及其杜邦分解，再结合ROA分析，是可以了解一家企业的生意模式的
- 财务分析没有这么大的功效，顶多只是一个排雷的作用，过分强调财务分析在选股中的作用是错误的
