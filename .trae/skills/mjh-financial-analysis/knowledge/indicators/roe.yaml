name: 净资产收益率
key: roe
category: 盈利能力
alias: [ROE, 股东权益报酬率, 权益净利率]
definition: 股东每投入一元钱，经过企业经营之后，每年能为股东带来多少钱的收益（净利润÷净资产），衡量公司运用自有资本的效率。
formula: ROE=净利润÷净资产；两种口径：全面摊薄ROE=报告期净利润÷期末净资产（静态，经营者喜欢），加权ROE=净利润×2÷（期初净资产+期末净资产）（动态，投资者喜欢）；杜邦分解：ROE=销售净利率×总资产周转率×权益乘数；他另给出ROE=每股收益÷每股净资产=PB÷PE，以及ROE=总资产收益率×杠杆率。改进口径：归属母公司股东的ROE=当期归属于母公司股东的净利润÷【（期初归属于母公司股东的净资产+期末归属于母公司股东的净资产）/2】（衡量普通股股东权益部分、扣除少数股东权益；例：母公司净利2000万+子公司净利1600万×80%持股比例=3280万归母净利）；归属母公司股东的扣非ROE=当期归属于母公司股东的扣非净利润÷同期平均归母净资产（剔除非经常性损益如卖楼收益，看真实ROE）。提高ROE的五种事项：①提高总资产周转率②更低成本的财务杠杆③更高的财务杠杆④更低的所得税率⑤更高的销售收入经营利润率——这也是所有可以提高净资产收益率的方式。
majinghao_view: |
  ROE既是财务分析的出发点，也是贯穿财务分析的主线，是综合性非常强的指标，可以衡量任意行业的公司；从长期来看，股票投资回报接近企业的ROE。
  但ROE有两大缺陷：一是分子净利润多半是虚的，用含金量低的净利润计算出来的ROE可能具有欺骗性；二是分母净资产减记任何一项资产、或增加一项负债都会缩小净资产、推高ROE。因此要用净利润现金含量以及资产负债率这两个指标来弥补ROE的不足。
  ROE由于加了杠杆后扭曲了企业的盈利能力——要警惕有大量有息负债的高ROE企业，那是以牺牲企业经营稳健程度为代价的；房地产、银行等高负债企业用ROE评价，扭曲的成分较大，更适合用ROA。
  提升ROE有三条路径，由此可反推盈利模式：高ROE主要来自高净利率的，产品往往有品牌力、差异化竞争、竞争相对不激烈；主要来自高总资产周转率的，通常竞争激烈、毛利率净利率较低，属于低成本"薄利多销"模式（如沃尔玛）；主要来自高财务杠杆的，则经营风险较大。
  上市公司ROE往往在刚上市的几年表现不错、之后明显下滑——总资产周转率因融资扩大的总资产而降低，资产负债率也被摊薄，属正常现象；但随着规模扩大仍能长期保持较好ROE的公司，说明管理层具备带领企业"从一个胜利走向另一个胜利"的能力，可以给予更高的估值。
thresholds:
  healthy: 常年持续稳定在20%以上（巴菲特选股标准：净资产收益率不低于20%且能稳定增长）；ROE处于10%-15%为一般公司，15%-20%为优秀公司，20%-30%为杰出公司；资产负债率低尤其有息债务率低的情况下，ROE还能长期保持在15%以上，是值得投资的；连续多年ROE处于15%-30%的公司是非常优秀的上市公司；"股王"贵州茅台等超级大牛股的ROE基本处于30%以上；ROE常年保持15%以上时再看市盈率，若低于同行业水平可将该股列入高度关注范围
  watch: ROE突然提高，可能是这一年净利润来自期间炒股或卖家产等一次性行为；低于当年银行理财收益率（如6%）就说不过去，公司还不如去买银行理财产品；要对比公司自身历史，相对稳定、不要忽高忽下
  danger: ROE长期低于10%的公司应尽量回避；靠大量有息负债堆出来的高ROE；ROE忽高忽下不稳定；股价涨幅过大时即使指标优秀，增长业绩也可能已在中短期透支
fraud_signals:
  - 用净利润现金含量（净现比）与资产负债率两项弥补ROE的不足：净利润含金量低时，算出来的ROE可能具有欺骗性
  - ROE本身可用于识别造假：康美药业2017年ROE为13.41，和行业平均值13.81差不多；2018年降至3.91，远低于行业平均值的11.82；2019年差距更大——与行业均值逐年拉大的背离反映其实施了财务造假
  - 减记资产或增加负债都会缩小净资产、被动推高ROE——要识别靠"减少股东权益/加负债"做出来的ROE
  - 检验ROE提高的方式（每股收益E与每股净资产A的五种组合）：E提高A提高财务状况最好、值得褒奖；E提高A不变财务状况良好、值得提倡；E提高A下降财务状况不明、需查明；E不变A下降财务状况有问题、应予警惕；E下降A下降财务状况糟糕、须摒弃——不能单纯因ROE本身值较高就认为公司获利能力较高，需研究ROE提高的方式
  - 大比例现金分红也能提高ROE（分子净利润不变、分母净资产减小）——利润负增长、零增长或低于5%增长的企业，依靠大比例现金分红也能维持高ROE，但这种做法不如将收益留存创造出更多利润的企业；注意识别这种"技术性"抬升（想想巴菲特为什么长期不分红）
  - 上市后ROE下滑属正常现象（杜邦归因：融资做大总资产摊薄总资产周转率、资产负债率下降拉低权益乘数），且上市后股权融资节省大量财务费用本应增厚净利润——但若上市后销售净利率不升反大幅下降、特别是降幅在4个百分点以上，基本上可以确定企业上市前的财务报表存在业绩注水
cases:
  - company: 中国海油
    article: "405247485"
    point: ROE从2022年的26.00%跌到2025年的15.64%，杜邦拆解显示最大"大盗"是总资产周转率（0.49次→0.37次，贡献约-5.7个百分点），而非油价（净利率仅贡献-2.7个百分点）——资产膨胀与收入停滞稀释了股东回报
  - company: 康美药业
    article: "344499958"
    point: ROE从2017年的13.41（贴着行业平均13.81）滑到2018年的3.91（远低于行业平均11.82），逐年拉大与行业均值的差距，暴露财务造假
  - company: 华夏幸福
    article: "281929079"
    point: 当年ROE在20%以上、最终退市——高ROE是加杠杆堆出来的，通过高负债堆出来的高收益和不加杠杆产生的高收益完全不一样
  - company: 恒大地产
    article: "344499958"
    point: 靠高杠杆率赚钱（拿别人的钱赚钱）盈利模式的代表，当银根收紧、融资困难时，这类企业将受到巨大冲击
  - company: 贵州茅台
    article: "344499958"
    point: 靠高净利率赚钱盈利模式的代表——产品本身吸金、有很深的护城河和定价权，别的企业短期内很难复制
  - company: 珠江啤酒
    article: "167175033"
    point: 2019年毛利率46.84%为A股啤酒上市公司最高、净利率12.06%远高于青岛啤酒的6.89%，ROE却仅5.97%、远低于青岛啤酒的9.97%——杜邦拆解：总资产周转率0.35（青岛0.78，固定资产周转率1.33排A股啤酒倒数第二）、权益乘数1.39（青岛1.87）双双拖累；毛利率高不等于ROE高，重资产低周转照样稀释股东回报
  - company: 深南电路
    article: "178259776"
    point: 近三年平均ROE高达24.45%，2020年杜邦拆解中销售净利率12.34%是出众盈利能力的主要驱动力（总资产周转率0.89、权益乘数1.88均属正常水平）——高ROE来自高净利率而非杠杆，能持续保持高ROE的公司一般是拥有护城河的表现
  - company: 沃尔玛
    article: "169495494"
    point: 高ROE主要来自高总资产周转率的"薄利多销"模式代表——产品毛利水平一般，靠更快的资产周转速度创造好的净资产收益率
  - company: 恒瑞医药
    article: "146941400"
    point: 2011-2019年加权净资产收益率都维持在21%以上，这么长的时间里能够穿越牛熊，堪称奇迹——长期能够保持高ROE的公司很厉害，因为每年净利润转化为新增净资产、分子分母同时扩大，ROE本应逐年下降
  - company: 顺丰控股
    article: "146941400"
    point: 2019年ROE为14.86%，杜邦分解显示主要来自高的财务杠杆——资产负债率54.08%（同行快递公司约30%）、有息负债总额224.5亿元、有息负债率26.86%；短期内虽无债务危机，但存在较高的财务风险
  - company: 片仔癀
    article: "144814823"
    point: 2018年净资产收益率24.98%，高于云南白药的17.37%、东阿阿胶的19.72%，近10年平均ROE超20%——规模小（2018年收入47.66亿元，仅为云南白药267.1亿元的零头）反而成就“小而美”，加上配方属国家绝密、获永久保护，无形资产护城河保障了较高盈利能力。
  - company: 贵州茅台
    article: "148126463"
    point: 2019年毛利率91.3%、净利率51.5%、ROE 30.3%——成本几十块钱的酒卖到两千块以上，是酒类企业中唯一做到“产量决定销量”的公司，盈利能力强大、自身造血能力强、现金流非常好，高ROE“牛得太有道理”。
  - company: 恒瑞医药
    article: "146824977"
    point: 自2000年上市以来每年营收和净利润均保持增长，上市20年间营业收入、净利润分别增长47倍、80倍，穿越牛熊持续增长堪称奇迹——长期投资价值的关键在护城河，恒瑞的持续增长离不开高比例的研发投入。
quotes:
  - "再次强调一次，炒股时，建议大家去选择净资产收益率能够常年持续稳定在20%以上的企业"
  - "从长期来看，股票投资回报接近企业的ROE"
  - "企业净利润多半是虚的，说不清楚。用含金量低的净利润计算出来的净资产收益率可能具有欺骗性"
  - "净资产价值减少，ROE就会增加。也就是一家公司减记了任何一项资产，净资产的减少会导致ROE的上升"
  - "因此，在分析净资产收益率时，要使用净利润现金含量以及资产负债率这两个指标来弥补ROE的不足"
  - "净资产收益率ROE可能由于加了杠杆后而扭曲了企业的盈利能力"
  - "因此，要警惕有大量有息负债的高净资产收益率的企业"
  - "如果一家上市公司在资产负债率低尤其是有息债务率低的情况下，ROE还能长期保持在15%以上，是值得投资的"
  - "那些总是能在低负债并保有充分自由现金流的情况下，ROE还能长期保持优秀的企业，是值得投资的"
  - "平时我也做点股票，我会把过去连续 5~10 年平均 ROE 低于 15% 的企业全部排除掉，只关注那些长期平均 ROE＞15% 的企业。"
  - "长期 ROE 高的公司不一定是优秀的公司，但是长期 ROE低 的公司一定不是优秀的公司！"
  - "这个指标可以衡量任意行业的公司，不像毛利率与净利率与其他行业相比没有意义，只能与同行业相比才具分析价值"
  - "ROE突然提高，原因可能是这一年净利润来自期间炒股，或卖家产，这种提高都是一次性行为，无以为继"
  - "只有净资产收益率不低于15%，而且能稳定增长的企业才值得进行投资研究。也就是说，投资者遇到那些ROE长期低于10%的公司，应尽量回避"
  - "经营者喜欢摊薄ROE，投资者喜欢加权ROE"
  - "那些超级大牛股，比如“股王”贵州茅台的ROE则基本处于30%以上"
  - "不能单纯从净资产收益率(Roe)本身值较高就简单地认为公司获利能力较高，需要研究ROE提高的方式"
  - "净资产收益率是衡量一家公司经营业绩的最佳指标！而不是收入增长率或者利润增长率，也不是净利率"
  - "平时我也做点股票，我会把过去连续 5~10 年平均 ROE 低于 15% 的企业全部排除掉，只关注那些长期平均 ROE＞15% 的企业。长期 ROE 高的公司不一定是优秀的公司，但是长期 ROE低 的公司一定不是优秀的公司"
  - "如果净资产收益率能够常年保持在15%以上，这时再看看其市盈率如何，如果低于同行业公司水平就可以将这只股票列入高度关注的范围"
  - "上市公司的净资产收益率往往在刚刚上市的几年中都有不错的表现，但之后，这个指标会明显下滑"
  - "长期保持良好的净资产收益率，可以给出更高的估值"
  - "净资产收益率实际上是财务分析中的核心分析指标，它认为一切企业的行为归根结底都在利润上"
  - "如果一家公司的净资产收益率可以多年维持在15%以上水平，那可以说是相当厉害！"
  - "只能说净资产收益率代表的是企业的盈利能力，并不代表企业的赚钱能力"
  - "净资产现金回收率，即经营现金净流量／平均净资产×100%，它反映了企业的赚钱能力"
  - "如果高的ROE主要来自于高的净利率，则这类公司的产品往往有一定的品牌力，从而进行差异化竞争，竞争相对不激烈"
  - "如果高的ROE主要来自高的总资产周转率，则这类公司通常竞争较激烈，收入高，毛利率、净利率指标较低，属于低成本“薄利多销”模式"
  - "如果高的ROE主要来自高的财务杠杆，则此类企业经营风险较大"
  - "高杠杆是个双刃剑，放大了盈利能力，但也增加了企业风险"
  - "企业破产很多时候不是因为没有账面利润，而是因为资金链紧张"
