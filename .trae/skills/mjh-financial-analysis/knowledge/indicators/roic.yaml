name: 投入资本回报率
key: roic
category: 盈利能力
alias: [ROIC, 资本投入回报率]
definition: 衡量股东和债权人投入的本钱到底获取了多少回报——从资本的角度看问题，既从股权的角度衡量回报，也从有息负债的角度衡量回报，这是一个生意的本质。
formula: ROIC=息前税后经营利润/（股东权益+有息负债）=NOPLAT/IC；他强调：①IC指期初的投入资本而非期末，包括有息负债、股东权益，并扣除非核心经营资产；②有些优秀的公司有大量的超额现金，计算IC时超额现金要扣除；③NOPLAT直接剔除了资本结构和非经常性损益的影响。投入资本的另一种算法：投入资本=总资产-无息流动负债（无息流动负债=应付票据+应付账款+预收款项+应付职工薪酬+应交税费+其他应付款+预提费用+流动负债中递延收益+其他流动负债）；有息负债包括短期借款、长期借款、应付债券等。常见口径还有：ROIC=净利润/（净资产+有息负债）、EBIT/（净资产+有息负债）、NOPAT/（净资产+有息负债）、（净利润+利息费用）/（净资产+有息负债）等，其中NOPAT=（营业利润+利息费用）×（1-税率）。引申指标：企业价值增加值EVA=IC×(ROIC-WACC)。
majinghao_view: |
  ROIC是麦肯锡给出的价值投资最核心的指标，是商业模式的核心指标，实实在在反映企业的价值创造能力。
  它是ROE非常好的补充：ROE的分子净利润容易被"造假"、常混入非经常性损益（上市公司卖个房子什么的常造成失真），且不少高ROE是加杠杆堆出来的；ROIC很好规避了这些扰动。
  ROIC必须与加权平均资本成本WACC比较（社会资本平均回报8%左右）：只有回报超过或预期超过WACC，公司才处于创造价值的区间，利润及业绩增长才有意义；ROIC-WACC大于0市场应给予正面估值，小于0甚至不给估值。ROIC很低的公司没有内生现金流、增长需要消耗大量资本，其商业模式肯定出了问题。
  资本投入回报率也对应着公司的盈利性现金创造能力——ROIC高，意味着企业能够创造更多的现金流、体现出更高的价值创造能力；若ROIC小于WACC，就说明投入资本的回报小于平均资本成本，公司是在浪费资本。
  三指标联动：ROE与ROA的差异反映负债多少；ROA与ROIC的差异反映无息负债多少（非常接近说明无息负债少、产业链地位不强）；ROE与ROIC的差异反映有息负债使用多少。
thresholds:
  healthy: ROIC大于15%其增长就较为良性；几年来一直维持在25%以上，基本可以断言这是一家商业模式对路、经营状况很好的公司
  watch: ROIC高于WACC（股东投入和借债的加权资金成本，社会资本平均回报8%左右）——一笔资本投入的回报率起码要大于加权平均资本成本，否则生意没有意义
  danger: ROIC一直低于10%能判断出是一家平庸的公司；ROIC持续低于WACC，其利润及业绩增长是无意义的，业务没有体现出创造价值的能力；ROIC很低说明商业模式肯定出了问题
fraud_signals:
  - ROIC的分子NOPLAT直接剔除资本结构和非经常性损益的影响——对照ROE，若ROE好看而ROIC平庸，高ROE可能是加杠杆堆出来的或净利润掺了非经常性损益（如卖房子）
  - 通过ROE、ROA、ROIC三者大小关系反推资金来源与产业链地位：ROE与ROIC越接近说明使用有息负债越少；若企业存在大量无息负债且（预收应付-应收预付）金额为正数——它在占用上下游资金，说明企业在产业链中的地位较强
