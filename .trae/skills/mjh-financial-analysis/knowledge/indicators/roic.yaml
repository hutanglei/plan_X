  - "如果一家公司的ROIC大于15%，其增长就较为良性，要是ROIC几年来一直维持在25%以上，基本可以断言：这是一家商业模式对路、经营状况很好的公司"
  - "相反，如果一家公司的ROIC一直低于10%，也能判断出这是一家平庸的公司"
  - "ROIC是ROE非常好的补充，ROIC很好的规避了上述这些因素的扰动，实实在在的反映了企业的价值创造能力"
  - "一笔资本投入的回报率起码要大于加权平均资本成本（社会资本平均回报为8%左右），否则生意没有意义"
  - "只有资本投入回报率高于加权平均资本成本，成长才有价值"
  - "ROIC很低的公司，没有内生现金流，增长需要消耗大量的资本。因此，ROIC很低的公司，其商业模式肯定出了问题"
  - "如果ROA高是由于无息负债少的原因，这时候，确实需要再去比较分析ROIC"
  - "如果ROIC小于WACC，就说明投入资本的回报小于平均资本成本，公司是在浪费资本"
