- company: 五粮液
  article: 26101386
  point: 2013年中报“递延所得税资产-应付职工薪酬”5.85亿元，按25%税率倒推累计多计提约23.4亿元职工薪酬已计入成本费用，构成未来可释放23.4亿元净利润的“利润储备”。
quotes:
- 寅吃卯粮。如提前确认收入，推迟确认费用，或干脆将费用资本化
- 费用资本化实际上是把费用计到了资产里面。费用本应计到利润表，却计到资产负债表中，就会使得利润增多。可以说，会计准则中的“费用资本化”是一个公然进行财务造假的概念，你把费用记作了“资产”，却不敢说“费用资产化”，搞出一个“资本化”的概念来迷惑大家，是从文字上隐蔽它是一个对财务信息扭曲很大的造假方式
- 从美化财报角度，我总结“将研发费用资本化”有三美：一美化利润，二美化资产，三美化现金流
- 比如一个亿的研发支出，进入当期费用就是减少一个亿的利润，但是如果转入无形资产，第一，“凭空”多了一个亿的利润；第二，总资产增加了一个亿；第三，资本化研发投入的现金流出不会记在经营性现金流出里，就会让公司经营活动现金流虚高一个亿
- 别人是造假的交易，它是造假的时间——把明天的饭记成今天的利润，再用今天的假利润去借明天的债
- 提前确认的收入不产生现金，只产生分红的理由和发债的资格
- 我认为，以公允价值计量的资产，在还没有实际处置前，将其价值变动都计入当期损益是不正确的，因为我们在会计核算上要遵循的最基本原则就是“不能提早确认收益
- 在建工程无需计提折旧，但固定资产需要。这样一来，企业如果推迟将在建工程转为固定资产，相应就会推迟计提折旧，从而减少当期费用，虚增当期利润
- 是否存在已经停工的在建工程继续财务费用资本化的情况
- 如果一家上市公司通过少结转产品成本的方式虚增利润，其特征为：1.毛利率异常，肯定高于可比年度，也肯定高于同行业企业。2.由于未及时结转的成本留存在存货（在产品、产成品）中，公司存货会越来越多，存货周转率也会明显下降
- 费用资本化处理其实是一场错误的游戏，费用资本化是没有任何道理的，要说有道理，那只能说是有做假账的道理。因此，我们在分析报表时，应该将资本化的费用也就是所谓的“资产”还原回费用的本来面目，去抵扣利润，这样的利润才更趋向于真实
- 任何费用资本化而形成的资产，都是资产负债表中披着资产外衣的“水分”，都是不愿意滚到利润表中的费用
- 研发支出资本化还是费用化向来是利润调节器，费用化影响当期利润，资本化计入无形资产后可以增加当期利润，但这些计入到无形资产中的研发费用在未来会通过摊销或减值的方式，重新回到利润表
- 对于所谓的可资本化处理的费用，在利润多的年份中，上市公司可能完全进行费用化处理，反正消化得了；而在利润少甚至亏损的年份中，就可能全部转为资本化处理，以确保利润达到想要的数额
- 可以通过资本化比例的调整任性地对财务数据耍流氓
- 费用资本化是用来骗外人的，骗不了自己
- 资产就是资产，费用终归是费用，不是资产的“资产”最终都得通过“大洗澡”减值，恢复其本来面目
- 长期待摊费用、开发支出甚至存货、在建工程、无形资产都是费用资本化的场所。原因无它，一切为了利润啊
- 乐视网多年以来将60%左右的研发费用资本化，这个比例是极其不正常的，将太多的“管理费用”从利润表中搬走到资产负债表中的“无形资产”中去了
- 从美化财报角度，我总结“将研发费用资本化”有三美：一美化利润，二美化资产，三美化现金流。比如一个亿的研发支出，进入当期费用就是减少一个亿的利润，但是如果转入无形资产，第一，“凭空”多了一个亿的利润；第二，总资产增加了一个亿；第三，资本化研发投入的现金流出不会记在经营性现金流出里，就会让公司经营活动现金流虚高一个亿。
- 上市公司的报表造假啊，主要就是想办法将该费用化的东东进行资本化处理，塞到资产负债表中去，让资产负债表肿肿的，资产虚胖虚胖的；民营企业的报表造假，主要就是想办法将该资本化的东东进行费用化处理，塞到利润表中去，让利润表看起来面黄肌廋的，好象几十年没吃饭。
- 费用资本化是没有任何道理的，要说有道理，那只能说是有做假账的道理。
- 我一直说利润不是东西，因为在现代会计制度下面，通过关联交易等手段，企业要做多少利润就可以做出多少利润，通过‘洗大澡’等手段，企业要做多少亏损就可以做出多少亏损。
