---
name: 寅吃卯粮
key: timing_shift
category: 造假识别
alias:
- 提前确认收入
- 推迟确认费用
- 费用资本化
- 期间错配造假
definition: 把明天的饭记成今天的利润——提前确认收入、推迟确认费用，或干脆把费用资本化，靠时间差把利润"做"出来，但现金并没有跟着来；与"洗大澡"（往亏损方向操纵）方向相反。费用资本化是其中最公然的一种：费用本应计到利润表，却计到了资产负债表中，记作了"资产"。
formula: 方法论：围绕动态会计平衡等式"资产+费用＝负债+所有者权益+收入"检验收入费用的时间错配——用净现比（经营活动现金流量净额/净利润）与现金流量偏离标准比率（经营性现金流量/(净利润+折旧+摊销)，正常应在1左右）识别利润与现金流的背离，用毛利率异常与存货堆积识别推迟确认费用；分析时应将资本化的费用即所谓的"资产"还原回费用的本来面目去抵扣利润，这样的利润才更趋向于真实（资本化的研发支出计入投资活动现金流"购建固定资产、无形资产和其他长期资产所支付的现金"，费用化的计入经营活动现金流，据此可还原）。
majinghao_view: |
  财务造假万变不离其宗，都是围绕"资产+费用＝负债+所有者权益+收入"这个动态会计平衡等式进行的：寅吃卯粮即提前确认收入、推迟确认费用、费用资本化，与无中生有、洗大澡并列为造假三分类。
  费用资本化是"一个公然进行财务造假的概念"——费用本应计到利润表，却计到了资产负债表中，从美化财报角度有"三美"：一美化利润，二美化资产，三美化现金流。
  费用资本化专论的完整逻辑：中国会计准则不应学国际会计准则将"研发"装模作样分为研究阶段（费用化）与开发阶段（符合条件资本化计入无形资产）；反对资本化的两大理由——一是无法判断研发投入未来究竟能给企业带来多少收益、效益延续多少会计年度，"收入成本配比"核心理由不能成立（若照此思路，销售部500万广告费拉来五年订单，销售费用是否也要资本化、按完工百分比法卖一台摊5万？），二是资本化确认在实际操作中主观性强、弹性空间太大，严重干扰实际利润、导致报表失去可比性；研发支出资本化还是费用化向来是利润调节器——利润好的年份费用化、利润差甚至亏损的年份全部资本化，且计入无形资产的研发费用未来仍会通过摊销或减值的方式重新回到利润表（出来混迟早要还）；资本化场所不止研发——长期待摊费用、开发支出甚至存货、在建工程、无形资产都是费用资本化的场所，"原因无它，一切为了利润"。
  玩时间造假比玩交易造假更隐蔽：别人是造假的交易，它是造假的时间——把明天的饭记成今天的利润，再用今天的假利润去借明天的债；提前确认的收入不产生现金，只产生分红的理由和发债的资格。
thresholds:
  healthy: 现金流量偏离标准比率（经营性现金流量/(净利润+折旧+摊销)）在1左右；较长周期（10年）净现比大于1。
  watch: 净现比低于0.7，利润造假可能性很大；收现比（销售商品收到的现金/营业收入）长期小于1；在建工程余额突然变大且迟迟不转固；一向100%费用化处理研发支出的公司突然转为资本化（会计估计变更）。
  danger: 净现比低于0.5可判断利润造假；净利润为正、经营现金流为负（净现比为负数）最危险；持续、大额的研发费用资本化且比例显著高于同业。
fraud_signals:
- 提前确认收入：收入确认时点大幅前移——恒大2021年财报调减超过6600亿元"以前年度收入"，等于自认此前并未按披露的会计政策确认收入；识别看收现比长期小于1、利润与经营现金流长期背离。
- 推迟确认费用/少结转成本：毛利率异常，肯定高于可比年度、也肯定高于同行业企业；未及时结转的成本留存存货中，存货越来越多、存货周转率明显下降。
- 费用资本化"三美"：一个亿研发支出进入当期费用就减少一个亿利润，转入无形资产则凭空多出一个亿利润、总资产多一个亿、经营活动现金流虚高一个亿（资本化研发投入的现金流出不计入经营性现金流出）。
- 反对研发资本化两大理由：一、无法判断研发投入未来究竟能带来多少收益、成果效益延续多少个会计年度——"收入成本配比"不能成立（广告费归谬：500万广告费拉来五年订单，销售费用要不要资本化？100台设备不确定每年发货几台，是否得借用完工百分比法卖一台摊5万？）；二、资本化确认主观性强、弹性空间太大，严重干扰实际利润、导致报表失去可比性（同为计算机类上市公司，科大讯飞资本化约48%、恒生电子假设也按55%资本化将多增7亿利润，两份报表无从对比）。
- 顺周期调节规律：对于可资本化处理的费用，利润多的年份完全费用化处理（反正消化得了），利润少甚至亏损的年份全部转为资本化处理，以确保利润达到想要的数额——可以通过资本化比例的调整任性地对财务数据耍流氓。
- 资本化场所全景：长期待摊费用、开发支出甚至存货、在建工程、无形资产都是费用资本化的场所——"原因无它，一切为了利润啊"。
- 滚雪球回表机制：资本化计入无形资产的研发费用，未来会通过摊销或减值的方式重新回到利润表，且随着每一年资本化项目的积累像滚雪球——出来混迟早要还。
- 现金流分类识别：资本化的研发支出放在投资活动现金流（"购建固定资产、无形资产和其他长期资产所支付的现金"），费用化的列入经营活动——既是现金流"三美"的机制所在，也是把资本化费用还原回费用、挤水分的抓手。
- 研发资本化高发行业：持续、大额的研发费用资本化主要发生在医药类公司以及高科技公司；研发费用在资本化和费用化之间很难量化，研发投入高的公司为使利润增速漂亮，大都选择较大比例的资本化。
- 折旧年限把戏：上市的钢铁企业为了增加利润，几乎都使用过调整固定资产的折旧年限或残值率这一"简单粗暴"的方式。
- 在建工程推迟转固：在建工程无需计提折旧、转固后需计提，推迟转固即推迟折旧、减少当期费用虚增利润；识别：在建工程/总资产远高于同行，或连续多年保持高额在建工程不转固。
- 已停工在建工程继续借款费用资本化：非正常中断连续超过3个月应暂停资本化，继续将财务费用记入在建工程而不恢复费用本来面目，即虚增当期利润。
- 利息藏进资产：恒大2017至2020年每年将450亿、599亿、509亿、694亿元利息资本化计入"开发中物业"，四年累计2252亿元，与提前确认收入相配合，共同承担"藏起真实利息负担、做大账面利润、支撑分红与发债"的功能。
- 收入确认政策突变回溯：公司变更会计处理方式、大额调减以前年度收入，是寅吃卯粮的自我暴露。
cases:
- company: 恒大地产
  article: '408262512'
  point: 不是虚构交易，而是把收了钱但还没交楼的项目提前确认收入（钱本该躺在合同负债里，交楼才能转收入），2019年虚增收入2139.89亿占当期营收50.78%、2020年虚增3501.57亿占78.54%，两年合计5641亿，再用假报表发208亿公司债构成欺诈发行。
- company: 紫晶存储
  article: '408262512'
  point: IPO期间通过虚构销售合同、伪造物流单据和验收单据入账、安排资金回款、提前确认收入等方式虚增收入利润，2017-2020累计虚增营收逾7亿，2023年被终止上市，实控人被批捕。
- company: 华锐风电
  article: '270891028'
  point: 通过提前确认收入进行收入类造假，与万福生科、海联讯、银广夏、金亚科技等同为收入类造假典型。
- company: 奇信股份
  article: '285811028'
  point: 通过签订虚假或放大金额的工程合同、对内部承包项目少计成本、体外支付少计费用等方式，2012-2019连续8年虚增利润总额逾26亿，每年虚增利润均超当期披露利润总额的100%。
- company: 科大讯飞
