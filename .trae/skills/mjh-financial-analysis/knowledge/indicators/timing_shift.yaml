- company: 恒生电子
  article: '169132504'
  point: 2017年12.79亿元研发投入基本费用化、净利润约11亿元；假设也按55%比例资本化，当期可增加7.03亿元利润——同为计算机类上市公司，处理差异之大使两份报表失去可比性。
- company: 乐视网
  article: '169132504'
  point: 多年以来将60%左右的研发费用资本化，比例极其不正常，将太多"管理费用"从利润表搬到资产负债表"无形资产"中；2011-2016年营收和净利润的快速稳健增长主要功臣就是研发费用资本化，若全部费用化，净利润在2011年之后一年不如一年、最后几年大幅亏损，最终计提大额无形资产减值损失——费用形不成资产，终究还是费用。
- company: 恒瑞医药
  article: '209225255'
  point: 之前对所有研发费用100%费用化处理（"以前在资本化方面做得很好"），2020年11月起面对集采竞争与高研发投入双重压力，进行会计估计变更转为资本化——资本化后2021年利润"更好看不少"，属迫于盈利压力开口子的利润管理信号。
