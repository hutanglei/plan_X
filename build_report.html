<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>建仓期异常交易扫描报告</title>
<style>
:root {
  --bg: #0a0e14;
  --card: #131820;
  --border: #1e2936;
  --text: #c8d6e5;
  --text-dim: #6b7d95;
  --accent: #f0a040;
  --accent2: #40b8f0;
  --danger: #e0556a;
  --success: #4ecb71;
  --warn: #f0c040;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
}
.container { max-width: 1200px; margin: 0 auto; padding: 24px 20px; }

/* Header */
.header {
  text-align: center;
  padding: 48px 0 36px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 32px;
}
.header h1 {
  font-size: 2rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: #fff;
  margin-bottom: 8px;
}
.header .subtitle {
  font-size: 0.9rem;
  color: var(--text-dim);
  letter-spacing: 0.06em;
}

/* KPI Cards */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 16px;
  margin-bottom: 32px;
}
.kpi-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 20px;
  text-align: center;
  transition: border-color 0.2s;
}
.kpi-card:hover { border-color: var(--accent); }
.kpi-card .value {
  font-size: 2.2rem;
  font-weight: 700;
  color: #fff;
  line-height: 1.2;
}
.kpi-card .value.accent { color: var(--accent); }
.kpi-card .value.accent2 { color: var(--accent2); }
.kpi-card .value.danger { color: var(--danger); }
.kpi-card .value.success { color: var(--success); }
.kpi-card .label {
  font-size: 0.82rem;
  color: var(--text-dim);
  margin-top: 4px;
}

/* Section */
.section {
  margin-bottom: 32px;
}
.section-title {
  font-size: 1.15rem;
  font-weight: 600;
  color: #fff;
  margin-bottom: 16px;
  padding-left: 12px;
  border-left: 3px solid var(--accent);
}

/* Grid 2-col */
.grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
@media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }

/* Card */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 20px;
}

/* Bar Chart */
.bar-chart { display: flex; flex-direction: column; gap: 8px; }
.bar-row { display: flex; align-items: center; gap: 10px; }
.bar-label { width: 110px; font-size: 0.82rem; color: var(--text-dim); text-align: right; flex-shrink: 0; }
.bar-track { flex: 1; height: 22px; background: var(--border); border-radius: 4px; overflow: hidden; position: relative; }
.bar-fill {
  height: 100%;
  border-radius: 4px;
  transition: width 0.6s ease;
  display: flex; align-items: center; padding-left: 8px;
  font-size: 0.75rem; font-weight: 600; color: #fff;
}
.bar-fill.d8 { background: linear-gradient(90deg, #5b7fff, #3d5ce5); }
.bar-fill.d9 { background: linear-gradient(90deg, #f0a040, #d08020); }
.bar-fill.d10 { background: linear-gradient(90deg, #4ecb71, #2ea050); }
.bar-fill.d11 { background: linear-gradient(90deg, #e0556a, #c03050); }
.bar-fill.d12 { background: linear-gradient(90deg, #40b8f0, #2090d0); }
.bar-fill.d13 { background: linear-gradient(90deg, #a855f7, #8030d0); }
.bar-fill.d14 { background: linear-gradient(90deg, #14b8a6, #0d9488); }

/* Histogram */
.hist-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.hist-label { width: 70px; font-size: 0.78rem; color: var(--text-dim); text-align: right; flex-shrink: 0; }
.hist-bar { flex: 1; height: 20px; background: var(--border); border-radius: 3px; overflow: hidden; }
.hist-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.5s; }
.hist-count { width: 36px; font-size: 0.78rem; color: var(--text); text-align: left; }

/* Table */
table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
th { text-align: left; padding: 10px 12px; color: var(--text-dim); font-weight: 600; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 2px solid var(--border); }
td { padding: 9px 12px; border-bottom: 1px solid var(--border); }
tr:hover td { background: rgba(255,255,255,0.02); }
.badge {
  display: inline-block; padding: 2px 8px; border-radius: 4px;
  font-size: 0.72rem; font-weight: 600;
}
.badge.manipulation { background: rgba(240,160,64,0.15); color: var(--accent); }
.badge.insider { background: rgba(224,85,106,0.15); color: var(--danger); }
.badge.high { background: rgba(224,85,106,0.12); color: var(--danger); }
.badge.mid { background: rgba(240,192,64,0.12); color: var(--warn); }
.badge.strong { background: rgba(78,203,113,0.12); color: var(--success); }
.badge.suspect { background: rgba(240,192,64,0.12); color: var(--warn); }

/* Combo list */
.combo-list { list-style: none; }
.combo-list li {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 0; border-bottom: 1px solid var(--border);
  font-size: 0.84rem;
}
.combo-list li:last-child { border-bottom: none; }
.combo-tags { display: flex; gap: 4px; flex-wrap: wrap; }
.combo-tag {
  display: inline-block; padding: 1px 6px; border-radius: 3px;
  font-size: 0.7rem; font-weight: 600; background: rgba(240,160,64,0.12); color: var(--accent);
}
.combo-count { color: var(--text-dim); font-size: 0.82rem; }

/* Co-occurrence */
.cooccur-grid { display: flex; flex-wrap: wrap; gap: 6px; }
.cooccur-item {
  padding: 4px 10px; border-radius: 4px;
  font-size: 0.75rem; background: rgba(64,184,240,0.08);
  border: 1px solid rgba(64,184,240,0.2);
  color: var(--accent2);
}

/* Footer */
.footer {
  text-align: center; padding: 32px 0;
  color: var(--text-dim); font-size: 0.78rem;
  border-top: 1px solid var(--border); margin-top: 32px;
}

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* Responsive table */
.table-wrap { overflow-x: auto; }

/* Signal distribution */
.signal-row { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.signal-name { width: 120px; font-size: 0.84rem; color: var(--text); }
.signal-bar { flex: 1; height: 24px; background: var(--border); border-radius: 4px; overflow: hidden; }
.signal-fill { height: 100%; border-radius: 4px; display: flex; align-items: center; padding-left: 10px; font-size: 0.78rem; font-weight: 600; color: #fff; }
.signal-fill.strong { background: linear-gradient(90deg, #4ecb71, #2ea050); }
.signal-fill.suspect { background: linear-gradient(90deg, #f0c040, #c09020); }

/* Cross table */
.cross-table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
.cross-table th, .cross-table td { padding: 8px 14px; text-align: center; border: 1px solid var(--border); }
.cross-table th { background: rgba(255,255,255,0.03); color: var(--text-dim); font-weight: 600; }
.cross-table td { color: var(--text); }

/* Tooltip for alert types */
.alert-types { font-size: 0.78rem; color: var(--text-dim); max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
