.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn.active{background:var(--primary);border-color:var(--primary);color:#fff}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden;font-size:13px}
thead th{background:#fafafa;color:var(--text-2);font-weight:600;padding:10px 8px;text-align:left;border-bottom:2px solid var(--border);position:sticky;top:0;white-space:nowrap}
tbody td{padding:9px 8px;border-bottom:1px solid var(--border);vertical-align:top}
tbody tr:hover{background:#f0f7ff}
tbody tr.detail-row{background:#fbfcfd}
tbody tr.detail-row td{padding:0}
.detail-box{padding:12px 16px;background:#fafbfc;color:var(--text-2);font-size:12px;border-top:1px dashed var(--border)}
.detail-box b{color:var(--text)}
.code{font-family:Consolas,monospace;font-size:12px;color:var(--text-3)}
.name{font-weight:600;color:var(--text)}
.fic{color:var(--primary);font-weight:500}
.step{display:inline-block;width:26px;height:26px;line-height:26px;text-align:center;border-radius:50%;font-weight:700;font-size:13px;color:#fff}
.step.s0{background:var(--green)} .step.s1{background:#85ce61}
.step.s2{background:var(--yellow)} .step.s3{background:var(--orange)}
.step.s4{background:var(--red)} .step.s5{background:var(--dark)}
.t-time{font-size:12px;white-space:nowrap}
.t-smooth{color:var(--green)} .t-normal{color:var(--yellow)} .t-delay{color:var(--red)}
.t-done{color:var(--text-3)}
.stage{font-size:12px;color:var(--text-2)}
.stage.done{color:var(--green);font-weight:600}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:3px;margin-left:4px}
.tag.a{background:#ecf5ff;color:var(--primary);border:1px solid #d9ecff}

.foot{margin-top:16px;color:var(--text-3);font-size:12px;text-align:center}

const tbody=document.getElementById('tbody');
let filter={market:'all',status:'all'};

function marketOf(code){return code.endsWith('.SH')||code.endsWith('.SZ')?'a':'h'}
function statusOf(step){
  if(step===0)return'done'; if(step<=1)return'soon';
  if(step<=3)return'mid'; return'early';
}
function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

  tbody.innerHTML='';
  DATA.forEach((r,idx)=>{
    const m=marketOf(r[0]); const s=statusOf(r[6]);
    if(filter.market!=='all'&&filter.market!==m)return;
    if(filter.status!=='all'&&filter.status!==s)return;
    const step=r[6];
    const isDone=step===0;
    const tr=document.createElement('tr');
    tr.style.cursor='pointer';
    const tSmooth=r[12],tNormal=r[13],tDelay=r[14];
    const cs=(t)=>t.indexOf('已上市')>=0?'t-done':'t-smooth';
    const cn=(t)=>t.indexOf('已上市')>=0?'t-done':'t-normal';
    const cd=(t)=>t.indexOf('已上市')>=0?'t-done':'t-delay';
    const accelTag=r[16]==='加速'?'<span class="accel">加速</span>':'';
    tr.innerHTML=`
      <td class="code">${r[0]}</td>
      <td class="name">${r[1]}<span class="tag ${m==='a'?'a':'h'}">${m==='a'?'A股':'港股'}</span>${accelTag}</td>
      <td class="fic">${r[2]}</td>
      <td>${r[3]}</td>
      <td>${r[4]}</td>
      <td class="stage ${isDone?'done':''}">${r[5]}</td>
      <td><span class="step s${step}">${step}</span></td>
      <td class="t-time ${cs(tSmooth)}">${tSmooth}</td>
      <td class="t-time ${cn(tNormal)}">${tNormal}</td>
      <td class="t-time ${cd(tDelay)}">${tDelay}</td>
      <td class="muted">${r[10]}</td>
      <td class="muted">${r[11]}</td>
      <td class="muted">${m==='a'?'A':'H'}</td>`;
    const dr=document.createElement('tr');
    dr.className='detail-row';dr.style.display='none';
    dr.innerHTML=`<td colspan="13"><div class="detail-box">
      <b>最新进展：</b>${r[7]}（${r[8]}）<br>
      <b>剩余关键步骤：</b>${r[7]} <b>步骤数：</b>${step}<br>
      <b>信息来源：</b>${r[12+0+2]?r[12]:'-'}<br>
      <b>估算依据：</b>${r[15]}${r[16]==='加速'?'<br><b style="color:#67c23a">加速路径：已纳入附条件批准/单臂报产等加速审批路径</b>':''}
    </div></td>`;
    tr.onclick=()=>{dr.style.display=dr.style.display==='none'?'':'none'};
    tbody.appendChild(tr);tbody.appendChild(dr);
  });
  if(tbody.children.length===0)tbody.innerHTML='<tr><td colspan="13" style="text-align:center;padding:30px;color:#909399">无符合条件的数据</td></tr>';
}

document.querySelectorAll('.btn').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll(`.btn[data-f="${b.dataset.f}"]`).forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    filter[b.dataset.f]=b.dataset.v;
    render();
  };
});

renderStats();render();
</script>
</body>
</html>
